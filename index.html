<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recall Desk</title>
<meta name="description" content="Flashcards, multiple choice, typed recall, and matching drills for course terms.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%82%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --ground:#EDF0F4;
  --surface:#FFFFFF;
  --surface-2:#F5F7FA;
  --ink:#141A26;
  --ink-soft:#5C6779;
  --ink-faint:#8A94A6;
  --rule:#D3DAE4;
  --rule-soft:#E4E9F0;
  --accent:#2B4C9B;
  --accent-ink:#FFFFFF;
  --accent-wash:#E5EBF8;
  --brass:#B07D2B;
  --brass-wash:#F6EDDC;
  --good:#1F7A5A;
  --good-wash:#E2F1EB;
  --bad:#B03A3A;
  --bad-wash:#F7E6E5;
  --shadow:0 1px 2px rgba(20,26,38,.06),0 8px 24px -12px rgba(20,26,38,.22);
  --shadow-lift:0 2px 4px rgba(20,26,38,.08),0 18px 40px -16px rgba(20,26,38,.30);
  --ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --rail:264px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F131C;
    --surface:#171D28;
    --surface-2:#1E2533;
    --ink:#E7EBF3;
    --ink-soft:#9BA6B9;
    --ink-faint:#6E7A8F;
    --rule:#2A3342;
    --rule-soft:#222A37;
    --accent:#7C9CEC;
    --accent-ink:#101728;
    --accent-wash:#1D2740;
    --brass:#D9A64F;
    --brass-wash:#2C2418;
    --good:#4FBF92;
    --good-wash:#152A24;
    --bad:#E4736F;
    --bad-wash:#2C1A1B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lift:0 2px 4px rgba(0,0,0,.5),0 18px 40px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0F131C;
  --surface:#171D28;
  --surface-2:#1E2533;
  --ink:#E7EBF3;
  --ink-soft:#9BA6B9;
  --ink-faint:#6E7A8F;
  --rule:#2A3342;
  --rule-soft:#222A37;
  --accent:#7C9CEC;
  --accent-ink:#101728;
  --accent-wash:#1D2740;
  --brass:#D9A64F;
  --brass-wash:#2C2418;
  --good:#4FBF92;
  --good-wash:#152A24;
  --bad:#E4736F;
  --bad-wash:#2C1A1B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lift:0 2px 4px rgba(0,0,0,.5),0 18px 40px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
kbd{font-family:var(--mono);font-size:11px;background:var(--surface-2);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink-soft)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}

/* ---- chrome ---- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{border-right:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--rule-soft);display:flex;align-items:baseline;gap:9px}
.brand h1{font-size:17px;letter-spacing:-.02em}
.brand .tag{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.04em}
.rail-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.decks{list-style:none;margin:0;padding:0 10px 10px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:2px}
.deck-btn{width:100%;text-align:left;padding:9px 10px;border-radius:7px;display:flex;align-items:baseline;gap:8px;color:var(--ink-soft);transition:background .12s}
.deck-btn:hover{background:var(--surface-2)}
.deck-btn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.deck-btn .ct{font-family:var(--mono);font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.deck-btn[aria-current="true"]{background:var(--accent-wash);color:var(--ink);box-shadow:inset 2px 0 0 var(--accent)}
.rail-foot{border-top:1px solid var(--rule-soft);padding:12px 18px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-faint);width:100%;text-align:left;transition:background .12s}
.rail-foot:hover{background:var(--surface-2);color:var(--ink-soft)}
.dot.edit{background:var(--brass)}
/* sign-in + publish */
.signin{max-width:440px;margin:0 auto}
.signin .panel{padding:22px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.field input{width:100%}
.err{font-size:13px;color:var(--bad);margin:0 0 10px}
.hr{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--ink-faint);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.hr::before,.hr::after{content:"";flex:1;height:1px;background:var(--rule-soft)}
.pubbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 15px;border:1px solid var(--brass);background:var(--brass-wash);border-radius:9px;margin-bottom:16px;font-size:13px;color:var(--brass)}
.pubbar b{font-weight:600}
.pubbar.busy{border-color:var(--rule);background:var(--surface-2);color:var(--ink-soft)}
.pubbar.fail{border-color:var(--bad);background:var(--bad-wash);color:var(--bad)}
.pubbar code{font-family:var(--mono);font-size:12px}
.steps{margin:0 0 14px;padding-left:20px;font-size:13px;color:var(--ink-soft);line-height:1.65}
.steps li{margin-bottom:4px}
.steps code{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--rule-soft);border-radius:4px;padding:1px 5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.dot.off{background:var(--ink-faint)}

.stage{padding:28px 32px 56px;max-width:1080px;width:100%}
.stage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.stage-head h2{font-size:26px;letter-spacing:-.025em}
.sub{color:var(--ink-soft);font-size:13px;margin-top:3px}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);font-weight:500;font-size:14px;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--ink-faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;color:var(--ink-soft)}
.btn.ghost:hover{background:var(--surface-2);border-color:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--rule)}
.btn.danger:hover{border-color:var(--bad);background:var(--bad-wash)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---- mode tiles ---- */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px;margin:0 0 26px}
.mode{text-align:left;padding:16px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;gap:5px;transition:box-shadow .14s,border-color .14s,transform .14s}
.mode:hover:not(:disabled){box-shadow:var(--shadow-lift);border-color:var(--accent);transform:translateY(-1px)}
.mode .mt{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.mode .md{font-size:12.5px;color:var(--ink-soft);line-height:1.45}
.mode svg{flex:none;color:var(--accent)}

/* ---- deck summary ---- */
.summary{display:flex;gap:26px;align-items:center;padding:16px 20px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);margin-bottom:22px;flex-wrap:wrap}
.ring{flex:none}
.stat{display:flex;flex-direction:column;gap:1px}
.stat .v{font-family:var(--mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.stat .v.brass{color:var(--brass)}
.stat .v.bad{color:var(--bad)}

/* ---- options bar ---- */
.opts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{padding:6px 12px;font-size:13px;color:var(--ink-soft);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--accent-wash);color:var(--ink);font-weight:600}

/* ---- the card ---- */
.deskrow{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.counter{font-family:var(--mono);font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.track{height:3px;background:var(--rule-soft);border-radius:99px;overflow:hidden;margin-bottom:20px}
.track>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .28s ease}
.cardwrap{perspective:1600px;margin-bottom:16px}
.card{position:relative;min-height:340px;transform-style:preserve-3d;transition:transform .46s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.card.flipped{transform:rotateX(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:52px 44px 44px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:auto}
.face::before{content:"";position:absolute;left:0;right:0;top:34px;height:1px;background:var(--bad);opacity:.22}
.face.back{transform:rotateX(180deg)}
.face .role{position:absolute;top:10px;left:20px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.face .star{position:absolute;top:8px;right:14px;padding:6px;border-radius:6px;color:var(--ink-faint);line-height:0}
.face .star[aria-pressed="true"]{color:var(--brass)}
.face .star:hover{background:var(--surface-2)}
.facetext{font-family:var(--read);font-size:27px;line-height:1.34;max-width:34ch;letter-spacing:-.01em}
.face.back .facetext{font-size:21px;max-width:46ch;line-height:1.5}
.hintline{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--ink-faint)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}

.rowctl{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.judge{display:flex;gap:10px;justify-content:center;margin-top:4px}
.judge .btn{min-width:150px;justify-content:center}
.judge .know{border-color:var(--good);color:var(--good)}
.judge .know:hover{background:var(--good-wash)}
.judge .again{border-color:var(--brass);color:var(--brass)}
.judge .again:hover{background:var(--brass-wash)}

/* ---- quiz ---- */
.prompt{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:34px 32px;margin-bottom:16px;text-align:center}
.prompt .role{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:12px}
.prompt .q{font-family:var(--read);font-size:25px;line-height:1.35;max-width:40ch;margin:0 auto;letter-spacing:-.01em}
.choices{display:grid;gap:9px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 15px;border:1px solid var(--rule);border-radius:9px;background:var(--surface);font-family:var(--read);font-size:16px;line-height:1.45;transition:border-color .12s,background .12s}
.choice:hover:not(:disabled){border-color:var(--accent);background:var(--accent-wash)}
.choice .key{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-faint);border:1px solid var(--rule);border-radius:5px;width:20px;height:20px;display:grid;place-items:center;flex:none;margin-top:2px}
.choice.right{border-color:var(--good);background:var(--good-wash)}
.choice.right .key{border-color:var(--good);color:var(--good)}
.choice.wrong{border-color:var(--bad);background:var(--bad-wash)}
.choice.wrong .key{border-color:var(--bad);color:var(--bad)}
.choice:disabled{cursor:default}
.verdict{margin-top:14px;padding:12px 15px;border-radius:9px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.verdict.ok{background:var(--good-wash);color:var(--good)}
.verdict.no{background:var(--bad-wash);color:var(--bad)}
.verdict.near{background:var(--brass-wash);color:var(--brass)}
.verdict b{font-family:var(--read);font-weight:600}

/* ---- write mode ---- */
.answer{width:100%;padding:14px 16px;border:1px solid var(--rule);border-radius:9px;background:var(--surface);font-family:var(--read);font-size:19px}
.answer:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-wash)}

/* ---- match ---- */
.matchgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{min-height:104px;padding:14px;border:1px solid var(--rule);border-radius:9px;background:var(--surface);display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;line-height:1.35;transition:border-color .12s,background .12s,opacity .3s,transform .18s}
.tile.term{font-family:var(--ui);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.tile.def{font-family:var(--read)}
.tile:hover:not(:disabled):not(.done){border-color:var(--accent)}
.tile.sel{border-color:var(--accent);background:var(--accent-wash)}
.tile.done{opacity:.22;pointer-events:none;border-style:dashed}
.tile.miss{border-color:var(--bad);background:var(--bad-wash);animation:shake .34s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.tile.miss{animation:none}}

/* ---- results ---- */
.result{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:30px;text-align:center;margin-bottom:18px}
.result .score{font-family:var(--mono);font-size:52px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.missed{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:1px;text-align:left;border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.missed li{display:grid;grid-template-columns:minmax(120px,1fr) 1.4fr;gap:16px;padding:11px 14px;background:var(--surface);border-bottom:1px solid var(--rule-soft);font-size:14px}
.missed li:last-child{border-bottom:none}
.missed .t{font-weight:600}
.missed .d{font-family:var(--read);color:var(--ink-soft)}

/* ---- editor ---- */
.editbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.saveflag{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);letter-spacing:.04em}
.rows{display:flex;flex-direction:column;gap:1px;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--rule-soft)}
.rowhead{display:grid;grid-template-columns:34px 1fr 1.5fr 34px;gap:10px;padding:8px 12px;background:var(--surface-2);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.row{display:grid;grid-template-columns:34px 1fr 1.5fr 34px;gap:10px;padding:8px 12px;background:var(--surface);align-items:start}
.row .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);padding-top:9px;font-variant-numeric:tabular-nums}
.row textarea{width:100%;border:1px solid transparent;border-radius:6px;background:transparent;padding:7px 8px;resize:vertical;min-height:38px;font-size:14px}
.row textarea.def{font-family:var(--read);font-size:15px}
.row textarea:hover{border-color:var(--rule)}
.row textarea:focus{border-color:var(--accent);outline:none;background:var(--surface-2)}
.row .del{color:var(--ink-faint);padding:8px;border-radius:6px;line-height:0}
.row .del:hover{color:var(--bad);background:var(--bad-wash)}

.panel{border:1px solid var(--rule);border-radius:10px;background:var(--surface);padding:18px;margin-bottom:16px}
.panel h3{font-size:15px;margin-bottom:4px}
.panel p{margin:0 0 12px;font-size:13px;color:var(--ink-soft)}
.paste{width:100%;min-height:132px;border:1px solid var(--rule);border-radius:8px;padding:11px 12px;background:var(--surface-2);font-family:var(--mono);font-size:13px;line-height:1.6;resize:vertical}
.paste:focus{border-color:var(--accent);outline:none}
select{border:1px solid var(--rule);border-radius:8px;padding:7px 10px;background:var(--surface);font-size:13.5px}
input.text{border:1px solid var(--rule);border-radius:8px;padding:8px 11px;background:var(--surface);font-size:14px}
input.text:focus{border-color:var(--accent);outline:none}

.empty{border:1px dashed var(--rule);border-radius:12px;padding:44px 30px;text-align:center;color:var(--ink-soft);background:var(--surface)}
.empty h3{font-size:17px;margin-bottom:6px;color:var(--ink)}
.empty p{margin:0 auto 16px;max-width:46ch;font-size:14px}

.notice{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:9px;background:var(--brass-wash);color:var(--brass);font-size:13px;margin-bottom:18px;border:1px solid transparent}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:99px;font-size:13.5px;box-shadow:var(--shadow-lift);z-index:50}

.railtoggle{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--rule)}
  .rail[hidden]{display:none}
  .decks{max-height:260px}
  .railtoggle{display:inline-flex}
  .stage{padding:20px 18px 48px}
  .facetext{font-size:22px}
  .face{padding:48px 24px 40px}
  .row,.rowhead{grid-template-columns:24px 1fr 34px;}
  .row .def-cell{grid-column:2/4}
  .rowhead .h-def{display:none}
  .missed li{grid-template-columns:1fr}
}
</style>

</head>
<body>

<div class="app">
  <aside class="rail" id="rail">
    <div class="brand"><h1>Recall Desk</h1><span class="tag">v1</span></div>
    <div class="rail-head"><span class="eyebrow">Decks</span><span id="newdeckslot"></span></div>
    <ul class="decks" id="decks"></ul>
    <button class="rail-foot" id="whobtn"><span class="dot off" id="syncdot"></span><span id="syncmsg">Loading…</span></button>
  </aside>
  <main class="stage" id="stage"></main>
</div>

<script>
(function(){
"use strict";

/* ============================ tiny helpers ============================ */
var $ = function(id){return document.getElementById(id);};
var stage = $("stage");
function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k === "class") n.className = attrs[k];
    else if(k === "html") n.innerHTML = attrs[k];
    else if(k === "text") n.textContent = attrs[k];
    else if(k.slice(0,2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  }
  if(kids) kids.forEach(function(c){ if(c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return n;
}
function icon(d, size){
  var s = document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("width", size||16); s.setAttribute("height", size||16);

function norm(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9\s]/g," ").replace(/\b(a|an|the)\b/g," ").replace(/\s+/g," ").trim();
}
function lev(a,b){
  if(a === b) return 0;
  if(!a.length) return b.length; if(!b.length) return a.length;
  var prev = [], cur = [], i, j;
  for(j=0;j<=b.length;j++) prev[j] = j;
  for(i=1;i<=a.length;i++){
    cur[0] = i;
    for(j=1;j<=b.length;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    for(j=0;j<=b.length;j++) prev[j] = cur[j];
  }
  return prev[b.length];
}
// -> "exact" | "near" | "no"
function grade(given, target){
  var g = norm(given); if(!g) return "no";
  var alts = String(target||"").split("/").map(norm).filter(Boolean);
  if(!alts.length) alts = [norm(target)];
  var best = "no";
  alts.forEach(function(t){
    if(!t) return;
    if(g === t){ best = "exact"; return; }
    if(best === "exact") return;
    var tol = Math.max(1, Math.floor(t.length / 8));
    if(lev(g, t) <= tol) best = "near";
  });
  return best;
}

/* ---------------- publishing straight to the repo ----------------
   The editor commits decks.json through the GitHub API with a fine-grained token
   that lives only in this browser. Unlocking the editor is therefore no longer
   enough to publish — you also need the token, which is never in the code. */
var GH_OWNER = "homejeopardy", GH_REPO = "recall-desk", GH_BRANCH = "main", GH_FILE = "decks.json";
var GH_API = "https://api.github.com/repos/" + GH_OWNER + "/" + GH_REPO + "/contents/" + GH_FILE;

function b64utf8(str){
  var bytes = new TextEncoder().encode(str), out = "";

  };
  opts.cache = "no-store";

  if(res.status === 401) return "GitHub rejected the token. It may have expired — connect a new one.";
  if(res.status === 403) return "That token isn't allowed to write to this repo. It needs Contents: Read and write on recall-desk.";
  if(res.status === 404) return "GitHub can't see " + GH_OWNER + "/" + GH_REPO + ". Either the repo doesn't exist yet or the token wasn't given access to it.";
  if(res.status === 409 || res.status === 422) return "The file changed on GitHub while you were editing. Reload the page, then redo this change.";
  return "GitHub returned " + res.status + ". Try again in a moment.";
}

function publish(){

  ghFetch(GH_API + "?ref=" + GH_BRANCH).then(function(res){
    if(res.status === 404) return null;              // first publish, file not there yet
    if(!res.ok) throw new Error(ghError(res));
    return res.json();
  }).then(function(existing){
    var body = {
      message: "Update decks (" + payload.decks.length + " deck" + (payload.decks.length === 1 ? "" : "s") + ", " +
               payload.decks.reduce(function(n,d){ return n + d.cards.length; }, 0) + " cards)",
      content: b64utf8(json),

  }).then(function(res){
    if(!res.ok) throw new Error(ghError(res));
    return res.json();

/* ---------------- multiple choice ---------------- */
function buildChoices(c, all){
  var right = ans(c);
  var others = [];
  all.forEach(function(o){
    if(o.id === c.id) return;
    var a = ans(o);
    if(a && norm(a) !== norm(right) && others.indexOf(a) === -1) others.push(a);
  });
  var picks = shuffled(others).slice(0, 3);
  return shuffled(picks.concat([right]));
}
function renderQuiz(){
  var s = S.session; if(!s) return go("home");

  var c = s.cards[s.i];
  var allCards = cardsOf(deck());
  if(!s.choices || s.choicesFor !== c.id){ s.choices = buildChoices(c, allCards); s.choicesFor = c.id; }
  stage.appendChild(modeHead("Multiple choice"));
  stage.appendChild(el("div",{class:"deskrow"},[
    el("span",{class:"counter",text:(s.i+1) + " / " + s.cards.length}),
    el("span",{class:"counter",text:s.correct + " correct"})

  stage.appendChild(el("div",{class:"prompt"},[

    el("div",{class:"q",text:ask(c) || "—"})
  ]));

  var right = ans(c);
  var wrap = el("div",{class:"choices"});
  s.choices.forEach(function(opt, idx){

    stage.appendChild(el("div",{class:"verdict " + (wasRight ? "ok" : "no")},[
      el("span",{},[ wasRight ? "Correct." : "Not quite — the answer is ", wasRight ? null : el("b",{text:right}) ]),
      el("button",{class:"btn sm",onclick:nextQuiz},[ s.i + 1 >= s.cards.length ? "See score" : "Next", icon("M9 6l6 6-6 6",14)])
    ]));
  } else {
    stage.appendChild(el("div",{style:"margin-top:12px;font-size:11.5px;color:var(--ink-faint);text-align:center",html:'Press <kbd>1</kbd>–<kbd>4</kbd> to answer'}));
  }

/* ---------------- matching ---------------- */
var matchTimer = null;
function startMatch(order){
  var picked = order.slice(0, Math.min(6, order.length));
  var tiles = [];
  picked.forEach(function(c){
    tiles.push({id:c.id, kind:"term", text:c.term || "—"});
    tiles.push({id:c.id, kind:"def", text:c.def || "—"});
  });
  S.session = {mode:"match", pairs:picked.length, tiles:shuffled(tiles), sel:null, done:{}, miss:null, start:Date.now(), elapsed:0, over:false, errors:0};
  clearInterval(matchTimer);
  matchTimer = setInterval(function(){
    var s = S.session;
    if(!s || s.mode !== "match" || s.over){ clearInterval(matchTimer); return; }
    s.elapsed = (Date.now() - s.start)/1000;
    var t = $("mtimer"); if(t) t.textContent = s.elapsed.toFixed(1) + "s";
  }, 100);
}
function renderMatch(){
  var s = S.session; if(!s || s.mode !== "match") return go("home");
  var d = deck(), best = (S.bests[d.id] || {})[s.pairs];
  stage.appendChild(modeHead("Matching"));
  if(s.over){
    clearInterval(matchTimer);
    var isBest = !best || s.elapsed < best;
    if(isBest){ (S.bests[d.id] = S.bests[d.id] || {})[s.pairs] = s.elapsed; saveLocal(); }
    stage.appendChild(el("div",{class:"result"},[
      el("div",{class:"eyebrow",text: isBest ? "New best time" : "Cleared"}),
      el("div",{class:"score",text:s.elapsed.toFixed(1) + "s"}),
      el("p",{style:"margin:2px 0 20px;color:var(--ink-soft);font-size:14px",text: s.pairs + " pairs · " + s.errors + (s.errors === 1 ? " wrong pairing" : " wrong pairings") + (best && !isBest ? " · best " + best.toFixed(1) + "s" : "")}),
      el("div",{class:"rowctl"},[
        el("button",{class:"btn primary",onclick:function(){ startMode("match"); }},["Play again"]),
        el("button",{class:"btn ghost",onclick:function(){ S.session=null; go("home"); }},["Back to deck"])
      ])
    ]));
    return;
  }
  var left = s.pairs - Object.keys(s.done).length;
  stage.appendChild(el("div",{class:"deskrow"},[
    el("span",{class:"counter",id:"mtimer",text:s.elapsed.toFixed(1) + "s"}),
    el("span",{class:"counter",text:left + " " + (left === 1 ? "pair" : "pairs") + " left" + (best ? " · best " + best.toFixed(1) + "s" : "")})
  ]));
  var grid = el("div",{class:"matchgrid"});
  s.tiles.forEach(function(t, idx){
    var cls = "tile " + t.kind;
    if(s.done[t.id]) cls += " done";
    else if(s.sel === idx) cls += " sel";
    else if(s.miss === idx) cls += " miss";
    grid.appendChild(el("button",{class:cls, text:t.text, onclick:function(){ tapTile(idx); }}));
  });
  stage.appendChild(grid);
}
function tapTile(idx){
  var s = S.session, t = s.tiles[idx];
  if(s.done[t.id] || s.miss !== null) return;
  if(s.sel === null){ s.sel = idx; return render(); }
  if(s.sel === idx){ s.sel = null; return render(); }
  var a = s.tiles[s.sel];
  if(a.id === t.id && a.kind !== t.kind){
    s.done[t.id] = true; s.sel = null;
    record(t.id, true);
    if(Object.keys(s.done).length === s.pairs){ s.over = true; s.elapsed = (Date.now() - s.start)/1000; }
    return render();
  }
  s.errors++;
  record(t.id, false);
  s.miss = idx; render();
  setTimeout(function(){ if(S.session === s){ s.miss = null; s.sel = null; render(); } }, 420);
}

    el("option",{value:"custom",text:"Something else…"})
  ]);
  custom = el("input",{class:"text",hidden:"hidden",placeholder:"e.g.  ||",style:"width:120px",oninput:refresh});
  preview = el("span",{class:"saveflag",text:"Nothing to import yet."});

  var panel = el("div",{class:"panel",id:"pastepanel",hidden:"hidden"},[
    el("h3",{text:"Paste a list"}),
    el("p",{text:"One card per line, term first. Straight from a spreadsheet column pair, a Word table, or your outline."}),
    box,
    el("div",{class:"rowctl",style:"justify-content:flex-start;margin-top:12px"},[
      el("span",{style:"font-size:12.5px;color:var(--ink-soft)",text:"Split on"}), sepSel, custom, preview,
      el("div",{style:"flex:1"}),
      el("button",{class:"btn",onclick:function(){ box.value=""; refresh(); }},["Clear"]),
      el("button",{class:"btn primary",onclick:function(){
        var n = parse(); if(!n.length) return toast("Nothing to import");
        d.cards = cardsOf(d).concat(n);
        box.value = ""; refresh();
        saveDraft(); toast("Added " + n.length + " card" + (n.length===1?"":"s"));
        render();
      }},["Add to deck"])
    ])
  ]);
  return panel;
}

/* ============================ sign in ============================ */
var ADMIN_USER = "ADMIN";
var ADMIN_SALT = "recalldesk.v1.";
var ADMIN_HASH = "367a36dee35a4f0ac68c9ec1a3ec9ab7cbc2170907dce1da70bb2ee27cf10b5e";

function sha256hex(s){
  if(!(window.crypto && crypto.subtle)) return Promise.reject(new Error("insecure"));
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0" + b.toString(16)).slice(-2); }).join("");
  });
}
function signInAs(name){
  S.who = name || null;
  try{ name ? localStorage.setItem(WHO_KEY, name) : localStorage.removeItem(WHO_KEY); }catch(e){}
  loadLocal();
  refreshFoot(); renderRail();
}
function renderWho(){
  var errBox, nameIn, userIn, passIn;
  function fail(msg){ errBox.textContent = msg; errBox.hidden = false; }

  stage.appendChild(el("div",{class:"stage-head"},[
    el("div",{},[
      el("h2",{text: S.who ? "Signed in as " + S.who : "Who's studying?"}),
      el("div",{class:"sub",text:"Your scores are filed under this name, in this browser only — nothing is sent anywhere."})
    ]),
    S.decks.length ? el("button",{class:"btn ghost",onclick:function(){ go("home"); }},[icon(I.back,15),"Decks"]) : null
  ]));

  var wrap = el("div",{class:"signin"});

  nameIn = el("input",{class:"text",type:"text",id:"whoname",placeholder:"e.g. Jordan",value:S.who || "",autocomplete:"off"});
  nameIn.addEventListener("keydown", function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); start(); } });
  function start(){
    var n = nameIn.value.trim();
    if(!n) return fail("Pick a name so your scores have somewhere to go.");
    signInAs(n); toast("Studying as " + n); go("home");
  }

  var studentPanel = el("div",{class:"panel"},[
    el("h3",{text:"Study on this device"}),
    el("p",{text:"Type a name and your progress, stars, and best times are kept for you. Two people sharing a laptop just use different names."}),
    el("div",{class:"field"},[ el("label",{for:"whoname",text:"Your name"}), nameIn ]),
    el("div",{class:"rowctl",style:"justify-content:flex-start"},[
      el("button",{class:"btn primary",onclick:start},[icon(I.user,15),"Start studying"]),
      S.who ? el("button",{class:"btn ghost",onclick:function(){ signInAs(null); toast("Signed out"); render(); }},["Sign out"]) : null
    ])
  ]);

  userIn = el("input",{class:"text",type:"text",placeholder:"Username",autocomplete:"username"});
  passIn = el("input",{class:"text",type:"password",placeholder:"Password",autocomplete:"current-password"});
  passIn.addEventListener("keydown", function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); unlock(); } });
  function unlock(){
    if(userIn.value.trim().toUpperCase() !== ADMIN_USER) return fail("That username doesn't match.");
    sha256hex(ADMIN_SALT + passIn.value).then(function(h){
      if(h !== ADMIN_HASH) return fail("That password doesn't match.");
      S.canEdit = true;
      if(!S.who) signInAs("ADMIN"); else refreshFoot();
      renderRail(); toast("Editing unlocked"); go("home");
    }, function(){
      fail("This browser won't hash the password over an insecure connection. Open the site over https.");
    });
  }

  var editorPanel = el("div",{class:"panel"},[
    el("h3",{text:"Course editor"}),
    el("p",{text:"Unlocks the card editor on this device. Changes stay here until you publish a new decks.json to the repo, so a student who got past this box still couldn't change anyone else's cards."}),
    el("div",{class:"field"},[ el("label",{text:"Username"}), userIn ]),
    el("div",{class:"field"},[ el("label",{text:"Password"}), passIn ]),
    el("div",{class:"rowctl",style:"justify-content:flex-start"},[
      el("button",{class:"btn",onclick:unlock},["Unlock editing"]),
      S.canEdit ? el("button",{class:"btn ghost",onclick:function(){ S.canEdit = false; refreshFoot(); renderRail(); toast("Editing locked"); render(); }},["Lock editing"]) : null
    ])
  ]);

  errBox = el("p",{class:"err",hidden:"hidden"});

  wrap.appendChild(studentPanel);
  wrap.appendChild(el("div",{class:"hr",text:"or"}));
  wrap.appendChild(editorPanel);
  wrap.appendChild(errBox);
  stage.appendChild(wrap);
  setTimeout(function(){ (S.canEdit ? nameIn : nameIn).focus(); }, 0);
}

/* ============================ connect to GitHub ============================ */
function renderConnect(){
  var errBox, tokIn;
  function fail(msg){ errBox.textContent = msg; errBox.hidden = false; }

  stage.appendChild(el("div",{class:"stage-head"},[
    el("div",{},[
      el("h2",{text:"Publishing"}),
      el("div",{class:"sub",text:"One-time setup. After this, Publish sends your cards to everyone by itself."})
    ]),
    el("button",{class:"btn ghost",onclick:function(){ go(S.decks.length ? "edit" : "home"); }},[icon(I.back,15),"Back"])
  ]));

  var wrap = el("div",{class:"signin"});

  if(S.token){
    wrap.appendChild(el("div",{class:"panel"},[
      el("h3",{text:"Connected"}),
      el("p",{text:"This browser can publish to " + GH_OWNER + "/" + GH_REPO + ". The token is stored here and nowhere else — it isn't in the site's code and never goes to anyone but GitHub."}),
      el("div",{class:"rowctl",style:"justify-content:flex-start"},[
        el("button",{class:"btn",onclick:function(){ setToken(null); toast("Token removed from this browser"); render(); }},["Disconnect"]),
        el("button",{class:"btn ghost",onclick:downloadJSON},[icon(I.upload,15),"Download decks.json instead"])
      ])
    ]));
    stage.appendChild(wrap);
    return;
  }

  tokIn = el("input",{class:"text",type:"password",placeholder:"github_pat_…",autocomplete:"off",spellcheck:"false"});
  tokIn.addEventListener("keydown", function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); connect(); } });

  function connect(){
    var t = tokIn.value.trim();
    if(!t) return fail("Paste the token first.");
    errBox.hidden = true;
    var was = S.token; S.token = t;
    ghFetch(GH_API + "?ref=" + GH_BRANCH).then(function(res){
      if(res.status === 404){
        // 404 also means "repo exists but token can't see it" — either way, same fix.
        throw new Error("GitHub can't see " + GH_OWNER + "/" + GH_REPO + " with this token. Check the repo exists and that the token lists it under Repository access.");
      }
      if(res.status === 401) throw new Error("GitHub rejected that token. Copy it again — it's only shown once.");
      if(!res.ok) throw new Error(ghError(res));
      return res.json();
    }).then(function(){
      setToken(t);
      toast("Connected to GitHub");
      go(S.decks.length ? "edit" : "home");
    }).catch(function(err){
      S.token = was;
      fail(String(err && err.message || err));
    });
  }

  wrap.appendChild(el("div",{class:"panel"},[
    el("h3",{text:"Let this browser publish for you"}),
    el("p",{text:"Publishing means writing decks.json to the repo. Give this browser a token that can do only that, and the Publish button does the rest — no terminal, no commit."}),
    el("ol",{class:"steps"},[
      el("li",{html:'Open <code>github.com/settings/personal-access-tokens/new</code> — this is the <b>fine-grained</b> token page, not the classic one.'}),
      el("li",{html:'Resource owner <code>' + GH_OWNER + '</code>. Under <b>Repository access</b> choose <b>Only select repositories</b> and pick <code>' + GH_REPO + '</code>.'}),
      el("li",{html:'Under <b>Repository permissions</b> set <b>Contents</b> to <b>Read and write</b>. Leave every other permission alone.'}),
      el("li",{html:'Set an expiry you can live with, generate it, and copy the token — GitHub shows it once.'})
    ]),
    el("div",{class:"field"},[ el("label",{text:"Paste the token"}), tokIn ]),
    el("div",{class:"rowctl",style:"justify-content:flex-start"},[
      el("button",{class:"btn primary",onclick:connect},["Connect"]),
      el("button",{class:"btn ghost",onclick:downloadJSON},[icon(I.upload,15),"Download decks.json instead"])
    ])
  ]));

  wrap.appendChild(el("div",{class:"panel"},[
    el("h3",{text:"What the token can and can't do"}),
    el("p",{html:"Scoped that way it can change <b>one file in one repo</b> and nothing else — not your other repos, not your account, not your other GitHub data. It lives in this browser\'s storage, so treat this like a signed-in session: don\'t set it up on a shared or classroom machine, and hit Disconnect if you ever do. If it leaks, revoke it at <code>github.com/settings/tokens</code> and make a new one — nothing else needs changing."})
  ]));

  errBox = el("p",{class:"err",hidden:"hidden"});
  wrap.appendChild(errBox);
  stage.appendChild(wrap);
  setTimeout(function(){ tokIn.focus(); }, 0);
}

/* ============================ keyboard ============================ */
document.addEventListener("keydown", function(ev){
  var tag = (ev.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea" || tag === "select") return;
  if(ev.metaKey || ev.ctrlKey || ev.altKey) return;
  var s = S.session, k = ev.key;
  if(S.view === "flash" && s){
    if(k === " "){ ev.preventDefault(); s.flipped = !s.flipped; render(); }
    else if(k === "ArrowRight"){ ev.preventDefault(); advanceFlash(1); }
    else if(k === "ArrowLeft"){ ev.preventDefault(); advanceFlash(-1); }
    else if(k === "s" || k === "S"){ ev.preventDefault(); var c = s.cards[s.i]; if(c){ toggleStar(c.id); render(); } }
  } else if(S.view === "quiz" && s && s.i < s.cards.length){
    if(s.picked === null && /^[1-4]$/.test(k)){
      var idx = parseInt(k,10) - 1;
      if(idx < s.choices.length){ ev.preventDefault(); pickChoice(idx, s.choices[idx] === ans(s.cards[s.i]), s.cards[s.i]); }
    } else if((k === "Enter" || k === " ") && s.picked !== null){ ev.preventDefault(); nextQuiz(); }
  } else if(S.view === "write" && s && s.state && (k === "Enter" || k === " ")){
    ev.preventDefault(); nextWrite();
  } else if(S.view !== "home" && k === "Escape"){
    S.session = null; go("home");
  }
});

/* ============================ boot ============================ */
try{ S.who = localStorage.getItem(WHO_KEY) || null; }catch(e){ S.who = null; }
try{ S.token = localStorage.getItem(TOKEN_KEY) || null; }catch(e){ S.token = null; }
loadLocal();
$("whobtn").addEventListener("click", function(){ go("who"); });
refreshFoot();
renderRail();
render();

function normalizeDecks(raw){
  var list = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.decks) ? raw.decks : []);
  return list.map(function(v, n){
    return {
      id: v.id || uid("d"),
      name: v.name || "Untitled deck",
      subject: v.subject || "",
      cards: (Array.isArray(v.cards) ? v.cards : []).map(function(c){
        return {id: c.id || uid(), term: c.term || "", def: c.def || ""};
      }),
      createdAt: v.createdAt || n
    };
  }).sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); });
}

fetch("decks.json", {cache:"no-store"})
  .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(function(raw){
    S.published = normalizeDecks(raw);
    var draft = ls(DRAFT_KEY, null);
    if(draft){
      S.decks = normalizeDecks(draft);
      S.draft = true;
    } else {
      S.decks = JSON.parse(JSON.stringify(S.published));
    }
    S.ready = true;
    if(!S.deckId && S.decks.length) S.deckId = S.decks[0].id;
    refreshFoot(); renderRail();
    if(!S.who && S.decks.length) go("who"); else render();
  })
  .catch(function(err){
    S.ready = true; S.loadError = err;
    setSync(false, "Couldn't load decks");
    render();
  });

/* -------- pick up newly published decks without a reload --------
   Students leave this open; a publish should reach them on its own. Nothing is
   swapped out from under an editor with unsaved work or a student mid-session. */
function applyIncoming(){
  if(!S.incoming) return false;
  S.published = S.incoming; S.incoming = null;
  S.decks = JSON.parse(JSON.stringify(S.published));
  if(!deck() && S.decks.length) S.deckId = S.decks[0].id;
  renderRail();
  return true;
}
function pollPublished(){
  if(document.hidden || !S.ready || S.loadError) return;
  fetch("decks.json", {cache:"no-store"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(raw){
      if(!raw) return;
      var next = normalizeDecks(raw);
      if(JSON.stringify(next) === JSON.stringify(S.published)) return;
      S.incoming = next;
      if(S.draft){                      // the editor's own unpublished work wins
        S.published = next; S.incoming = null;
        return toast("The published decks changed somewhere else");
      }
      if(S.session || S.view === "edit") return toast("New cards — they'll appear when you're done");
      applyIncoming();
      if(S.view === "home") render();
      toast("Decks updated");
    })
    .catch(function(){});
}
setInterval(pollPublished, 60000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) pollPublished(); });
})();
</script>
