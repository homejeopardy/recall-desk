    if(mineMoved && theirsMoved && !sameJSON(mine[k], theirs[k])) clash = true;
    out[k] = mineMoved ? mine[k] : theirs[k];
  });
  if(clash && log && label) log.both.push(label);
  return out;
}
/* One list of things with ids: the folders, the decks, or the cards inside a deck. */
function mergeById(base, mine, theirs, one, name, log){
  var B = indexById(base), T = indexById(theirs), out = [], done = {};
  (mine || []).forEach(function(m){
    done[m.id] = true;
    var b = B[m.id], t = T[m.id];
    if(!t){
      if(b && sameJSON(b, m)) return;                 // they deleted it; you hadn't touched it
      if(b) log.both.push(name(m));                   // they deleted what you were changing
      return out.push(m);                             // yours is new, or yours changed
    }
    out.push(one(b || t, m, t, log));                 // no base means nobody can have deleted it
  });
  (theirs || []).forEach(function(t){
    if(done[t.id]) return;
    var b = B[t.id];
    if(!b) log.gained.push(name(t));                  // they added it
    else if(sameJSON(b, t)) return;                   // you deleted it, they left it alone
    else log.both.push(name(t));                      // you deleted what they were changing
    out.push(t);
  });
  return out;
}
function mergeCard(b, m, t, log, where){
  var label = quote(((m.term || t.term || "").trim()) || "a card") + where;
  var c = mergeFields(b, m, t, ["term","def","def2","pos","pos2","ex"], {id: m.id || t.id}, log, label);
  var keys = {}, clash = false, f = {}, any = false;
  [b.forms, m.forms, t.forms].forEach(function(o){ if(o) Object.keys(o).forEach(function(k){ keys[k] = true; }); });
  Object.keys(keys).forEach(function(k){               // a conjugation table, one form at a time
    var bv = (b.forms||{})[k], mv = (m.forms||{})[k], tv = (t.forms||{})[k];
    var mineMoved = !sameJSON(mv, bv), theirsMoved = !sameJSON(tv, bv);
    if(mineMoved && theirsMoved && !sameJSON(mv, tv)) clash = true;
    var v = mineMoved ? mv : tv;
    if(v != null && String(v).trim()){ f[k] = String(v); any = true; }
  });
  if(clash) log.both.push(label);
  if(any) c.forms = f;
  return c;
}
var DECK_KEYS = ["name","subject","folder","quiz","kind","tense","persons","cats","catName","createdAt"];
function mergeDeck(b, m, t, log){
  var d = mergeFields(b, m, t, DECK_KEYS, {id: m.id || t.id}, log, quote(m.name || t.name || "a deck"));
  var where = " in " + (d.name || "a deck");
  d.cards = mergeById(b.cards, m.cards, t.cards,
    function(cb, cm, ct, lg){ return mergeCard(cb, cm, ct, lg, where); },
    function(c){ return quote(((c.term || "").trim()) || "a card") + where; }, log);
  return d;
}
function mergeFolder(b, m, t, log){
  return mergeFields(b, m, t, ["name","parent","archive"], {id: m.id || t.id}, log,
                     quote(m.name || t.name || "a folder"));
}
function mergeStores(base, mine, theirs){
  var log = {gained:[], both:[]};
  var nm = function(x){ return quote(x.name || "untitled"); };
  var store = {
    folders: mergeById(base.folders, mine.folders, theirs.folders, mergeFolder, nm, log),
    decks:   mergeById(base.decks,   mine.decks,   theirs.decks,   mergeDeck,   nm, log)
  };
  var seen = {};                                       // one mention each, however it was flagged
  log.both = log.both.filter(function(x){ return seen[x] ? false : (seen[x] = true); });
  return {store: store, log: log};
}
function mergeReport(log){
  var bits = [];
  if(log.gained.length) bits.push("kept " + log.gained.length + " thing" + (log.gained.length === 1 ? "" : "s") + " they added");
  if(log.both.length){
    var few = log.both.slice(0, 2).join(", ") + (log.both.length > 2 ? " and " + (log.both.length - 2) + " more" : "");
    bits.push("you both changed " + few + " \u2014 yours was kept");
  }
  return "Published, and merged with someone else's work: " + (bits.join("; ") || "nothing clashed") + ".";
}
/* GitHub hands the file back base64'd; this is b64utf8 run backwards. */
function unb64utf8(s64){
  var bin = atob(String(s64 || "").replace(/\s/g, "")), bytes = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ============================ announcements ============================
   Their own file rather than a corner of decks.json. Decks go through a careful
   three-way merge when two people publish at once, and a notice has no business
   anywhere near that — this way posting one can't touch a single card, and it
   doesn't wait on a deck edit to go out. */
var GH_NOTE_FILE = "notices.json";
var GH_NOTE_API = "https://api.github.com/repos/" + GH_OWNER + "/" + GH_REPO + "/contents/" + GH_NOTE_FILE;
var NOTE_READ_KEY = "recalldesk.notices-read.v1";

function normalizeNotices(raw){
  var list = raw && Array.isArray(raw.notices) ? raw.notices : (Array.isArray(raw) ? raw : []);
  return list.map(function(n){
    return {
      id: String(n.id || uid("n")),
      title: String(n.title || ""),
      body: String(n.body || ""),
      starts: parseDate(n.starts) ? String(n.starts) : "",
      ends: parseDate(n.ends) ? String(n.ends) : "",
      off: !!n.off
    };
  });
}
// Showing is decided by the date, so a notice can be written now and appear on the
// morning it matters, and stop on its own rather than being taken down by hand.
function noticeLive(n){
  if(n.off || !(n.title || n.body)) return false;
  var t = today(), a = parseDate(n.starts), b = parseDate(n.ends);
  if(a && a > t) return false;
  if(b && b < t) return false;
  return true;
}
function noticesRead(){ return ls(NOTE_READ_KEY, {}) || {}; }
function markNoticeRead(id){
  var m = noticesRead(); m[id] = 1;
  try{ localStorage.setItem(NOTE_READ_KEY, JSON.stringify(m)); }catch(e){}
}
function pendingNotice(){
  var read = noticesRead();
  for(var i = 0; i < S.notices.length; i++){
    if(noticeLive(S.notices[i]) && !read[S.notices[i].id]) return S.notices[i];
  }
  return null;
}
// Held until the decks are in, so it lands on the page the reader came for rather
// than on top of "Loading decks…".
function maybeShowNotice(){
  if(S.noticeShown || !S.ready || S.loadError) return;
  var n = pendingNotice();
  if(n){ S.noticeShown = true; showNotice(n); }
}
function showNotice(n, preview){
  var was = document.activeElement;
  var ok = el("button",{class:"btn primary",onclick:function(){ close(); }},["Got it"]);
  var card = el("div",{class:"notecard",role:"dialog","aria-modal":"true","aria-labelledby":"notetitle"},[
    el("div",{class:"eyebrow",text: preview ? "Preview" : "Notice"}),
    el("h3",{id:"notetitle",text: n.title || "A note from your teacher"}),
    n.body ? el("div",{class:"notebody",text:n.body}) : null,
    el("div",{class:"rowctl",style:"justify-content:flex-end;margin-top:18px"},[ok])
  ]);
  var back = el("div",{class:"notewrap"},[card]);
  function close(){
    if(!preview) markNoticeRead(n.id);
    document.removeEventListener("keydown", onKey, true);
    back.classList.add("out");
    setTimeout(function(){ if(back.parentNode) back.remove(); }, 220);
    if(was && was.focus) try{ was.focus(); }catch(e){}
  }
  // Captured and stopped, so Space doesn't flip the card behind the dialog and the
  // only thing Tab can reach is the one button in it.
  function onKey(ev){
    ev.stopPropagation();
    if(ev.key === "Escape"){ ev.preventDefault(); close(); }
    else if(ev.key === "Tab"){ ev.preventDefault(); ok.focus(); }
  }
  document.addEventListener("keydown", onKey, true);
  back.addEventListener("click", function(ev){ if(ev.target === back) close(); });
  document.body.appendChild(back);
  setTimeout(function(){ try{ ok.focus(); }catch(e){} }, 0);
}

function deckTrouble(){
  var live = S.decks.filter(function(d){ return !(folderById(d.folder) || {}).archive; });
  var blank = 0, blankIn = null;
  live.forEach(function(d){
    if(kindOf(d) === "conj") return;                 // a verb deck is a different shape
    cardsOf(d).forEach(function(c){
      if(!(c.term || "").trim() || !defText(c).trim()){ blank++; if(!blankIn) blankIn = d; }
    });
  });
  var empty = live.filter(function(d){ return !cardsOf(d).length; });
  var undated = live.filter(function(d){ return !d.quiz; });
  var passed = live.filter(function(d){ var n = daysUntil(d.quiz); return n !== null && n < 0; });
  return {live:live, blank:blank, blankIn:blankIn, empty:empty, undated:undated, passed:passed};
}

function publishNotices(){
  if(!S.token) return go("connect");
  if(S.busy) return;
  S.busy = true; render();
  var payload = {
    version: 1,
    updated: new Date().toISOString().slice(0,10),
    notices: S.notices.filter(function(n){ return n.title || n.body; })
  };
  ghFetch(GH_NOTE_API + "?ref=" + GH_BRANCH)
    .then(function(res){
      if(res.status === 404) return null;                 // first one; the file isn't there yet
      if(!res.ok) throw new Error(ghError(res));
      return res.json();
    })
    .then(function(existing){
      var body = {
        message: "Update notices (" + payload.notices.length + ")",
        content: b64utf8(JSON.stringify(payload, null, 2) + "\n"),
        branch: GH_BRANCH
      };
      // Sent with the sha it read, so if someone else wrote in between GitHub
      // refuses it rather than quietly burying their notice.
      if(existing && existing.sha) body.sha = existing.sha;
      return ghFetch(GH_NOTE_API, {method:"PUT", body: JSON.stringify(body)});
    })
    .then(function(res){
      if(!res.ok) throw new Error(ghError(res));
      S.busy = false; S.noticeDirty = false; render();
      toast("Notices published \u2014 students see them in about a minute");
    })
    .catch(function(err){
      S.busy = false; render();
      toast("Didn't publish: " + String(err && err.message || err));
    });
}

function publish(){

function attemptPublish(tries, carried){
  var note = carried || null;
  return ghFetch(GH_API + "?ref=" + GH_BRANCH).then(function(res){
    if(res.status === 404) return null;              // first publish, file not there yet
    if(!res.ok) throw new Error(ghError(res));
    return res.json();
  }).then(function(existing){
    var theirs = null;
    if(existing && existing.content){
      try{ theirs = normalizeStore(JSON.parse(unb64utf8(existing.content))); }catch(e){ theirs = null; }
    }
    // Refusing to publish beats overwriting decks we were unable to read.
    if(existing && existing.sha && !theirs){
      throw new Error("couldn't read what's already published, so nothing was written over it. Try again in a minute.");
    }
    var mine = normalizeStore(deckPayload());
    if(theirs && !sameJSON(theirs, mine)){
      // With no base — a draft from before this existed — treat every deck as new
      // to one side or the other, so the merge can only ever add.
      var base = S.base || {folders:[], decks:[]};
      if(!sameJSON(theirs, base)){
        var r = mergeStores(base, mine, theirs);
        var merged = normalizeStore(r.store);        // re-runs the folder checks over the result
        if(!sameJSON(merged, mine)){
          useStore(merged);
          saveDraft();                                // the merge survives a crash before the PUT
          note = note
            ? {gained: note.gained.concat(r.log.gained), both: note.both.concat(r.log.both)}
            : r.log;
        }
      }
    }
    var payload = deckPayload();
    var body = {
      message: "Update decks (" + payload.decks.length + " deck" + (payload.decks.length === 1 ? "" : "s") + ", " +
               payload.decks.reduce(function(n,d){ return n + d.cards.length; }, 0) + " cards)" +
               (note ? ", merged" : ""),
      content: b64utf8(JSON.stringify(payload, null, 2) + "\n"),
      branch: GH_BRANCH
    };
    if(existing && existing.sha) body.sha = existing.sha;
    return ghFetch(GH_API, {method:"PUT", body: JSON.stringify(body)});
  }).then(function(res){
    // Someone published in the seconds between the read and the write: go round again.
    if((res.status === 409 || res.status === 422) && tries < 2) return attemptPublish(tries + 1, note);
    if(!res.ok) throw new Error(ghError(res));
    return res.json().then(function(){ finishPublish(note); });
  }).catch(function(err){
    if(tries) throw err;                              // let the first attempt report it
    S.busy = false;
    var msg = String(err && err.message || err);
    if(/expired or been revoked/.test(msg)) setToken(null);   // don't leave a dead token in place
    pubState("fail", el("span",{},[el("b",{text:"Didn't publish. "}), msg]), S.token ? "Try again" : "Set up publishing");
  });
}
function finishPublish(note){
  S.busy = false;
  S.published = normalizeStore(deckPayload());
  setBase(null);
  S.draft = false; S.remoteMoved = false;

// Measure, then animate to the measured height, then hand the height back to the
// content so a deck added later doesn't get clipped by a stale pixel value.
function slideFolder(wrap, open){
  wrap.classList.toggle("open", open);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){
    wrap.style.height = open ? "auto" : "0px";
    return;
  }
  var from = wrap.getBoundingClientRect().height;
  wrap.style.height = from + "px";
  var to = open ? wrap.scrollHeight : 0;
  void wrap.offsetHeight;                       // make the start value stick
  requestAnimationFrame(function(){ wrap.style.height = to + "px"; });
  var settle = function(){
    wrap.removeEventListener("transitionend", onEnd);
    clearTimeout(wrap._slide);
    // Back to auto so a deck added to this folder later isn't clipped by a stale pixel.
    if(wrap.classList.contains("open")) wrap.style.height = "auto";
  };
  var onEnd = function(ev){ if(ev.target === wrap && ev.propertyName === "height") settle(); };
  wrap.addEventListener("transitionend", onEnd);
  clearTimeout(wrap._slide);
  wrap._slide = setTimeout(settle, 400);        // in case the transition never fires
}

/* ---- links you can send someone ----
   #deck=<id|slug>, #folder=<id|slug>, #cal, #review. The id never changes, so that is
   what gets copied; a slug is accepted too, for a link typed by hand. */
var hashBusy = false;
function deckSlug(d){ return slug(d.name) || d.id; }
function findDeck(key){
  key = decodeURIComponent(key || "");
  for(var i=0;i<S.decks.length;i++) if(S.decks[i].id === key) return S.decks[i];
  for(i=0;i<S.decks.length;i++) if(deckSlug(S.decks[i]) === slug(key)) return S.decks[i];
  return null;
}
function findFolder(key){
  key = decodeURIComponent(key || "");
  for(var i=0;i<S.folders.length;i++) if(S.folders[i].id === key) return S.folders[i];
  for(i=0;i<S.folders.length;i++) if(slug(S.folders[i].name) === slug(key)) return S.folders[i];
  return null;
}
function setHash(h){
  if(location.hash.slice(1) === h) return;
  hashBusy = true;
  try{ location.hash = h; }catch(e){}
  setTimeout(function(){ hashBusy = false; }, 0);
}
function deckLink(d){ return location.origin + location.pathname + "#deck=" + d.id; }
// Returns true when the address bar asked for something and we went there.
function routeHash(){
  var h = location.hash.slice(1);
  if(!h || h === "editor" || h.indexOf("access_token") > -1 || h.indexOf("error=") > -1) return false;
  var m = /^deck=(.+)$/.exec(h);
  if(m){ var d = findDeck(m[1]); if(d){ openDeck(d.id); return true; } return false; }
  m = /^folder=(.+)$/.exec(h);
  if(m){ var f = findFolder(m[1]); if(f){ openFolder(f.id); return true; } return false; }
  if(h === "home"){ go("start"); return true; }
  if(h === "cal"){ go("cal"); return true; }
  if(h === "notices"){ go("news"); return true; }
  if(h === "dashboard"){ go("desk"); return true; }

  if(/^[0-9a-fA-F]{3}$/.test(c)) c = c.replace(/./g, function(x){ return x + x; });

function startMode(mode){

/* ---------------- learn ----------------
   Quizlet-style adaptive rounds. Every card climbs two rungs:
     0 new       asked as multiple choice
     1 learning  asked as a typed answer
     2 mastered  retired from Learn
   A miss at either rung drops the card to 0 and requeues it once in the same round,
   so the right answer comes back while it's still fresh. Rungs are saved per answer,
   so walking away mid-round loses nothing but the round's order. */
var ROUND_SIZE = 7, learnTimer = null;

// A vocabulary word with a part of speech gets a third rung: define it, type it, then
// name what it is. Everything else keeps the original two.
function maxStage(d, c){ return (posAskable(d) && posRights(c).length) ? 3 : 2; }
function isMastered(d, c){ return lstage(d.id, c.id) >= maxStage(d, c); }
function learnCounts(d, cards){
  var k = {fresh:0, learning:0, mastered:0};
  cards.forEach(function(c){

// in mind, their answer is on the screen and counts.

  rights.forEach(function(x){ used[x] = true; });
  all.forEach(function(o){

  });

var STORE_VER = 0;
function deckPos(d){

  d._pos = out; d._posVer = STORE_VER;

    el("div",{class:"lbar","aria-hidden":"true"},[
      el("i",{class:"lm-m",style:"width:" + (k.mastered/n*100) + "%"}),
      el("i",{class:"lm-l",style:"width:" + (k.learning/n*100) + "%"})
    ]),
    el("div",{class:"llegend"},[

function typesTerm(c){ return !c.fixed && !!(c.term || "").trim() && !!defs(c).length; }

  var d = deck();

  var fresh = cards.filter(function(c){ return lstage(d.id, c.id) === 0; });

  var take = Math.min(learning.length, ROUND_SIZE - Math.min(2, fresh.length));

  pick = pick.concat(learning.slice(take, take + ROUND_SIZE - pick.length));

function startLearn(){

function nextLearnRound(){

  var cls = a.result === "no" ? "no" : a.result === "near" ? "near" : "ok", msg;
  if(a.result === "no"){
    msg = [ a.undone ? "Counted as wrong — the answer is "
          : a.skipped ? "The answer is " : "Not quite — the answer is ", el("b",{text:right}), ". ",
            a.requeued ? "It comes back later this round." : "You'll see it again next round." ];
  } else if(a.result === "near"){

  } else {

  stage.appendChild(el("div",{class:"verdict " + cls},[
    el("span",{},msg),
    el("span",{class:"rowctl"},[
      a.result === "no" && a.kind === "type" && !a.skipped ? el("button",{class:"btn sm",onclick:learnOverride},["I was right"]) : null,
      a.kind === "type" && !a.skipped && (a.result === "near" || a.overridden) ? el("button",{class:"btn sm",onclick:learnUndo},["I was wrong"]) : null,
      el("button",{class:"btn sm",onclick:learnNext},[ s.i + 1 >= s.queue.length ? "Finish round" : "Continue", icon(I.chev,14) ])
    ])
  ]));
}

function learnAnswer(c, ok, a){
  var s = S.session, d = deck();
  a.from = lstage(d.id, c.id);
  a.requeued = false;
  if(ok) setStage(d.id, c.id, Math.min(maxStage(d, c), a.from + 1));
  else {
    setStage(d.id, c.id, 0);
    if(!s.requeued[c.id]){ s.requeued[c.id] = true; s.queue.push(c); a.requeued = true; }
  }
  a.to = lstage(d.id, c.id);
  record(c.id, ok);
  s.answer = a;
  render();
  // A clean right answer moves on by itself; anything worth reading waits for you.
  if(ok && a.result === "exact"){
    clearTimeout(learnTimer);
    learnTimer = setTimeout(function(){ if(S.session === s && s.answer === a) learnNext(); }, 950);
  }
}
/* Both of Learn's pick-one questions come through here: the ordinary one and, on the

   click and to the number keys, and the only way past it was "Don't know?". A word
   with two parts of speech counts right for either, so that question is judged
   against the card's own list rather than against the answer side of the card. */
function learnPick(idx){
  var s = S.session; if(!s || s.answer || s.kind === "type") return;
  var c = s.queue[s.i], opt = s.choices[idx];
  var ok = s.kind === "pos" ? posOk(c, opt) : opt === ans(c);

}
function learnType(given){
  var s = S.session; if(!s || s.answer || s.kind !== "type") return;
  var c = s.queue[s.i], r = String(given || "").trim() ? grade(given, lans(c, "type")) : "no";

function learnDontKnow(){

}
function learnOverride(){

  setStage(d.id, c.id, Math.min(maxStage(d, c), a.from + 1));

  setStage(d.id, c.id, 0);
  if(!s.requeued[c.id]){ s.requeued[c.id] = true; s.queue.push(c); a.requeued = true; }
  var p = prog(d.id, c.id); p.right = Math.max(0, p.right - 1); p.wrong++; p.last = "wrong"; saveLocal();
  a.result = "no"; a.overridden = false; a.undone = true; a.to = lstage(d.id, c.id);

}

/* ---------------- simulated test ----------------
   Built out of the question types the app already grades: multiple choice, typing, and
   on a vocabulary deck the part of speech. Scope can be one deck or a whole folder, so
   it works as a real end-of-unit run-through rather than a single deck drill. */
var testTimer = null;
function testUnits(scope){
  var decks = scope.folder ? decksUnder(scope.folder) : (deck() ? [deck()] : []);
  var out = [];
  decks.forEach(function(d){
    unitsOf(d).forEach(function(u){ out.push({u:u, d:d}); });
  });
  return out;
}
function buildTest(scope, opts){
  var pool = shuffled(testUnits(scope)), qs = [];
  pool.forEach(function(it){
    if(qs.length >= opts.count) return;
    var kinds = [];
    if(opts.choice) kinds.push("choice");
    if(opts.type) kinds.push("type");
    if(opts.pos && tagged(it.d) && posRights(it.u).length && posAskable(it.d)) kinds.push("pos");
    if(!kinds.length) return;
    var kind = kinds[Math.floor(Math.random() * kinds.length)];
    var all = unitsOf(it.d);
    if(kind === "choice" && !canChoose(all)) kind = opts.type ? "type" : null;
    if(!kind) return;
    qs.push({
      id: it.u.id, deck: it.d, unit: it.u, kind: kind,
      ask: lask(it.u, kind === "pos" ? "pos" : kind === "type" ? "type" : "choice"),
      right: lans(it.u, kind === "pos" ? "pos" : kind === "type" ? "type" : "choice"),
      choices: kind === "choice" ? buildChoices(it.u, all) : kind === "pos" ? posChoices(it.u, all) : null,
      rights: kind === "pos" ? posRights(it.u).map(cap) : null,   // either one counts
      given: null, ok: null
    });
  });
  return qs;
}
function startTest(scope, opts){
  var qs = buildTest(scope, opts);
  if(!qs.length) return toast("Nothing to build a test from");
  S.session = {mode:"test", qs:qs, i:0, scope:scope, opts:opts, left: opts.minutes * 60, over:false};
  clearInterval(testTimer);
  if(opts.minutes){
    testTimer = setInterval(function(){
      var s = S.session;
      if(!s || s.mode !== "test" || s.over){ clearInterval(testTimer); return; }
      s.left--;
      var c = $("tclock");
      if(c){ c.textContent = clockText(s.left); c.className = "tclock" + (s.left <= 30 ? " low" : ""); }
      if(s.left <= 0){ clearInterval(testTimer); finishTest(true); }
    }, 1000);
  }
  go("test");
}
function clockText(sec){
  sec = Math.max(0, sec|0);
  return Math.floor(sec/60) + ":" + ("0" + (sec % 60)).slice(-2);
}
function renderTestSetup(){
  var d = deck();
  var opts = S.testOpts || (S.testOpts = {count:15, minutes:10, choice:true, type:true, pos:true});
  var scope = S.testScope || (S.testScope = {folder: null});
  var fold = d && d.folder ? folderById(d.folder) : null;
  var available = testUnits(scope).length;

  stage.appendChild(el("div",{class:"stage-head"},[
    el("div",{},[ el("h2",{text:"Simulated test"}),
      el("div",{class:"sub",text:"A timed run-through that mixes the question types, scored at the end."}) ]),
    el("button",{class:"btn ghost",onclick:function(){ go("home"); }},[icon(I.back,15),"Deck"])
  ]));

  function srow(label, kids){ return el("div",{class:"srow"},[ el("span",{class:"sl",text:label}), el("span",{class:"sv"}, kids) ]); }
  function seg(values, cur, set, fmt){
    var box = el("div",{class:"seg"});
    values.forEach(function(v){
      box.appendChild(el("button",{"aria-pressed": v === cur ? "true" : "false", text: fmt ? fmt(v) : String(v),
        onclick:function(){ set(v); render(); }}));
    });
    return box;
  }
  function check(label, on, set){
    var cb = el("input",{type:"checkbox"});
    cb.checked = !!on;
    cb.addEventListener("change", function(){ set(cb.checked); render(); });
    return el("label",{class:"chk"},[cb, label]);
  }

  var box = el("div",{class:"setup"});
  if(fold) box.appendChild(srow("Covering", [ seg([null, fold.id], scope.folder,
      function(v){ S.testScope = {folder: v}; }, function(v){ return v ? "All of " + (fold.name || "the folder") : (d.name || "This deck"); }) ]));
  box.appendChild(srow("Questions", [ seg([10, 15, 20, 30, 50], opts.count, function(v){ opts.count = v; }),
    el("span",{class:"saveflag",text: available + " available"}) ]));
  box.appendChild(srow("Time limit", [ seg([0, 5, 10, 20, 30], opts.minutes, function(v){ opts.minutes = v; },
    function(v){ return v ? v + " min" : "None"; }) ]));
  box.appendChild(srow("Question types", [
    check("Multiple choice", opts.choice, function(v){ opts.choice = v; }),
    check("Type the answer", opts.type, function(v){ opts.type = v; }),
    check("Part of speech", opts.pos, function(v){ opts.pos = v; })
  ]));
  stage.appendChild(box);

  var none = !opts.choice && !opts.type && !opts.pos;
  stage.appendChild(el("div",{class:"rowctl",style:"justify-content:flex-start"},[
    el("button",{class:"btn primary",disabled: (none || !available) ? "disabled" : null,
      onclick:function(){ startTest(S.testScope, opts); }},[icon(I.test,15),"Start the test"]),
    none ? el("span",{class:"saveflag",text:"Pick at least one question type."}) : null,
    !available ? el("span",{class:"saveflag",text:"Nothing to test on yet."}) : null

}
function renderTest(){

    ])

    el("div",{class:"q",text:q.ask || "—"}),
    s.scope.folder ? el("div",{style:"font-size:12px;color:var(--ink-faint);margin-top:10px",text:q.deck.name || ""}) : null
  ]));

  if(q.kind === "type"){

    inp.addEventListener("input", function(ev){ q.given = ev.target.value; });
    inp.addEventListener("keydown", function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); nextTestQ(1); } });
    stage.appendChild(inp);
    setTimeout(function(){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }, 0);
  } else {
    var wrap = el("div",{class:"choices"});
    q.choices.forEach(function(opt, idx){
      wrap.appendChild(el("button",{class:"choice" + (q.given === opt ? " right" : ""),
        onclick:function(){ q.given = opt; render(); setTimeout(function(){ nextTestQ(1); }, 160); }},[
        el("span",{class:"key",text:String(idx+1)}), el("span",{text:opt})
      ]));
    });
    stage.appendChild(wrap);
  }

  stage.appendChild(el("div",{class:"rowctl",style:"margin-top:16px;justify-content:space-between"},[
    el("button",{class:"btn ghost",disabled: s.i ? null : "disabled",onclick:function(){ nextTestQ(-1); }},[icon(I.back,15),"Back"]),
    el("span",{class:"saveflag",text: s.qs.filter(function(x){ return x.given !== null && x.given !== ""; }).length + " of " + s.qs.length + " answered"}),
    el("button",{class:"btn primary",onclick:function(){ nextTestQ(1); }},[ s.i + 1 >= s.qs.length ? "Finish" : "Next", icon(I.chev,14)])
  ]));
}
function nextTestQ(step){
  var s = S.session; if(!s || s.mode !== "test") return;
  if(step > 0 && s.i + 1 >= s.qs.length) return finishTest(false);

function finishTest(ranOut){

    ])

function renderCal(){

  var y = base.getFullYear(), m = base.getMonth(), now = today();
  var first = new Date(y, m, 1), start = new Date(y, m, 1 - first.getDay());
  var byDay = {};
  S.decks.forEach(function(d){ if(parseDate(d.quiz)) (byDay[d.quiz] || (byDay[d.quiz] = [])).push(d); });

  function shift(n){
    var t = new Date(y, m + n, 1);

    render();
  }

  ]));
  stage.appendChild(el("div",{class:"calhead"},[
    el("button",{class:"btn sm",onclick:function(){ shift(-1); },"aria-label":"Previous month"},["\u2039"]),
    el("h3",{class:"calmonth",text:MONTHS[m] + " " + y}),
    el("button",{class:"btn sm",onclick:function(){ shift(1); },"aria-label":"Next month"},["\u203a"]),
    el("button",{class:"btn ghost sm",onclick:function(){ S.calMonth = null; render(); }},["Today"])
  ]));

  var grid = el("div",{class:"calgrid"});
  DOW.forEach(function(w){ grid.appendChild(el("div",{class:"caldow",text:w})); });
  for(var i = 0; i < 42; i++){
    var day = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    var key = ymd(day), off = day.getMonth() !== m;
    var cell = el("div",{class:"calday" + (off ? " off" : "") + (key === ymd(now) ? " now" : "")},[
      el("span",{class:"dn",text:String(day.getDate())})

/* ---------------- flashcards ---------------- */
function renderFlash(){
  var s = S.session; if(!s || !s.cards.length) return go("home");
  if(s.i >= s.cards.length) return renderFlashDone();
  var c = s.cards[s.i], d = deck(), p = prog(d.id, c.id);

  stage.appendChild(el("div",{class:"deskrow"},[
    el("span",{class:"counter",text:(s.i+1) + " / " + s.cards.length}),
    el("span",{style:"font-size:11.5px;color:var(--ink-faint)"},[
      el("span",{class:"kbhint",html:'<kbd>Space</kbd> flip · <kbd>←</kbd><kbd>→</kbd> move · <kbd>S</kbd> star'}),
      el("span",{class:"tiphint",text:"Tap to flip · swipe to move"})
    ])
  ]));
  stage.appendChild(track((s.i)/s.cards.length*100));

  // The two faces carry the same star. Both are kept so starring can be applied to
  // the card on screen — redrawing the stage would throw away a half-turned flip.
  var stars = [];
  function starBtn(){
    var b = el("button",{class:"star","aria-pressed": p.star?"true":"false","aria-label":"Star this card",
      onclick:function(ev){ ev.stopPropagation(); toggleStar(c.id); paintStars(); }},[starIcon(p.star)]);
    stars.push(b); return b;
  }
  function paintStars(){
    var on = prog(d.id, c.id).star;
    stars.forEach(function(b){
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.textContent = ""; b.appendChild(starIcon(on));
    });
  }

  // Same test the Missed filter uses: got wrong, not yet got right.
  var redo = p.wrong > 0 && p.last !== "right";
  var card = el("div",{class:"card" + (s.flipped ? " flipped":"") + (redo ? " redo":""), onclick:function(){ flip(!s.flipped); }},[
    el("div",{class:"face"},[
      el("span",{class:"role",text:ASK_LABEL()}), starBtn(),
      el("div",{class:"facetext",text:ask(c) || "—"}),
      el("div",{class:"hintline"},[
        el("span",{class:"kbhint",text:"Click or press Space to reveal"}),
        el("span",{class:"tiphint",text:"Tap to reveal"})
      ])
    ]),
    el("div",{class:"face back"},[
      el("span",{class:"role",text:ANS_LABEL()}), starBtn(),
      reportsOn() ? reportBtn(d, c) : null,
      el("div",{class:"facetext",text:ans(c) || "—"}),
      exOf(c) ? el("div",{class:"exline",text:exOf(c).replace(/[\[\]]/g, "")}) : null,
      el("div",{class:"hintline",text:"How did that go?"})
    ])
  ]);
  // Arriving from the side the last card was sent out towards.
  var wrap = el("div",{class:"cardwrap" + (s.came ? " in-" + s.came : "")},[card]);
  s.came = null;
  swipable(wrap, function(){ advanceFlash(1); }, function(){ advanceFlash(-1); });
  stage.appendChild(wrap);

  // The card is turned rather than redrawn, so the flip actually plays; the two
  // buttons underneath are the only part that has to change with it.
  var judge = el("div",{class:"judge"});
  function paintJudge(){
    judge.textContent = "";
    if(s.flipped){
      judge.appendChild(el("button",{class:"btn again",onclick:function(){ record(c.id,false); advanceFlash(1); }},["Study again"]));
      judge.appendChild(el("button",{class:"btn know",onclick:function(){ record(c.id,true); advanceFlash(1); }},["Got it"]));
    } else {
      judge.appendChild(el("button",{class:"btn ghost",onclick:function(){ advanceFlash(-1); }},[icon(I.back,15),"Previous"]));
      judge.appendChild(el("button",{class:"btn",onclick:function(){ flip(true); }},["Reveal"]));
    }
  }
  function flip(to){
    to = !!to;
    if(s.flipped === to) return;
    s.flipped = to;
    card.classList.toggle("flipped", to);
    paintJudge();
    replay(judge, "turn");
  }
  paintJudge();
  stage.appendChild(judge);
  FLASH = {flip:flip, stars:paintStars};
}
// Drag left for the next card, right for the one before — the way every other
// stack of cards on a phone behaves. A tap still flips.
function swipable(node, onLeft, onRight){
  var x0 = 0, y0 = 0, live = false;
  node.addEventListener("touchstart", function(ev){
    live = ev.touches.length === 1;
    if(live){ x0 = ev.touches[0].clientX; y0 = ev.touches[0].clientY; }
  }, {passive:true});
  node.addEventListener("touchend", function(ev){
    if(!live) return;
    live = false;
    var t = ev.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    // Far enough across to mean it, and more across than down so that scrolling
    // the page past the card doesn't count as one.
    if(Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    ev.preventDefault();          // and so the tap-to-flip never fires
    (dx < 0 ? onLeft : onRight)();
  }, {passive:false});
}
function advanceFlash(step){
  var s = S.session;
  s.flipped = false;
  s.i += step;
  if(s.i >= s.cards.length){ return renderFlashDone(); }
  if(s.i < 0) s.i = 0;
  s.came = step < 0 ? "prev" : "next";
  render();
}
function renderFlashDone(){
  stage.textContent = "";
  var s = S.session;
  stage.appendChild(modeHead("Flashcards"));
  stage.appendChild(el("div",{class:"result"},[
    el("div",{class:"eyebrow",text:"Deck complete"}),
    el("div",{class:"score",text:String(s.cards.length)}),
    el("p",{style:"margin:2px 0 20px;color:var(--ink-soft);font-size:14px",text:"cards reviewed. Cards you marked “Study again” are waiting under the Missed filter."}),
    el("div",{class:"rowctl"},[
      el("button",{class:"btn primary",onclick:function(){ startMode("flash"); }},["Run it again"]),
      el("button",{class:"btn",onclick:function(){ S.session=null; go("home"); }},["Back to deck"])
    ])
  ]));
}

/* ---------------- multiple choice ---------------- */
function buildChoices(c, all){
  var right = ans(c);
  var others = [];
  all.forEach(function(o){
    if(o.id === c.id) return;
    var a = ans(o);
    if(a && norm(a) !== norm(right) && others.indexOf(a) === -1) others.push(a);
  });
  var picks = shuffled(others).slice(0, 3);
  return shuffled(picks.concat([right]));
}
function renderQuiz(){
  var s = S.session; if(!s) return go("home");
  if(s.i >= s.cards.length) return renderScore("Multiple choice", s);
  var c = s.cards[s.i];
  var allCards = cardsOf(deck());
  if(!s.choices || s.choicesFor !== c.id){ s.choices = buildChoices(c, allCards); s.choicesFor = c.id; }
  stage.appendChild(modeHead("Multiple choice"));
  stage.appendChild(el("div",{class:"deskrow"},[
    el("span",{class:"counter",text:(s.i+1) + " / " + s.cards.length}),
    el("span",{class:"counter",text:s.correct + " correct"})
  ]));
  stage.appendChild(track(s.i/s.cards.length*100));

  stage.appendChild(el("div",{class:"prompt"},[
    el("div",{class:"role",text:ASK_LABEL()}),
    el("div",{class:"q",text:ask(c) || "—"})
  ]));

  var right = ans(c);
  var wrap = el("div",{class:"choices"});
  s.choices.forEach(function(opt, idx){
    var cls = "choice";
    if(s.picked !== null){
      if(opt === right) cls += " right";
      else if(idx === s.picked) cls += " wrong";
    }
    wrap.appendChild(el("button",{class:cls, disabled: s.picked !== null ? "disabled" : null, onclick:function(){ pickChoice(idx, opt === right, c); }},[

    ]));
  });
  stage.appendChild(wrap);

  if(s.picked !== null){
    var wasRight = s.choices[s.picked] === right;
    stage.appendChild(el("div",{class:"verdict " + (wasRight ? "ok" : "no")},[
      el("span",{},[ wasRight ? "Correct." : "Not quite — the answer is ", wasRight ? null : el("b",{text:right}) ]),
      el("button",{class:"btn sm",onclick:nextQuiz},[ s.i + 1 >= s.cards.length ? "See score" : "Next", icon("M9 6l6 6-6 6",14)])
    ]));
  } else {
    stage.appendChild(el("div",{class:"kbhint",style:"margin-top:12px;font-size:11.5px;color:var(--ink-faint);text-align:center",html:'Press <kbd>1</kbd>–<kbd>4</kbd> to answer'}));
  }
}

/* ---------------- put them in order ----------------
   Tap to place, tap again to take back. A drag would be the obvious gesture and the

function renderOrder(){
  var s = S.session; if(!s || s.mode !== "order") return go("home");
  if(!s.sets.length) return go("home");
  if(s.i >= s.sets.length) return renderOrderDone(s);
  var set = s.sets[s.i];

  var byId = {}; set.forEach(function(c){ byId[c.id] = c; });

    el("span",{class:"counter",text:"Set " + (s.i+1) + " / " + s.sets.length}),
    el("span",{class:"counter",text: s.checked ? (s.right + " / " + s.total + " in place") : (s.placed.length + " of " + set.length + " placed")})
  ]));
  stage.appendChild(track(s.i/s.sets.length*100));

  var board = el("div",{class:"ctable ordboard"},[
    el("div",{class:"cth"},[
      el("h3",{text: s.checked ? "How that went" : "Put these in order"}),

                                          : "Tap one to place it, tap it again to take it back."})
    ])

  set.forEach(function(right, idx){

    if(s.checked){

      board.appendChild(el("div",{class:"crow " + (ok ? "ok" : "no")},[
        el("span",{class:"pl",text:String(idx+1)}),
        el("span",{class:"pv"},[

/* ---------------- fill the blank ----------------
   Type the answer with the sentence instead of the definition. The marking, the two
   second-thoughts buttons and the score screen are the same ones — only the question
   and what counts as the answer are different. */
function renderCloze(){
  var s = S.session; if(!s) return go("home");
  if(s.i >= s.cards.length) return renderScore("Fill the blank", s);
  var c = s.cards[s.i], cz = cloze(c);
  if(!cz){ s.i++; return render(); }                 // a card edited out from under the round
  stage.appendChild(modeHead("Fill the blank"));
  stage.appendChild(el("div",{class:"deskrow"},[
    el("span",{class:"counter",text:(s.i+1) + " / " + s.cards.length}),
    el("span",{class:"counter",text:s.correct + " correct"})
  ]));
  stage.appendChild(track(s.i/s.cards.length*100));
  stage.appendChild(el("div",{class:"prompt cloze"},[
    el("div",{class:"role",text:"Finish the sentence"}),
    el("div",{class:"q",text:cz.text})
  ]));

  var input = el("input",{class:"answer",type:"text",placeholder:"The missing word\u2026","aria-label":"The missing word",autocomplete:"off",autocapitalize:"off",autocorrect:"off",spellcheck:"false"});
  if(s.state){ input.value = s.state.given; input.disabled = true; }

  if(!s.state){
    stage.appendChild(el("div",{class:"rowctl",style:"margin-top:12px"},[
      el("button",{class:"btn ghost",onclick:function(){ submitCloze(c, cz, ""); }},["Skip \u2014 show me"]),
      el("button",{class:"btn primary",onclick:function(){ submitCloze(c, cz, input.value); }},["Check"])
    ]));
    setTimeout(function(){ input.focus(); }, 0);
    input.addEventListener("keydown", function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); submitCloze(c, cz, input.value); } });
    return;
  }

  var st = s.state, cls = st.result === "no" ? "no" : (st.result === "near" ? "near" : "ok");
  var msg = st.result === "exact" ? (st.overridden ? "Counted as correct." : "Correct.")
          : st.result === "near" ? "Close enough \u2014 the word is "
          : st.undone ? "Counted as wrong \u2014 the word is "
          : "Not quite \u2014 the word is ";
  stage.appendChild(el("div",{class:"verdict " + cls},[
    el("span",{},[ msg, st.result === "exact" ? null : el("b",{text:cz.want}) ]),
    el("span",{class:"rowctl"},[
      st.result === "no" ? el("button",{class:"btn sm",onclick:function(){ overrideWrite(c); }},["I was right"]) : null,
      (st.result === "near" || st.overridden) ? el("button",{class:"btn sm",onclick:function(){ undoWrite(c); }},["I was wrong"]) : null,
      el("button",{class:"btn sm",onclick:nextWrite},[ s.i + 1 >= s.cards.length ? "See score" : "Next", icon("M9 6l6 6-6 6",14)])
    ])
  ]));
  // What the sentence actually says, now that it has been asked.
  stage.appendChild(el("div",{class:"exline",style:"margin:14px auto 0;text-align:center",text:exOf(c).replace(/[\[\]]/g, "")}));
  stage.appendChild(el("div",{class:"kbhint",style:"margin-top:12px;font-size:11.5px;color:var(--ink-faint);text-align:center",html:'Press <kbd>Enter</kbd> to continue'}));
}
function submitCloze(c, cz, given){
  var s = S.session;
  var r = given.trim() ? grade(given, cz.want) : "no";
  s.state = {given:given, result:r};
  if(r === "no") s.missed.push(c); else s.correct++;
  record(c.id, r !== "no");
  render();
}
function submitWrite(c, given){
  var s = S.session;
  var r = given.trim() ? grade(given, ans(c)) : "no";
  s.state = {given:given, result:r};
  if(r === "no") s.missed.push(c); else s.correct++;
  record(c.id, r !== "no");
  render();
}
function overrideWrite(c){
  var s = S.session;
  s.state.result = "exact"; s.state.overridden = true; s.state.undone = false; s.correct++;
  var k = s.missed.indexOf(c); if(k > -1) s.missed.splice(k,1);
  var p = prog(S.deckId, c.id); p.wrong = Math.max(0, p.wrong - 1); p.right++; p.last = "right"; saveLocal();
  render();
}
/* The other half of "I was right". A near miss is counted as correct, and only the
   person who typed it knows whether they actually had it or were guessing at the
   shape of the word — so the generous call is theirs to refuse. Undoing the override
   above goes through here too, which makes both buttons reversible. */
function undoWrite(c){
  var s = S.session, st = s.state;
  if(!st || st.result === "no") return;
  st.result = "no"; st.overridden = false; st.undone = true;
  s.correct = Math.max(0, s.correct - 1);
  if(s.missed.indexOf(c) === -1) s.missed.push(c);
  var p = prog(S.deckId, c.id); p.right = Math.max(0, p.right - 1); p.wrong++; p.last = "wrong"; saveLocal();
  render();
}
function nextWrite(){ var s = S.session; s.i++; s.state = null; render(); }

      el("button",{class:"btn",onclick:function(){ startMode(s.mode); }},["Start over"]),

    ])

function retryMissed(s){
  var again = s.missed.slice();

  else if(s.mode === "pos") S.session = {mode:"pos", cards:shuffled(again), i:0, picked:null, correct:0, missed:[]};
  else if(s.mode === "cloze") S.session = {mode:"cloze", cards:shuffled(again), i:0, state:null, correct:0, missed:[]};
  else S.session = {mode:"write", cards:shuffled(again), i:0, state:null, correct:0, missed:[]};
  render();
}

/* ---------------- matching ---------------- */
var matchTimer = null;
function startMatch(order){
  var picked = order.slice(0, Math.min(6, order.length));
  var tiles = [];
  picked.forEach(function(c){
    tiles.push({id:c.id, kind:"term", text:c.term || "—"});
    tiles.push({id:c.id, kind:"def", text:defText(c) || "—"});
  });
  S.session = {mode:"match", pairs:picked.length, tiles:shuffled(tiles), sel:null, done:{}, miss:null, start:Date.now(), elapsed:0, over:false, errors:0};
  clearInterval(matchTimer);
  matchTimer = setInterval(function(){
    var s = S.session;
    if(!s || s.mode !== "match" || s.over){ clearInterval(matchTimer); return; }
    s.elapsed = (Date.now() - s.start)/1000;
    var t = $("mtimer"); if(t) t.textContent = s.elapsed.toFixed(1) + "s";
  }, 100);
}
function renderMatch(){
  var s = S.session; if(!s || s.mode !== "match") return go("home");
  var d = deck(), best = (S.bests[d.id] || {})[s.pairs];
  stage.appendChild(modeHead("Matching"));
  if(s.over){
    clearInterval(matchTimer);
    var isBest = !best || s.elapsed < best;
    if(isBest){ (S.bests[d.id] = S.bests[d.id] || {})[s.pairs] = s.elapsed; saveLocal(); }
    stage.appendChild(el("div",{class:"result"},[
      el("div",{class:"eyebrow",text: isBest ? "New best time" : "Cleared"}),
      el("div",{class:"score",text:s.elapsed.toFixed(1) + "s"}),
      el("p",{style:"margin:2px 0 20px;color:var(--ink-soft);font-size:14px",text: s.pairs + " pairs · " + s.errors + (s.errors === 1 ? " wrong pairing" : " wrong pairings") + (best && !isBest ? " · best " + best.toFixed(1) + "s" : "")}),
      el("div",{class:"rowctl"},[
        el("button",{class:"btn primary",onclick:function(){ startMode("match"); }},["Play again"]),
        el("button",{class:"btn ghost",onclick:function(){ S.session=null; go("home"); }},["Back to deck"])
      ])
    ]));
    return;
  }
  s.leftLbl = el("span",{class:"counter",text:pairsLeft(s)});
  stage.appendChild(el("div",{class:"deskrow"},[
    el("span",{class:"counter",id:"mtimer",text:s.elapsed.toFixed(1) + "s"}),
    s.leftLbl
  ]));
  // The grid is built once and then only reclassed, so selecting a tile, clearing a
  // pair and getting one wrong all have a node to animate on. Rebuilt tiles would
  // arrive already faded and nothing would move.
  var grid = el("div",{class:"matchgrid"});
  s.nodes = s.tiles.map(function(t, idx){
    var b = el("button",{class:"tile " + t.kind, text:t.text, onclick:function(){ tapTile(idx); }});
    grid.appendChild(b); return b;
  });
  paintTiles();
  stage.appendChild(grid);
}
function pairsLeft(s){
  var d = deck(), best = (S.bests[d.id] || {})[s.pairs];
  var left = s.pairs - Object.keys(s.done).length;
  return left + " " + (left === 1 ? "pair" : "pairs") + " left" + (best ? " · best " + best.toFixed(1) + "s" : "");
}
function paintTiles(){
  var s = S.session; if(!s || !s.nodes) return;
  s.tiles.forEach(function(t, idx){
    var n = s.nodes[idx]; if(!n) return;
    var done = !!s.done[t.id];
    n.classList.toggle("done", done);
    n.classList.toggle("sel", !done && s.sel === idx);
    // Restarted rather than merely added, so a second wrong pairing shakes again.
    if(s.miss === idx) replay(n, "miss"); else n.classList.remove("miss");
  });
  if(s.leftLbl) s.leftLbl.textContent = pairsLeft(s);
}
function tapTile(idx){
  var s = S.session, t = s.tiles[idx];
  if(s.done[t.id] || s.miss !== null) return;
  if(s.sel === null){ s.sel = idx; return paintTiles(); }
  if(s.sel === idx){ s.sel = null; return paintTiles(); }
  var a = s.tiles[s.sel];
  if(a.id === t.id && a.kind !== t.kind){
    s.done[t.id] = true; s.sel = null;
    record(t.id, true);
    if(Object.keys(s.done).length === s.pairs){
      s.over = true; s.elapsed = (Date.now() - s.start)/1000;
      paintTiles();
      // The last pair gets to finish fading before the time goes up over it.
      setTimeout(function(){ if(S.session === s) render(); }, 280);
      return;
    }
    return paintTiles();
  }
  s.errors++;
  record(t.id, false);
  s.miss = idx; paintTiles();
  setTimeout(function(){ if(S.session === s){ s.miss = null; s.sel = null; paintTiles(); } }, 460);
}

    el("h3",{text:"Paste a list"}),
    el("p",{text: kindOf(d) === "conj"

      : kindOf(d) === "vocab"

      : kindOf(d) === "cat"

    el("p",{class:"saveflag",style:"margin:-8px 0 12px",

    box,

/* ---- coming back from Google ----
   The round trip ends at this page with a one-time code in the address bar, which
   has to be exchanged for a session before it is any use. Everything here exists
   because that exchange used to be able to not happen, and when it doesn't the
   only visible result is landing back on the home page still signed out — which
   is indistinguishable from the page having simply reloaded. */
var BACK_KEY = "recalldesk.after-signin";
function authReturning(){
  // ?code= is the current flow, #access_token= the older one, error= either refusing.
  return /[?&]code=|access_token=|[?&]error=/.test(location.search + location.hash);
}
function storedSession(){
  try{
    return Object.keys(localStorage).some(function(k){
      return k.indexOf("sb-") === 0 && k.indexOf("-auth-token") > -1;
    });
  }catch(e){ return false; }
}
// The code is good for one exchange, so it must not be left in the address bar to
// be re-read on a refresh. The deck the reader came in on is kept.
function cleanAuthUrl(){
  if(!authReturning()) return;
  var h = /access_token=|[?&]error=/.test(location.hash) ? "" : location.hash;
  try{ history.replaceState(null, "", location.pathname + h); }catch(e){}
}
// Where they were when they left, so signing in doesn't dump them on the front page.
function rememberWhere(){
  try{ sessionStorage.setItem(BACK_KEY, location.hash || ""); }catch(e){}
}
function goBackAfterSignIn(){
  var h = null;
  try{ h = sessionStorage.getItem(BACK_KEY); sessionStorage.removeItem(BACK_KEY); }catch(e){}
  if(!h) return false;
  try{ location.hash = h.replace(/^#/, ""); }catch(e){ return false; }
  return routeHash();
}

/* ---- progress that follows the student between devices ----
   Merged field by field, taking the larger of each count and the higher Learn rung, so
   studying on a phone and then a laptop adds up instead of one overwriting the other. */
function mergeCard(a, b){
  a = a || {}; b = b || {};
  return {
    seen: Math.max(a.seen||0, b.seen||0), right: Math.max(a.right||0, b.right||0),
    wrong: Math.max(a.wrong||0, b.wrong||0), star: !!(a.star || b.star),
    last: (b.last || a.last) || null

  if(!sb || !S.user) return Promise.resolve();

    if(r.error || !r.data) return;
    r.data.forEach(function(row){
      var pay = row.payload || {}, id = row.deck_id;
      var mine = S.progress[id] || (S.progress[id] = {});
      Object.keys(pay.progress || {}).forEach(function(cid){ mine[cid] = mergeCard(mine[cid], pay.progress[cid]); });
      var l = S.learn[id] || (S.learn[id] = {});
      Object.keys(pay.learn || {}).forEach(function(cid){ l[cid] = Math.max(l[cid] || 0, pay.learn[cid] || 0); });
      if(pay.bests){
        var bb = S.bests[id] || (S.bests[id] = {});
        Object.keys(pay.bests).forEach(function(k){ bb[k] = bb[k] ? Math.min(bb[k], pay.bests[k]) : pay.bests[k]; });

/* ---------------- review ----------------
   Learn works a deck at a time, which is no help the evening before three quizzes.
   This gathers the shaky cards from every deck and puts the soonest quiz first. */
function urgency(d){
  var n = daysUntil(d.quiz);
  if(n === null) return 0.8;          // no date set: still worth seeing, just not first
  if(n < 0) return 0.3;               // already happened
  if(n <= 2) return 3;
  if(n <= 7) return 2;
  return 1.2;
}
function weakEverywhere(limit){
  var out = [];
  S.decks.forEach(function(d){
    var soon = urgency(d), all = unitsOf(d);
    all.forEach(function(u){
      var pr = prog(d.id, u.id), st = lstage(d.id, u.id), mx = maxStage(d, u), base = 0;
      if(pr.wrong > 0 && pr.last !== "right") base = 3;        // got it wrong, not yet fixed
      else if(st > 0 && st < mx) base = 2;                      // started, not finished
      else if(pr.star) base = 1.5;                              // you flagged it yourself
      else if(!pr.seen && soon >= 2) base = 1;                  // never seen, quiz is close
      if(!base) return;
      out.push({deck:d, unit:u, score: base * soon, all: all});
    });
  });
  out.sort(function(a,b){ return b.score - a.score; });
  return out.slice(0, limit || 20);
}
function startReview(){
  shutRail();
  var items = weakEverywhere(20);
  if(!items.length) return toast("Nothing needs reviewing — go and enjoy yourself");
  S.session = {mode:"review", items: shuffled(items), i:0, answer:null, correct:0};
  setHash("review");
  S.view = "review"; render(); window.scrollTo(0,0);
}
function renderReview(){
  var s = S.session;
  if(!s || s.mode !== "review") return go("home");
  if(s.i >= s.items.length) return renderReviewDone(s);
  var it = s.items[s.i], u = it.unit, d = it.deck, a = s.answer;
  if(s.kindFor !== s.i){
    s.kind = canChoose(it.all) ? "choice" : "type";
    s.choices = s.kind === "choice" ? buildChoices(u, it.all) : null;
    s.kindFor = s.i;
  }
  var right = ans(u);

  stage.appendChild(el("div",{class:"stage-head"},[
    el("div",{},[ el("h2",{text:"Review"}),
      el("div",{class:"sub",text:"The cards you keep missing, from every deck, soonest quiz first."}) ]),
    el("button",{class:"btn ghost",onclick:function(){ S.session = null; go("home"); }},[icon(I.back,15),"Done"])
  ]));
  stage.appendChild(el("div",{class:"deskrow"},[
    el("span",{class:"counter",text:(s.i+1) + " / " + s.items.length}),
    el("span",{class:"counter",text:s.correct + " right"})
  ]));
  stage.appendChild(track(s.i/s.items.length*100));
  stage.appendChild(el("div",{class:"prompt"},[
    el("div",{class:"role",text: u.fixed ? "Which form?" : ASK_LABEL()}),
    el("div",{class:"q",text:ask(u) || "—"}),
    el("div",{class:"fromdeck",text:(d.name || "Untitled deck") + (d.quiz ? " · quiz " + whenText(d.quiz) : "")})
  ]));

  if(s.kind === "choice"){
    var wrap = el("div",{class:"choices"});
    s.choices.forEach(function(opt, idx){
      var cls = "choice";
      if(a){ if(opt === right) cls += " right"; else if(idx === a.picked) cls += " wrong"; }
      wrap.appendChild(el("button",{class:cls, disabled: a ? "disabled" : null,
        onclick:function(){ answerReview({picked:idx, ok: opt === right}); }},[
        el("span",{class:"key",text:String(idx+1)}), el("span",{text:opt})
      ]));
    });
    stage.appendChild(wrap);
  } else {
    var inp = el("input",{class:"answer",type:"text",placeholder:"Type the answer…","aria-label":"Your answer",autocomplete:"off",autocapitalize:"off",autocorrect:"off",spellcheck:"false"});
    if(a){ inp.value = a.given || ""; inp.disabled = true; }
    else {
      inp.addEventListener("keydown", function(ev){
        if(ev.key === "Enter"){
          ev.preventDefault();
          var r = grade(inp.value, right);
          answerReview({given: inp.value, result: r, ok: r !== "no"});
        }
      });
      setTimeout(function(){ inp.focus(); }, 0);
    }
    stage.appendChild(inp);
  }

  if(!a){
    stage.appendChild(el("div",{class:"rowctl",style:"margin-top:14px;justify-content:space-between"},[
      el("span",{style:"font-size:11.5px;color:var(--ink-faint)",
        html: s.kind === "choice" ? 'Press <kbd>1</kbd>–<kbd>' + s.choices.length + '</kbd>' : 'Press <kbd>Enter</kbd> to check'}),
      el("button",{class:"linkbtn",onclick:function(){ answerReview({given:"", ok:false, skipped:true}); }},["Don't know?"])
    ]));
    return;
  }
  /* A near miss is counted as right, and Review used to just say "Correct." and move
     on — so the one call worth arguing with was the one it didn't mention. It now
     reads the same as the other two typed modes, and can be refused or claimed. */
  var near = a.result === "near";
  var cls = a.ok ? (near ? "near" : "ok") : "no";
  stage.appendChild(el("div",{class:"verdict " + cls},[
    el("span",{}, near ? ["Close enough — the exact wording is ", el("b",{text:right}), "."]
               : a.ok  ? [a.overridden ? "Counted as correct." : "Correct."]
               :         [a.undone ? "Counted as wrong — the answer is "
                        : a.skipped ? "The answer is " : "Not quite — the answer is ", el("b",{text:right})]),
    el("span",{class:"rowctl"},[
      (!a.ok && !a.skipped && a.given) ? el("button",{class:"btn sm",onclick:reviewRight},["I was right"]) : null,
      (near || a.overridden) ? el("button",{class:"btn sm",onclick:reviewWrong},["I was wrong"]) : null,
      el("button",{class:"btn sm",onclick:nextReview},[ s.i + 1 >= s.items.length ? "Finish" : "Next", icon(I.chev,14)])
    ])
  ]));
}
// The same pair as everywhere else, and each undoes the other, so the score can't drift.
function reviewRight(){
  var s = S.session, a = s && s.answer;
  if(!a || a.ok) return;
  var it = s.items[s.i];
  a.ok = true; a.result = "exact"; a.overridden = true; a.undone = false;
  s.correct++;
  recordIn(it.deck.id, it.unit.id, true);
  clearTimeout(learnTimer);
  render();
}
function reviewWrong(){
  var s = S.session, a = s && s.answer;
  if(!a || !a.ok) return;
  var it = s.items[s.i];
  a.ok = false; a.result = "no"; a.overridden = false; a.undone = true;
  s.correct = Math.max(0, s.correct - 1);
  recordIn(it.deck.id, it.unit.id, false);
  clearTimeout(learnTimer);          // a near miss was about to carry them off
  render();
}
function answerReview(a){
  var s = S.session; if(!s || s.answer) return;
  var it = s.items[s.i];
  s.answer = a;
  if(a.ok) s.correct++;
  recordIn(it.deck.id, it.unit.id, a.ok);
  render();
  // Only a clean hit moves on by itself. A near miss is exactly the one worth
  // reading, and carrying them off it would take the "I was wrong" with it.
  if(a.ok && a.result !== "near"){
    clearTimeout(learnTimer);
    learnTimer = setTimeout(function(){ if(S.session === s && s.answer === a) nextReview(); }, 900);
  }
}
function nextReview(){
  clearTimeout(learnTimer);
  var s = S.session; if(!s || !s.answer) return;
  s.i++; s.answer = null; render(); window.scrollTo(0,0);
}
function renderReviewDone(s){

    ])
  ]));
}

/* ---------------- who can do what ----------------
   Access can be handed out before someone has ever signed in: it waits under their
   email address and lands on the account the first time they arrive. */
var ROLES = [["student","Student"],["editor","Editor"],["owner","Owner"]];
function roleName(r){ for(var i=0;i<ROLES.length;i++) if(ROLES[i][0] === r) return ROLES[i][1]; return "Student"; }

function loadPeople(){
  if(!sb || !isOwner()) return Promise.resolve({people:[], invites:[]});
  return Promise.all([
    sb.from("profiles").select("id,name,email,avatar,role,is_editor").order("role",{ascending:true}),
    sb.from("invites").select("email,role,created_at").order("created_at",{ascending:false})
  ]).then(function(r){
    return {people: (r[0] && r[0].data) || [], invites: (r[1] && r[1].data) || []};
  }).catch(function(){ return {people:[], invites:[]}; });
}
function setRole(person, role){
  if(!sb) return;
  if(person.id === (S.user && S.user.id) && role !== "owner"){
    if(!confirm("Step yourself down from owner? You won't be able to change anyone's access afterwards, including your own.")) return render();
  }
  sb.from("profiles").update({role: role}).eq("id", person.id).then(function(r){
    if(r.error) return toast(r.error.message || "Couldn't change that");
    toast((person.name || "They") + " is now " + roleName(role).toLowerCase());
    if(person.id === (S.user && S.user.id)) loadProfile();
    render();
  });
}
function invite(email, role){
  if(!sb) return Promise.reject(new Error("not connected"));
  return sb.from("invites").upsert({email: email.trim().toLowerCase(), role: role, invited_by: S.user.id},
                                   {onConflict:"email"});
}

function approveSub(r){
  var pay = r.payload || {};
  var d = {
    id: uid("d"), name: pay.name || r.deck_name || "Untitled deck", subject: pay.subject || "",
    folder: "", createdAt: Date.now(), kind: pay.kind, tense: pay.tense, persons: pay.persons,
    cards: (pay.cards || []).map(function(c){
      var o = {id: uid(), term: c.term || "", def: c.def || ""};
      if(c.def2) o.def2 = c.def2;

var ADMIN_SALT = "recalldesk.v1.";
var ADMIN_HASH = "367a36dee35a4f0ac68c9ec1a3ec9ab7cbc2170907dce1da70bb2ee27cf10b5e";

function sha256hex(s){
  if(!(window.crypto && crypto.subtle)) return Promise.reject(new Error("insecure"));
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0" + b.toString(16)).slice(-2); }).join("");
  });
}

// Asks GitHub whether the saved token is still good, so a dead one is found here
// rather than halfway through publishing.
function checkToken(){
  var out = $("tokcheck"), btn = $("checktok");
  if(!out || !S.token) return;
  out.hidden = false; out.className = "saveflag"; out.textContent = "Asking GitHub…";
  if(btn) btn.setAttribute("disabled","disabled");
  ghFetch(GH_API + "?ref=" + GH_BRANCH).then(function(res){
    if(btn) btn.removeAttribute("disabled");
    if(res.ok){ out.className = "saveflag"; out.textContent = "Still good — you can publish."; return; }
    out.className = "err";
    out.textContent = ghError(res);
    if(res.status === 401){ setToken(null); setTimeout(function(){ render(); }, 1200); }
  }).catch(function(){
    if(btn) btn.removeAttribute("disabled");
    out.className = "err"; out.textContent = "Couldn't reach GitHub. Check your connection and try again.";
  });
}

    el("div",{class:"rowctl",style:"justify-content:flex-start"},[

    ]),
    el("p",{class:"saveflag",style:"margin:14px 0 0",text: (S.user && isEditor())
      ? "Signed in as the editor, so this is saved to your account — paste it once and never again, on any computer."
      : "Say yes when your browser offers to save it — then next time it fills itself in, and it follows you to your other devices."})
  ]));

  userIn.id = "ghuser"; tokIn.id = "ghtok";

  wrap.appendChild(el("div",{class:"panel"},[
    el("h3",{text:"What the token can and can't do"}),
    el("p",{html:"Scoped that way it can change <b>one file in one repo</b> and nothing else — not your other repos, not your account, not your other GitHub data. It lives in this browser\'s storage and, if you let the browser save it, in your password manager — so treat this like a signed-in session: don\'t set it up on a shared or classroom machine, and hit Disconnect if you ever do. If it leaks, revoke it at <code>github.com/settings/tokens</code> and make a new one — nothing else needs changing."})

document.addEventListener("keydown", function(ev){
  if(ev.key === "Escape" && phone() && !S.railShut){ ev.preventDefault(); return setRail(true); }
  var tag = (ev.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea" || tag === "select") return;
  if(ev.metaKey || ev.ctrlKey || ev.altKey) return;
  var s = S.session, k = ev.key;
  if(S.view === "flash" && s){
    if(k === " "){ ev.preventDefault(); if(FLASH) FLASH.flip(!s.flipped); }
    else if(k === "ArrowRight"){ ev.preventDefault(); advanceFlash(1); }
    else if(k === "ArrowLeft"){ ev.preventDefault(); advanceFlash(-1); }
    else if(k === "s" || k === "S"){ ev.preventDefault(); var c = s.cards[s.i]; if(c){ toggleStar(c.id); if(FLASH) FLASH.stars(); else render(); } }
  } else if(S.view === "quiz" && s && s.i < s.cards.length){
    if(s.picked === null && /^[1-4]$/.test(k)){
      var idx = parseInt(k,10) - 1;
      if(idx < s.choices.length){ ev.preventDefault(); pickChoice(idx, s.choices[idx] === ans(s.cards[s.i]), s.cards[s.i]); }
    } else if((k === "Enter" || k === " ") && s.picked !== null){ ev.preventDefault(); nextQuiz(); }
  } else if(S.view === "write" && s && s.state && (k === "Enter" || k === " ")){
    ev.preventDefault(); nextWrite();
  } else if(S.view === "review" && s && s.mode === "review" && s.i < s.items.length){
    if(!s.answer && s.kind === "choice" && /^[1-4]$/.test(k)){
      var ri = parseInt(k,10) - 1;
      if(s.choices && ri < s.choices.length){ ev.preventDefault(); answerReview({picked:ri, ok: s.choices[ri] === ans(s.items[s.i].unit)}); }
    } else if(s.answer && (k === "Enter" || k === " ")){ ev.preventDefault(); nextReview(); }
    if(k === "Escape"){ S.session = null; go("home"); }
  } else if(S.view === "test" && s && s.mode === "test" && !s.over){
    var tq = s.qs[s.i];
    if(tq.kind !== "type" && /^[1-4]$/.test(k)){
      var ti = parseInt(k,10) - 1;
      if(tq.choices && ti < tq.choices.length){ ev.preventDefault(); tq.given = tq.choices[ti]; render(); setTimeout(function(){ nextTestQ(1); }, 160); }
    } else if(k === "Enter"){ ev.preventDefault(); nextTestQ(1); }
    else if(k === "ArrowLeft"){ ev.preventDefault(); nextTestQ(-1); }
    else if(k === "ArrowRight"){ ev.preventDefault(); nextTestQ(1); }
  } else if(S.view === "pos" && s && s.i < s.cards.length){
    if(s.picked === null && /^[1-4]$/.test(k)){
      var pi = parseInt(k,10) - 1;
      if(s.choices && pi < s.choices.length){ ev.preventDefault(); pickPos(pi); }
    } else if((k === "Enter" || k === " ") && s.picked !== null){ ev.preventDefault(); nextPos(); }
    if(k === "Escape"){ S.session = null; go("home"); }
  } else if(S.view === "order" && s && s.mode === "order"){
    if(s.checked && (k === "Enter" || k === " ")){ ev.preventDefault(); nextOrder(); }
    if(k === "Escape"){ S.session = null; go("home"); }
  } else if(S.view === "table" && s && s.mode === "table"){
    if(s.checked && (k === "Enter" || k === " ")){ ev.preventDefault(); nextTable(); }
    if(k === "Escape"){ S.session = null; go("home"); }
  } else if(S.view === "learn" && s && s.mode === "learn"){
    if(s.i >= s.queue.length){
      if(k === "Enter"){ ev.preventDefault(); learnContinueRound(); }
    } else if(!s.answer && s.kind !== "type" && /^[1-4]$/.test(k)){
      var li = parseInt(k,10) - 1;
      if(s.choices && li < s.choices.length){ ev.preventDefault(); learnPick(li); }
    } else if(s.answer && (k === "Enter" || k === " ")){ ev.preventDefault(); learnNext(); }
    if(k === "Escape"){ S.session = null; go("home"); }
  } else if(S.view !== "home" && k === "Escape"){
    S.session = null; go("home");
  }
});

/* ============================ boot ============================ */
try{ S.who = localStorage.getItem(WHO_KEY) || null; }catch(e){ S.who = null; }
try{ S.token = localStorage.getItem(TOKEN_KEY) || null; }catch(e){ S.token = null; }
if(S.token) keepStorage();

/* Two jobs, kept apart, because tying them together is what made signing in
   unreliable. Asking the project which methods are switched on only decides which
   buttons to draw, and the app is fine without the answer. Finishing a sign-in
   that is already half done is not optional — and it used to sit behind that first
   request, so one flaky reply and the code in the address bar was never exchanged.
   The reader went to Google, came straight back, and was still signed out. */

// 1. Which buttons to draw. Best-effort; a failure costs nothing but the buttons.
fetch(SB_URL + "/auth/v1/settings", {headers:{apikey: SB_KEY}})
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(cfg){
    if(!cfg) return;
    var x = cfg.external || {};
    S.providers = {google: !!x.google, email: !!x.email};
    if(S.view === "who") render();         // the panel was drawn before the answer came
  })
  .catch(function(){});

// 2. Pick up the session — arriving back from Google now, or saved here earlier.
//    Starts immediately and waits for nothing.
(function(){
  var back = authReturning();
  if(!back && !storedSession()) return;
  sbLoad().then(function(c){
    return c.auth.getSession().then(function(r){
      c.auth.onAuthStateChange(function(ev, sess){
        if(ev === "SIGNED_IN" && sess && (!S.user || S.user.id !== sess.user.id)) setUser(sess.user);
        if(ev === "SIGNED_OUT") setUser(null);
      });
      if(r.data && r.data.session){
        S.authError = null;
        cleanAuthUrl();
        setUser(r.data.session.user);
        // Back to the deck they were reading when they left.
        if(back) goBackAfterSignIn();
      }
      // Came back from Google with nothing to show for it: say so, rather than
      // landing quietly on the home page.
      else if(back) signInFailed();
      else render();
    });
  }).catch(function(err){
    if(back) signInFailed("Couldn't reach the sign-in service to finish signing you in. Check the connection and try again.");
  });
})();
S.open = ls(FOLD_KEY, {});
S.firstVisit = !hasSeen();
markSeen();
try{ S.railShut = localStorage.getItem(RAIL_KEY) === "1"; }catch(e){ S.railShut = false; }
// A phone always starts on the content. The saved preference is the laptop's.
if(phone()) S.railShut = true;
try{ S.conjMode = localStorage.getItem(CONJ_KEY) === "meaning" ? "meaning" : "forms"; }catch(e){}
try{ S.theme = localStorage.getItem(THEME_KEY) || ""; }catch(e){ S.theme = ""; }
try{ S.custom = JSON.parse(localStorage.getItem(CUSTOM_KEY) || "null"); }catch(e){ S.custom = null; }
if(S.custom && !hx(S.custom.paper)) S.custom = null;
if(S.theme === "custom" && !S.custom) S.theme = "";
paintTheme();
setRail(S.railShut);
$("reopen").addEventListener("click", function(){ setRail(false); });
$("scrim").addEventListener("click", function(){ setRail(true); });
$("deskbtn").addEventListener("click", function(){ go("desk"); });
syncDeskBtn();        // hidden for a student, and the heading gutter with it
// Rotating a phone, or dragging a window across the breakpoint, swaps which of
// the two the sidebar is — so hand it back the state that kind of screen wants.
(function(){
  var was = phone();
  window.addEventListener("resize", function(){
    var now = phone();
    if(now === was) return;
    was = now;
    if(now) return setRail(true);
    var pref = false;
    try{ pref = localStorage.getItem(RAIL_KEY) === "1"; }catch(e){}
    setRail(pref);
  });
})();
loadLocal();
$("whobtn").addEventListener("click", function(){ go("who"); });
$("homebtn").addEventListener("click", function(){ go("start"); });
refreshFoot();
renderRail();
render();

function copy(x){ return JSON.parse(JSON.stringify(x)); }
function currentStore(){ return {folders:S.folders, decks:S.decks}; }
function useStore(st){ st = copy(st || {folders:[], decks:[]}); S.folders = st.folders; S.decks = st.decks; STORE_VER++; }
// Accepts decks.json with or without folders, and drops a deck's folder if it points nowhere.
function normalizeStore(raw){
  var folders = (raw && Array.isArray(raw.folders) ? raw.folders : []).map(function(f){
    return {id: String(f.id || uid("f")), name: f.name || "Untitled folder", parent: f.parent ? String(f.parent) : "", archive: !!f.archive};
  });
  var ids = {}, byId = {};
  folders.forEach(function(f){ ids[f.id] = true; byId[f.id] = f; });
  // A parent that doesn't exist puts the folder at the top level; a loop is cut where it closes.
  folders.forEach(function(f){ if(!ids[f.parent] || f.parent === f.id) f.parent = ""; });
  folders.forEach(function(f){
    var p = f.parent, steps = 0;
    while(p && steps++ <= folders.length){
      if(p === f.id){ f.parent = ""; break; }
      p = byId[p] ? byId[p].parent : "";
    }
  });
  var list = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.decks) ? raw.decks : []);
  var decks = list.map(function(v, n){
    return {
      id: v.id || uid("d"),
      name: v.name || "Untitled deck",
      subject: v.subject || "",
      folder: ids[v.folder] ? v.folder : "",
      quiz: parseDate(v.quiz) ? String(v.quiz) : "",
      kind: (v.kind === "vocab" || v.kind === "conj" || v.kind === "cat" || v.kind === "order") ? v.kind : undefined,
      cats: Array.isArray(v.cats) ? v.cats.map(function(x){ return String(x == null ? "" : x); }) : undefined,
      catName: v.catName ? String(v.catName) : undefined,
      tense: v.tense ? String(v.tense) : "",
      persons: (Array.isArray(v.persons) && v.persons.length
        ? v.persons.filter(function(x){ return x && x.id; }).map(function(x, k){
            return {id: String(x.id), label: x.label ? String(x.label) : "Form " + (k+1)};
          })
        : null) || undefined,
      cards: (Array.isArray(v.cards) ? v.cards : []).map(function(c){
        var out = {id: c.id || uid(), term: c.term || "", def: c.def || ""};
        if(String(c.def2 || "").trim()) out.def2 = String(c.def2);
        if(String(c.ex || "").trim()) out.ex = String(c.ex);
        // A vocabulary deck's labels have to be one of the nine. A categories deck's
        // are whatever the teacher wrote, so they are taken as they come.
        var free = v.kind === "cat";
        if(c.pos2 && (free || POS.indexOf(String(c.pos2)) > -1)) out.pos2 = String(c.pos2);
        if(c.pos && (free || POS.indexOf(String(c.pos)) > -1)) out.pos = String(c.pos);
        if(c.forms && typeof c.forms === "object"){
          out.forms = {};
          Object.keys(c.forms).forEach(function(k){ out.forms[k] = String(c.forms[k] == null ? "" : c.forms[k]); });
        }
        return out;
      }),
      createdAt: v.createdAt || n
    };
  }).sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); });
  return {folders:folders, decks:decks};
}

/* Best-effort and quite separate from the decks: no file yet simply means nobody
   has written one, and a notice that can't be fetched must never hold up a deck. */
fetch("notices.json", {cache:"no-store"})
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(raw){ S.notices = normalizeNotices(raw); maybeShowNotice(); })
  .catch(function(){});

fetch("decks.json", {cache:"no-store"})
  .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(function(raw){
    S.published = normalizeStore(raw);
    var draft = ls(DRAFT_KEY, null);
    if(draft){
      useStore(normalizeStore(draft));
      S.draft = true;
      var b = ls(BASE_KEY, null);
      S.base = b ? normalizeStore(b) : null;          // a draft from before this existed has none
      if(S.base && !sameJSON(S.base, S.published)) S.remoteMoved = true;
    } else {
      useStore(S.published);
      setBase(null);
    }
    S.ready = true;
    if(!S.deckId && S.decks.length) S.deckId = S.decks[0].id;
    refreshFoot(); renderRail();
    // Unless a sign-in is mid-flight: the two arrive in either order, and the decks
    // landing second must not quietly replace the page explaining what went wrong.
    if(S.view === "who"){ render(); }
    else if(!routeHash()){
      var back = recentDeck();
      if(back) openDeck(back.id);
      else { S.view = "start"; setHash("home"); render(); }
    }
    maybeShowNotice();                   // whichever of the two files lands last
  })
  .catch(function(err){
    S.ready = true; S.loadError = err;
    setSync(false, "Couldn't load decks");
    render();
  });

/* -------- pick up newly published decks without a reload --------
   Students leave this open; a publish should reach them on its own. Nothing is
   swapped out from under an editor with unsaved work or a student mid-session. */
function applyIncoming(){
  if(!S.incoming) return false;
  S.published = S.incoming; S.incoming = null;
  useStore(S.published);
  if(!deck() && S.decks.length) S.deckId = S.decks[0].id;
  renderRail();
  return true;
}
function pollPublished(){
  if(document.hidden || !S.ready || S.loadError) return;
  fetch("decks.json", {cache:"no-store"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(raw){
      if(!raw) return;
      var next = normalizeStore(raw);
      if(JSON.stringify(next) === JSON.stringify(S.published)) return;
      S.incoming = next;
      if(S.draft){
        // Someone else published. Keep what students see up to date, but leave the
        // base alone — it is the only record of what this draft started from, and
        // the merge at publish time is useless without it.
        S.published = next; S.incoming = null;
        S.remoteMoved = true;
        var m = $("pubmsg");
        if(m && !S.busy){ m.textContent = ""; m.appendChild(unpublishedMsg()); }
        return toast("Someone else published \u2014 your changes will be merged in when you publish");
      }
      if(S.session || S.view === "edit") return toast("New cards — they'll appear when you're done");
      applyIncoming();
      if(S.view === "home" || S.view === "folder") render();
      toast("Decks updated");
    })
    .catch(function(){});
}
window.addEventListener("hashchange", function(){
  if(hashBusy) return;                       // our own update, not the reader's
  if(!routeHash() && !location.hash) { S.view = "home"; render(); }
});
/* Offline. Registered last and wrapped, so a browser that refuses it changes nothing.
   Add ?nosw to the address to tear it down if it ever misbehaves. */
if("serviceWorker" in navigator && location.protocol !== "file:"){
  if(/[?&]nosw\b/.test(location.search)){
    navigator.serviceWorker.getRegistrations().then(function(rs){
      return Promise.all(rs.map(function(r){ return r.unregister(); }));
    }).then(function(){
      // clear the stored copies from here too: the worker is already gone by now
      return window.caches ? caches.keys().then(function(k){ return Promise.all(k.map(function(n){ return caches.delete(n); })); }) : null;
    }).then(function(){ toast("Offline support switched off"); });
  } else {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
}
setInterval(pollPublished, 60000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) pollPublished(); });
})();
</script>
