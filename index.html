<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quizletish</title>
<meta name="description" content="Term drills for a law course — flashcards, multiple choice, typed recall, and timed matching.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='21' fill='%23FBF8F1' stroke='%2314110D' stroke-width='2.5'/%3E%3Cpath d='M3 13h26' stroke='%23A8321F' stroke-width='2.5'/%3E%3Cpath d='M9 19h14M9 23h9' stroke='%2314110D' stroke-width='2'/%3E%3C/svg%3E">
<style>[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,600&display=swap">
<style>
/* Quizletish — a card-catalogue drawer, not a dashboard.
   Warm manila stock, black ink, one stamped red. Rules instead of shadows;
   where a shadow appears it is a hard offset, the way a stacked card sits. */
:root{
  --paper:#EFE9DE;
  --surface:#FBF8F1;
  --surface-2:#E6DFD1;
  --ink:#14110D;
  --ink-soft:#5B5346;
  --ink-faint:#8E8574;
  --rule:#C6BCA8;
  --rule-soft:#DCD3C2;
  --accent:#14110D;          /* the accent IS the ink — fills, not tints */
  --accent-ink:#FBF8F1;
  --accent-wash:#E2DACA;
  --brass:#8A6714;
  --brass-wash:#F0E4C6;
  --good:#3D5C36;
  --good-wash:#DFE7D7;
  --bad:#A8321F;
  --bad-wash:#F5DFD9;
  --ui:"Libre Franklin","Helvetica Neue",Helvetica,Arial,sans-serif;
  --read:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --rail:262px;
  --lift:3px 3px 0 var(--rule);
  --r:7px;          /* one dial for every corner in the app */
  --r-lg:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#151310;
    --surface:#1E1A15;
    --surface-2:#272219;
    --ink:#EDE6D8;
    --ink-soft:#A79C89;
    --ink-faint:#7A7161;
    --rule:#3A3429;
    --rule-soft:#2B261E;
    --accent:#EDE6D8;
    --accent-ink:#151310;
    --accent-wash:#332D23;
    --brass:#D2A94A;
    --brass-wash:#2E2718;
    --good:#86A874;
    --good-wash:#1F2819;
    --bad:#DC7159;
    --bad-wash:#301D18;
    --lift:3px 3px 0 var(--rule);
  }
}
:root[data-theme="dark"]{
  --paper:#151310;
  --surface:#1E1A15;
  --surface-2:#272219;
  --ink:#EDE6D8;
  --ink-soft:#A79C89;
  --ink-faint:#7A7161;
  --rule:#3A3429;
  --rule-soft:#2B261E;
  --accent:#EDE6D8;
  --accent-ink:#151310;
  --accent-wash:#332D23;
  --brass:#D2A94A;
  --brass-wash:#2E2718;
  --good:#86A874;
  --good-wash:#1F2819;
  --bad:#DC7159;
  --bad-wash:#301D18;
  --lift:3px 3px 0 var(--rule);
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:var(--r)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
kbd{font-family:var(--mono);font-size:11px;background:var(--surface-2);border:1px solid var(--rule);border-bottom-width:2px;border-radius:var(--r);padding:1px 5px;color:var(--ink-soft)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* catalogue labels: mono small caps, the way a drawer is labelled */
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}

/* ---- chrome ---- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{border-right:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 15px;border-bottom:2px solid var(--ink);display:flex;align-items:baseline;gap:8px}
.brand h1{font-family:var(--read);font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1}
.brand h1 em{font-style:italic;color:var(--bad)}
.brand .tag{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.04em}
.rail-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px 7px}
.decks{list-style:none;margin:0;padding:0 10px 10px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:1px}
.deck-btn{width:100%;text-align:left;padding:9px 10px;border-radius:var(--r);display:flex;align-items:baseline;gap:8px;color:var(--ink-soft);border-left:3px solid transparent}
.deck-btn:hover{background:var(--surface-2);color:var(--ink)}
.deck-btn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.deck-btn .ct{font-family:var(--mono);font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.deck-btn[aria-current="true"]{background:var(--ink);color:var(--accent-ink);border-left-color:var(--bad)}
.deck-btn[aria-current="true"] .ct{color:var(--accent-ink);opacity:.65}
.rail-foot{border-top:1px solid var(--rule);padding:12px 18px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-faint);width:100%;text-align:left}
.rail-foot:hover{background:var(--surface-2);color:var(--ink-soft)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--good);flex:none}
.dot.off{background:var(--ink-faint)}
.dot.edit{background:var(--bad)}

.stage{padding:30px 34px 60px;max-width:1060px;width:100%}
.stage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.stage-head h2{font-family:var(--read);font-size:31px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.sub{color:var(--ink-soft);font-size:13px;margin-top:5px}

/* ---- buttons: bordered, square, no glow ---- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--rule);background:var(--surface);font-weight:500;font-size:14px;transition:border-color .1s,background .1s,color .1s}
.btn:hover{border-color:var(--ink);background:var(--surface-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--accent-ink)}
.btn.primary:hover{background:var(--ink-soft);border-color:var(--ink-soft)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-soft)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--rule);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--rule);background:var(--surface)}
.btn.danger:hover{border-color:var(--bad);background:var(--bad-wash)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---- mode tiles ---- */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;margin:0 0 26px;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r-lg);overflow:hidden}
.mode{text-align:left;padding:17px 18px;background:var(--surface);display:flex;flex-direction:column;gap:6px;transition:background .1s;border:0;outline-offset:-3px;box-shadow:0 0 0 .5px var(--rule)}
.mode:hover:not(:disabled){background:var(--surface-2)}
.mode:disabled{opacity:.45}
.mode .mt{font-weight:600;font-size:15px;display:flex;align-items:center;gap:9px;letter-spacing:-.01em}
.mode .md{font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.mode svg{flex:none;color:var(--bad)}

/* ---- deck summary: a ruled slip, not a stat dashboard ---- */
.summary{display:flex;gap:0;align-items:stretch;border:1px solid var(--rule);background:var(--surface);margin-bottom:22px;flex-wrap:wrap;border-radius:var(--r-lg);overflow:hidden}
.stat{display:flex;flex-direction:column;gap:2px;padding:13px 20px;flex:1;min-width:104px}
.stat + .stat{border-left:1px solid var(--rule-soft)}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat .l{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.stat .v.brass{color:var(--brass)}
.stat .v.bad{color:var(--bad)}
.summary .note{padding:13px 20px;font-size:11.5px;color:var(--ink-faint);max-width:27ch;line-height:1.45;display:flex;align-items:center}

/* ---- options bar ---- */
.opts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{padding:6px 12px;font-size:13px;color:var(--ink-soft);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--accent-ink);font-weight:500}

/* ---- the card: ruled index stock ---- */
.deskrow{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
.counter{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.track{height:4px;background:var(--rule-soft);overflow:hidden;border-radius:99px;margin-bottom:22px}
.track>i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .25s ease}
.cardwrap{perspective:1600px;margin-bottom:18px}
.card{position:relative;min-height:340px;transform-style:preserve-3d;transition:transform .4s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.card.flipped{transform:rotateX(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-lg);box-shadow:var(--lift);padding:56px 46px 46px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:auto;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,var(--rule-soft) 33px,var(--rule-soft) 34px);
  background-position:0 40px}
.face::before{content:"";position:absolute;left:0;right:0;top:38px;height:1px;background:var(--bad);opacity:.5}
.face.back{transform:rotateX(180deg)}
.face .role{position:absolute;top:12px;left:22px;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.face .star{position:absolute;top:9px;right:16px;padding:6px;border-radius:var(--r);color:var(--ink-faint);line-height:0}
.face .star[aria-pressed="true"]{color:var(--brass)}
.face .star:hover{background:var(--surface-2)}
.facetext{font-family:var(--read);font-size:29px;line-height:1.36;max-width:33ch;letter-spacing:-.015em}
.face.back .facetext{font-size:21px;max-width:46ch;line-height:1.55}
.hintline{position:absolute;bottom:15px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--ink-faint)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}

.rowctl{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.judge{display:flex;gap:10px;justify-content:center;margin-top:4px}
.judge .btn{min-width:150px;justify-content:center}
.judge .know{border-color:var(--good);color:var(--good)}
.judge .know:hover{background:var(--good-wash);border-color:var(--good)}
.judge .again{border-color:var(--brass);color:var(--brass)}
.judge .again:hover{background:var(--brass-wash);border-color:var(--brass)}

/* ---- quiz ---- */
.prompt{background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-lg);box-shadow:var(--lift);padding:34px 32px;margin-bottom:18px;text-align:center}
.prompt .role{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:14px}
.prompt .q{font-family:var(--read);font-size:26px;line-height:1.35;max-width:40ch;margin:0 auto;letter-spacing:-.015em}
.choices{display:grid;gap:0;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.choice{display:flex;gap:13px;align-items:flex-start;text-align:left;padding:13px 15px;border:0;border-bottom:1px solid var(--rule);background:var(--surface);font-family:var(--read);font-size:17px;line-height:1.45;transition:background .1s}
.choice:last-child{border-bottom:0}
.choice:hover:not(:disabled){background:var(--surface-2)}
.choice .key{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink-faint);border:1px solid var(--rule);border-radius:var(--r);width:20px;height:20px;display:grid;place-items:center;flex:none;margin-top:4px}
.choice.right{background:var(--good-wash);color:var(--good)}
.choice.right .key{border-color:var(--good);color:var(--good)}
.choice.wrong{background:var(--bad-wash);color:var(--bad)}
.choice.wrong .key{border-color:var(--bad);color:var(--bad)}
.choice:disabled{cursor:default}
.verdict{margin-top:16px;padding:12px 15px;border-radius:var(--r);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid currentColor}
.verdict.ok{background:var(--good-wash);color:var(--good)}
.verdict.no{background:var(--bad-wash);color:var(--bad)}
.verdict.near{background:var(--brass-wash);color:var(--brass)}
.verdict b{font-family:var(--read);font-weight:600}
.verdict .btn:not(.primary){color:var(--ink)}

/* ---- write mode ---- */
.answer{width:100%;padding:14px 16px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);font-family:var(--read);font-size:20px}
.answer:focus{border-color:var(--ink);outline:none;box-shadow:var(--lift)}

/* ---- match ---- */
.matchgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tile{min-height:104px;padding:14px;border:1px solid var(--rule);border-radius:var(--r-lg);background:var(--surface);display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;line-height:1.4;transition:background .1s,border-color .1s,opacity .25s}
.tile.term{font-family:var(--ui);font-weight:600;border-left:3px solid var(--ink)}
.tile.def{font-family:var(--read);font-size:15px}
.tile:hover:not(:disabled):not(.done){border-color:var(--ink);background:var(--surface-2)}
.tile.sel{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.tile.done{opacity:.18;pointer-events:none;border-style:dashed}
.tile.miss{border-color:var(--bad);background:var(--bad-wash);color:var(--bad);animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.tile.miss{animation:none}}

/* ---- results ---- */
.result{background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-lg);box-shadow:var(--lift);padding:34px 30px;text-align:center;margin-bottom:18px}
.result .score{font-family:var(--mono);font-size:56px;font-weight:500;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1.05}
.missed{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;text-align:left;border:1px solid var(--rule);overflow:hidden;border-radius:var(--r)}
.missed li{display:grid;grid-template-columns:minmax(120px,1fr) 1.4fr;gap:16px;padding:11px 14px;background:var(--surface);border-bottom:1px solid var(--rule-soft);font-size:14px}
.missed li:last-child{border-bottom:none}
.missed .t{font-weight:600}
.missed .d{font-family:var(--read);font-size:15px;color:var(--ink-soft)}

/* ---- editor ---- */
.editbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.saveflag{font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.03em}
.rows{display:flex;flex-direction:column;border:1px solid var(--rule);overflow:hidden;background:var(--rule-soft);border-radius:var(--r-lg)}
.rowhead{display:grid;grid-template-columns:32px 1fr 1.5fr 32px;gap:10px;padding:8px 12px;background:var(--surface-2);font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);border-bottom:1px solid var(--rule)}
.row{display:grid;grid-template-columns:32px 1fr 1.5fr 32px;gap:10px;padding:8px 12px;background:var(--surface);align-items:start;border-bottom:1px solid var(--rule-soft)}
.row:last-child{border-bottom:0}
.row .n{font-family:var(--mono);font-size:11px;color:var(--ink-faint);padding-top:10px;font-variant-numeric:tabular-nums}
.row textarea{width:100%;border:1px solid transparent;border-radius:var(--r);background:transparent;padding:7px 8px;resize:vertical;min-height:38px;font-size:14px}
.row textarea.def{font-family:var(--read);font-size:16px}
.row textarea:hover{border-color:var(--rule)}
.row textarea:focus{border-color:var(--ink);outline:none;background:var(--surface-2)}
.row .del{color:var(--ink-faint);padding:8px;border-radius:var(--r);line-height:0}
.row .del:hover{color:var(--bad);background:var(--bad-wash)}

.panel{border:1px solid var(--rule);border-radius:var(--r-lg);background:var(--surface);padding:20px;margin-bottom:16px}
.panel h3{font-family:var(--read);font-size:19px;margin-bottom:5px;font-weight:600}
.panel p{margin:0 0 13px;font-size:13.5px;color:var(--ink-soft);line-height:1.55}
.paste{width:100%;min-height:132px;border:1px solid var(--rule);border-radius:var(--r);padding:11px 12px;background:var(--surface-2);font-family:var(--mono);font-size:12.5px;line-height:1.65;resize:vertical}
.paste:focus{border-color:var(--ink);outline:none}
select{border:1px solid var(--rule);border-radius:var(--r);padding:7px 10px;background:var(--surface);font-size:13.5px}
input.text{border:1px solid var(--rule);border-radius:var(--r);padding:8px 11px;background:var(--surface);font-size:14px}
input.text:focus{border-color:var(--ink);outline:none}

.empty{border:1px dashed var(--rule);border-radius:var(--r-lg);padding:50px 30px;text-align:center;color:var(--ink-soft);background:var(--surface)}
.empty h3{font-family:var(--read);font-size:22px;margin-bottom:7px;color:var(--ink)}
.empty p{margin:0 auto 18px;max-width:46ch;font-size:14px}

.notice{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:var(--r);background:var(--surface);color:var(--ink-soft);font-size:13px;margin-bottom:18px;border:1px solid var(--rule);border-left:3px solid var(--brass)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--accent-ink);padding:10px 18px;border-radius:var(--r);font-size:13.5px;box-shadow:3px 3px 0 var(--rule);z-index:50}

/* ---- sign-in / publishing ---- */
.signin{max-width:460px;margin:0 auto}
.signin .panel{padding:24px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.field input{width:100%}
.err{font-size:13px;color:var(--bad);margin:0 0 10px;border-left:3px solid var(--bad);padding-left:10px}
.hr{display:flex;align-items:center;gap:14px;margin:24px 0;color:var(--ink-faint);font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.hr::before,.hr::after{content:"";flex:1;height:1px;background:var(--rule)}
.pubbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 15px;border:1px solid var(--brass);border-left:3px solid var(--brass);background:var(--brass-wash);border-radius:var(--r);margin-bottom:16px;font-size:13px;color:var(--brass)}
.pubbar b{font-weight:600}
.pubbar .btn:not(.primary){color:var(--ink)}
.pubbar.busy{border-color:var(--rule);border-left-color:var(--ink-faint);background:var(--surface-2);color:var(--ink-soft)}
.pubbar.fail{border-color:var(--bad);border-left-color:var(--bad);background:var(--bad-wash);color:var(--bad)}
.pubbar code{font-family:var(--mono);font-size:12px}
.steps{margin:0 0 15px;padding-left:20px;font-size:13.5px;color:var(--ink-soft);line-height:1.7}
.steps li{margin-bottom:5px}
.steps code{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--rule-soft);border-radius:var(--r);padding:1px 5px}

/* ---- folders: drawer dividers in the rail ---- */
#newdeckslot{display:flex;gap:2px}
.fgroup{list-style:none}
.folder{display:flex;align-items:stretch;border-radius:var(--r)}
.folder:hover{background:var(--surface-2)}
.folder.on{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--bad)}
.fold-tog{width:24px;display:grid;place-items:center;color:var(--ink-faint);flex:none}
.fold-tog:hover{color:var(--ink)}
.fold-tog svg{transition:transform .15s}
.fold-tog[aria-expanded="true"] svg{transform:rotate(90deg)}
.fold-nm{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:9px 10px 9px 0;text-align:left;font-weight:600;color:var(--ink)}
.fold-nm svg{color:var(--ink-soft);flex:none}
.fold-nm .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold-nm .ct{font-family:var(--mono);font-size:11px;color:var(--ink-faint);font-weight:400}
.fdecks{list-style:none;margin:1px 0 5px 16px;padding:0 0 0 5px;border-left:1px solid var(--rule);display:flex;flex-direction:column;gap:1px}
.fdecks .deck-btn{padding:7px 9px;font-size:14px}
.fdecks .fdecks{margin-left:12px}
.fdecks .fold-nm{font-weight:500;font-size:14px;padding-top:7px;padding-bottom:7px}
.frow-f{display:flex;gap:11px;align-items:flex-start;min-width:0}
.frow-f svg{color:var(--ink-soft);margin-top:4px;flex:none}
.fempty{padding:6px 9px;font-size:12.5px;color:var(--ink-faint);font-style:italic}
.loose{padding:12px 10px 4px}
.crumb{color:var(--ink-soft);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.crumb:hover{color:var(--ink);text-decoration-color:var(--ink)}
.flist{border:1px solid var(--rule);background:var(--surface);margin-bottom:18px;border-radius:var(--r-lg);overflow:hidden}
.frow{width:100%;display:grid;grid-template-columns:1fr 150px 70px;gap:20px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--rule-soft);text-align:left}
.frow:last-child{border-bottom:0}
.frow:hover{background:var(--surface-2)}
.frow .t{font-family:var(--read);font-size:19px;font-weight:600;letter-spacing:-.01em;display:block;line-height:1.25}
.frow .s{font-size:12.5px;color:var(--ink-soft);display:block;margin-top:2px}
.frow .ct{font-family:var(--mono);font-size:12px;color:var(--ink-soft);text-align:right}
.fpick{display:inline-flex;align-items:center;gap:7px;color:var(--ink-soft);font-size:13px}
.deskdesc{font-family:var(--read);font-size:17px;line-height:1.45;color:var(--ink-soft);margin-top:6px;max-width:62ch}
.descin{display:block;width:100%;max-width:560px;margin-top:8px;font-family:var(--read);font-size:16px}
.fpick select{font-size:13px;padding:5px 8px}
.editmeta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px}
.foldfoot{display:flex;justify-content:flex-end}

/* ---- learn: the three piles, drawn like a ledger ---- */
.learn{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:20px 22px;border:1px solid var(--ink);background:var(--surface);box-shadow:var(--lift);margin-bottom:18px;border-radius:var(--r-lg)}
.learn h3{font-family:var(--read);font-size:23px;font-weight:600;display:flex;align-items:center;gap:9px;margin-bottom:4px;letter-spacing:-.015em}
.learn h3 svg{color:var(--bad)}
.learn p{margin:0 0 14px;font-size:13.5px;color:var(--ink-soft);max-width:62ch;line-height:1.55}
.learn > .btn{padding:11px 24px;font-size:15px}
.lbar{display:flex;height:9px;border:1px solid var(--ink);background:var(--surface);border-radius:99px;overflow:hidden}
.lbar i{display:block;height:100%;transition:width .3s ease}
.lbar .lm-m,.sw.m{background:var(--ink)}
.lbar .lm-l,.sw.l{background:repeating-linear-gradient(135deg,var(--brass) 0 2px,transparent 2px 5px)}
.sw.f{background:var(--surface)}
.llegend{display:flex;gap:18px;flex-wrap:wrap;margin-top:7px;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.sw{display:inline-block;width:10px;height:10px;border:1px solid var(--ink);margin-right:6px;vertical-align:-1px}
.lmeter{margin-bottom:18px}
.result .lmeter{max-width:440px;margin:4px auto 0}
.result .llegend{justify-content:center}
.minibar{display:flex;height:7px;border:1px solid var(--rule);background:var(--surface);border-radius:99px;overflow:hidden}
.minibar i{display:block;height:100%}
.kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--rule);padding:2px 7px}
.linkbtn{font-size:13px;color:var(--ink-soft);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px;padding:6px 2px}
.linkbtn:hover{color:var(--ink);text-decoration-color:var(--ink)}
.missed.lround li{grid-template-columns:minmax(120px,1fr) 1.4fr 92px}
.st{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;text-align:right;white-space:nowrap}
.st.m{color:var(--good)}
.st.l{color:var(--brass)}
.st.f{color:var(--bad)}

/* ---- vocab + conjugation decks ---- */
.rows.vocab .rowhead,.rows.vocab .row{grid-template-columns:32px 1fr 130px 1.5fr 32px}
.row select.pos{border:1px solid transparent;border-radius:var(--r);background:transparent;padding:7px 6px;font-size:13px;width:100%;color:var(--ink-soft)}
.row select.pos:hover{border-color:var(--rule)}
.row select.pos:focus{border-color:var(--ink);outline:none;background:var(--surface-2)}
.postag{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--rule);padding:2px 7px;white-space:nowrap}
.prompt .postag{display:inline-block;margin-bottom:12px}
.kindbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.conjhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.conjhead .tensein{width:190px}
.persons{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.persons input{width:124px;font-size:13px;padding:5px 8px}
.pdel{color:var(--ink-faint);padding:5px;border-radius:var(--r);line-height:0}
.pdel:hover{color:var(--bad);background:var(--bad-wash)}
.conjcard{border:1px solid var(--rule);background:var(--surface);margin-bottom:-1px;border-radius:var(--r);overflow:hidden}
.conjcard .ch{display:grid;grid-template-columns:32px 1fr 1fr 32px;gap:10px;padding:9px 12px;align-items:center;border-bottom:1px solid var(--rule-soft);background:var(--surface-2)}
.conjcard .ch .n{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.conjcard .ch input{width:100%}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(192px,1fr));gap:0}
.cell{display:flex;align-items:center;gap:9px;padding:8px 12px;border-right:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft)}
.cell label{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);width:84px;flex:none;overflow:hidden;text-overflow:ellipsis}
.cell input{flex:1;min-width:0;font-family:var(--read);font-size:15px}
.ctable{border:1px solid var(--ink);background:var(--surface);box-shadow:var(--lift);margin-bottom:16px;border-radius:var(--r-lg);overflow:hidden}
.ctable .cth{padding:18px 20px 14px;border-bottom:1px solid var(--rule)}
.ctable .cth h3{font-family:var(--read);font-size:27px;font-weight:600;letter-spacing:-.02em}
.ctable .cth .m{font-size:13.5px;color:var(--ink-soft);margin-top:3px}
.crow{display:grid;grid-template-columns:150px 1fr;gap:0;border-bottom:1px solid var(--rule-soft);align-items:stretch}
.crow:last-child{border-bottom:0}
.crow .pl{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);padding:13px 14px;background:var(--surface-2);border-right:1px solid var(--rule-soft);display:flex;align-items:center}
.crow .pv{padding:7px 10px;display:flex;align-items:center;gap:10px;min-width:0}
.crow input{width:100%;max-width:300px;font-family:var(--read);font-size:17px;padding:7px 10px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface)}
.crow input:focus{border-color:var(--ink);outline:none}
.crow.ok{background:var(--good-wash)}
.crow.no{background:var(--bad-wash)}
.crow .mark{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.crow.ok .mark{color:var(--good)}
.crow.no .mark{color:var(--bad)}
.crow .right{font-family:var(--read);font-size:16px;color:var(--bad)}
.crow .given{font-family:var(--read);font-size:17px;padding:7px 0}

/* ---- sidebar controls ---- */
.railbar{display:flex;align-items:center;gap:4px}
.icbtn{width:26px;height:26px;display:grid;place-items:center;border-radius:var(--r);color:var(--ink-faint);flex:none}
.icbtn:hover{background:var(--surface-2);color:var(--ink)}
.app.shut{grid-template-columns:0 1fr}
.app.shut .rail{display:none}
.reopen{position:fixed;left:0;top:14px;z-index:40;display:none;align-items:center;gap:7px;padding:9px 13px 9px 11px;
  border:1px solid var(--rule);border-left:0;border-radius:0 var(--r-lg) var(--r-lg) 0;background:var(--surface);box-shadow:var(--lift);font-size:13px;font-weight:500}
.reopen:hover{background:var(--surface-2)}
.app.shut + .reopen{display:inline-flex}

/* ---- what's coming up ---- */
.soon{border-top:1px solid var(--rule);padding:11px 14px 12px}
.soon .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.soon ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.soon button{width:100%;display:flex;align-items:baseline;gap:8px;padding:5px 7px;border-radius:var(--r);text-align:left;color:var(--ink-soft)}
.soon button:hover{background:var(--surface-2);color:var(--ink)}
.soon .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.soon .when{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;white-space:nowrap}
.when.today{color:var(--bad);font-weight:600}
.when.soon{color:var(--brass)}
.when.past{color:var(--ink-faint)}
.soon .none{font-size:12px;color:var(--ink-faint);padding:2px 7px 0;font-style:italic}

/* ---- calendar ---- */
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden;background:var(--rule-soft);gap:1px}
.caldow{background:var(--surface-2);padding:8px 10px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);text-align:center}
.calday{background:var(--surface);min-height:96px;padding:7px 8px;display:flex;flex-direction:column;gap:4px}
.calday.off{background:var(--surface-2);opacity:.5}
.calday.now{box-shadow:inset 0 0 0 2px var(--bad)}
.calday .dn{font-family:var(--mono);font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.calday.now .dn{color:var(--bad);font-weight:600}
.calpill{display:block;width:100%;text-align:left;font-size:11.5px;line-height:1.3;padding:4px 6px;border-radius:var(--r);background:var(--accent-wash);color:var(--ink);border-left:3px solid var(--bad);overflow:hidden;text-overflow:ellipsis}
.calpill:hover{background:var(--surface-2)}
.calpill.done{opacity:.45;border-left-color:var(--ink-faint)}
.callist{margin-top:20px}
.quizfield{display:inline-flex;align-items:center;gap:7px;color:var(--ink-soft);font-size:13px}
.quizfield input{font-size:13px;padding:5px 8px;width:150px}
.duetag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--rule);border-radius:99px;padding:3px 10px}
.duetag.today{border-color:var(--bad);color:var(--bad)}
.duetag.soon{border-color:var(--brass);color:var(--brass)}
.duetag.past{color:var(--ink-faint)}

/* ---- print sheet ---- */
.sheet{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);padding:28px 30px}
.sheet h3{font-family:var(--read);font-size:24px;margin-bottom:3px}
.sheet .meta{font-size:13px;color:var(--ink-soft);margin-bottom:18px}
.sheet section{margin-bottom:22px;break-inside:auto}
.sheet section > h4{font-family:var(--read);font-size:17px;font-weight:600;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:grid;grid-template-columns:minmax(130px,1fr) 2fr;gap:18px;padding:5px 0;border-bottom:1px solid var(--rule-soft);font-size:14px;break-inside:avoid}
.plist .t{font-weight:600}
.plist .d{font-family:var(--read);font-size:15px;color:var(--ink-soft)}
.plist .pos{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--ink-faint)}
@media print{
  .rail,.reopen,.stage-head .rowctl,.opts,.toast,.pubbar,.editbar{display:none!important}
  .app{display:block}
  .stage{padding:0;max-width:none}
  .sheet{border:0;padding:0;border-radius:0;background:#fff;color:#000}
  .stage-head{border-bottom:2px solid #000;margin-bottom:14px}
  .plist li{border-bottom:1px solid #ccc}
  body{background:#fff}
  a[href]:after{content:""}
}

/* ---- simulated test ---- */
.setup{display:grid;gap:0;border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden;margin-bottom:18px;background:var(--surface)}
.setup .srow{display:grid;grid-template-columns:168px 1fr;gap:18px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--rule-soft)}
.setup .srow:last-child{border-bottom:0}
.setup .sl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.setup .sv{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-soft);border:1px solid var(--rule);border-radius:99px;padding:6px 13px}
.chk:hover{border-color:var(--ink);color:var(--ink)}
.chk input{margin:0}
.testbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.tclock{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;border:1px solid var(--rule);border-radius:99px;padding:5px 14px}
.tclock.low{border-color:var(--bad);color:var(--bad)}
.qnum{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.review{list-style:none;margin:18px 0 0;padding:0;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;text-align:left}
.review li{padding:11px 14px;border-bottom:1px solid var(--rule-soft);background:var(--surface);display:grid;grid-template-columns:22px 1fr;gap:12px;font-size:14px}
.review li:last-child{border-bottom:0}
.review .mk{font-family:var(--mono);font-size:12px}
.review li.ok .mk{color:var(--good)}
.review li.no .mk{color:var(--bad)}
.review .q{font-weight:600;margin-bottom:3px}
.review .a{font-family:var(--read);font-size:15px;color:var(--ink-soft)}
.review .a b{color:var(--bad);font-weight:600}

/* ---- accounts ---- */
.acct{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-wash);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--ink);flex:none;border:1px solid var(--rule)}
.gbtn{display:inline-flex;align-items:center;gap:9px;padding:10px 18px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);font-weight:500;font-size:14.5px}
.gbtn:hover{border-color:var(--ink);background:var(--surface-2)}
.gbtn svg{flex:none}
.cloud{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--ink-faint)}
.sublist{border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.subrow{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--rule-soft)}
.subrow:last-child{border-bottom:0}
.subrow .t{font-family:var(--read);font-size:18px;font-weight:600}
.subrow .m{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.subrow .note{font-family:var(--read);font-size:14px;color:var(--ink-soft);margin-top:5px;padding-left:10px;border-left:2px solid var(--rule)}
.stat-pill{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--rule);border-radius:99px;padding:2px 9px;color:var(--ink-soft)}
.stat-pill.approved{border-color:var(--good);color:var(--good)}
.stat-pill.declined{border-color:var(--bad);color:var(--bad)}

.railtoggle{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:none;border-bottom:2px solid var(--ink)}
  .rail[hidden]{display:none}
  .decks{max-height:260px}
  .railtoggle{display:inline-flex}
  .stage{padding:22px 18px 50px}
  .stage-head h2{font-size:25px}
  .facetext{font-size:23px}
  .face{padding:52px 24px 42px}
  .row,.rowhead{grid-template-columns:24px 1fr 32px}
  .row .def-cell{grid-column:2/4}
  .rowhead .h-def{display:none}
  .missed li{grid-template-columns:1fr}
  .stat{min-width:50%;flex:none}
  .summary .note{display:none}
  .frow{grid-template-columns:1fr 60px}
  .frow .minibar{display:none}
  .learn{grid-template-columns:1fr}
  .missed.lround li{grid-template-columns:1fr}
  .st{text-align:left}
  .rows.vocab .rowhead,.rows.vocab .row{grid-template-columns:24px 1fr 32px}
  .rows.vocab .row select.pos{grid-column:2/4;width:auto}
  .conjcard .ch{grid-template-columns:24px 1fr 32px}
  .conjcard .ch input:nth-of-type(2){grid-column:2/4}
  .crow{grid-template-columns:104px 1fr}
  .crow .pl{padding:11px 10px}
  .setup .srow{grid-template-columns:1fr;gap:8px}
  .calgrid{grid-template-columns:repeat(7,1fr);font-size:11px}
  .calday{min-height:62px;padding:4px 3px}
  .calpill{font-size:10px;padding:2px 4px;border-left-width:2px}
  .caldow{padding:6px 2px;font-size:9px}
}
</style>

</head>
<body>

<div class="app">
  <aside class="rail" id="rail">
    <div class="brand"><h1>Quizlet<em>ish</em></h1><span class="tag">v2</span></div>
    <div class="rail-head"><span class="eyebrow">Decks</span><span class="railbar"><span id="newdeckslot"></span><span id="railctl"></span></span></div>
    <ul class="decks" id="decks"></ul>
    <div id="soonslot"></div>
    <button class="rail-foot" id="whobtn"><span class="dot off" id="syncdot"></span><span id="syncmsg">Loading…</span></button>
  </aside>
  <main class="stage" id="stage"></main>
</div>
<button class="reopen" id="reopen"><span aria-hidden="true">\u203a</span> Decks</button>

(function(){
"use strict";

/* ============================ tiny helpers ============================ */

    if(k === "class") n.className = attrs[k];
    else if(k === "html") n.innerHTML = attrs[k];
    else if(k === "text") n.textContent = attrs[k];
    else if(k.slice(0,2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  }
  if(kids) kids.forEach(function(c){ if(c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });

}

  s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("width", size||16); s.setAttribute("height", size||16);
  s.setAttribute("fill","none"); s.setAttribute("stroke","currentColor"); s.setAttribute("stroke-width","1.7");
  s.setAttribute("stroke-linecap","round"); s.setAttribute("stroke-linejoin","round");
  var p = document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d", d); s.appendChild(p); return s;
}
var I = {
  cards:"M4 7h11v11H4zM8 4h12v11",
  quiz:"M9 9a3 3 0 1 1 4 2.8c-.7.3-1 .9-1 1.6v.6M12 17.5h.01M4 4h16v16H4z",

  var prev = [], cur = [], i, j;
  for(j=0;j<=b.length;j++) prev[j] = j;
  for(i=1;i<=a.length;i++){
    cur[0] = i;
    for(j=1;j<=b.length;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }

  var best = "no";
  alts.forEach(function(t){
    if(!t) return;
    if(g === t){ best = "exact"; return; }
    if(best === "exact") return;
    var tol = Math.max(1, Math.floor(t.length / 8));
    if(lev(g, t) <= tol) best = "near";
  });
  return best;

               payload.decks.reduce(function(n,d){ return n + d.cards.length; }, 0) + " cards)",
      content: b64utf8(json),
      branch: GH_BRANCH
    };
    if(existing && existing.sha) body.sha = existing.sha;
    return ghFetch(GH_API, {method:"PUT", body: JSON.stringify(body)});
  }).then(function(res){
    if(!res.ok) throw new Error(ghError(res));
    return res.json();
  }).then(function(){
    S.busy = false;
    S.published = copy(currentStore());
    S.draft = false;
    try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
    var bar = $("pubbar"); if(bar) bar.hidden = true;
    var f = $("saveflag"); if(f) f.textContent = "Matches what's published";

  }).catch(function(err){
    S.busy = false;
    var msg = String(err && err.message || err);
    if(/expired or been revoked/.test(msg)) setToken(null);   // don't leave a dead token in place
    pubState("fail", el("span",{},[el("b",{text:"Didn't publish. "}), msg]), S.token ? "Try again" : "Set up publishing");
  });
}

/* ---------------- learn ----------------
   Quizlet-style adaptive rounds. Every card climbs two rungs:
     0 new       asked as multiple choice
     1 learning  asked as a typed answer
     2 mastered  retired from Learn
   A miss at either rung drops the card to 0 and requeues it once in the same round,
   so the right answer comes back while it's still fresh. Rungs are saved per answer,
   so walking away mid-round loses nothing but the round's order. */
var ROUND_SIZE = 7, learnTimer = null;

// A vocabulary word with a part of speech gets a third rung: define it, type it, then
// name what it is. Everything else keeps the original two.
function maxStage(d, c){ return (posAskable(d) && (c.pos || "").trim()) ? 3 : 2; }
function isMastered(d, c){ return lstage(d.id, c.id) >= maxStage(d, c); }
function learnCounts(d, cards){
  var k = {fresh:0, learning:0, mastered:0};
  cards.forEach(function(c){
    var st = lstage(d.id, c.id);
    if(st >= maxStage(d, c)) k.mastered++; else if(st > 0) k.learning++; else k.fresh++;
  });
  return k;
}
function posChoices(c, all){
  var right = cap(c.pos), used = {}, others = [];
  all.forEach(function(o){ var x = cap(o.pos); if(x && x !== right && !used[x]){ used[x] = true; others.push(x); } });
  return shuffled(shuffled(others).slice(0, 3).concat([right]));
}
// The distinct parts of speech a deck actually uses. Cached per edit, because asking
// it per card while counting a long deck would be quadratic.
var STORE_VER = 0;
function deckPos(d){
  if(d._posVer === STORE_VER && d._pos) return d._pos;
  var seen = {}, out = [];
  cardsOf(d).forEach(function(c){ var x = (c.pos || "").trim(); if(x && !seen[x]){ seen[x] = true; out.push(x); } });
  d._pos = out; d._posVer = STORE_VER;
  return out;
}
// With only one part of speech in the deck there is nothing to tell apart, so the
// question is dropped rather than shown as a single button.
function posAskable(d){ return kindOf(d) === "vocab" && deckPos(d).length >= 2; }
function learnMeter(d, cards){
  var k = learnCounts(d, cards), n = cards.length || 1;
  return el("div",{class:"lmeter"},[
    el("div",{class:"lbar","aria-hidden":"true"},[
      el("i",{class:"lm-m",style:"width:" + (k.mastered/n*100) + "%"}),
      el("i",{class:"lm-l",style:"width:" + (k.learning/n*100) + "%"})
    ]),
    el("div",{class:"llegend"},[
      el("span",{},[el("b",{class:"sw m"}), k.mastered + " mastered"]),
      el("span",{},[el("b",{class:"sw l"}), k.learning + " learning"]),
      el("span",{},[el("b",{class:"sw f"}), k.fresh + " new"])
    ])
  ]);
}
// Multiple choice needs at least one wrong option that reads differently from the answer.
function canChoose(cards){
  var seen = {}, n = 0;
  cards.forEach(function(c){ var a = norm(ans(c)); if(a && !seen[a]){ seen[a] = true; n++; } });
  return n >= 2;
}
// The typed rung shows the definition and asks for the term, whichever way the deck is
// being drilled. Typing a whole definition back verbatim is a transcription test, and a
// definition carrying a part-of-speech line ("noun …") would fail a correct answer.
function typesTerm(c){ return !c.fixed && !!(c.term || "").trim() && !!(c.def || "").trim(); }
function lask(c, kind){ return kind === "pos" ? c.term : kind === "type" && typesTerm(c) ? c.def : ask(c); }
function lans(c, kind){ return kind === "pos" ? cap(c.pos) : kind === "type" && typesTerm(c) ? c.term : ans(c); }

function buildLearnRound(cards){
  var d = deck();
  var learning = cards.filter(function(c){ var st = lstage(d.id, c.id); return st > 0 && st < maxStage(d, c); });
  var fresh = cards.filter(function(c){ return lstage(d.id, c.id) === 0; });
  if(S.shuffle){ learning = shuffled(learning); fresh = shuffled(fresh); }
  // Carry half-learned cards forward, but keep room to introduce a couple of new ones.
  var take = Math.min(learning.length, ROUND_SIZE - Math.min(2, fresh.length));
  var pick = learning.slice(0, take);
  pick = pick.concat(fresh.slice(0, ROUND_SIZE - pick.length));
  pick = pick.concat(learning.slice(take, take + ROUND_SIZE - pick.length));
  if(S.shuffle) return shuffled(pick);
  return pick.sort(function(a,b){ return cards.indexOf(a) - cards.indexOf(b); });
}
function startLearn(){
  S.session = {mode:"learn", all:pool(), round:0};
  nextLearnRound();
  go("learn");
}
function nextLearnRound(){
  var s = S.session;
  s.round++; s.queue = buildLearnRound(s.all); s.i = 0;

function learnAnswer(c, ok, a){
  var s = S.session, d = deck();
  a.from = lstage(d.id, c.id);

  else {
    setStage(d.id, c.id, 0);
    if(!s.requeued[c.id]){ s.requeued[c.id] = true; s.queue.push(c); a.requeued = true; }
  }
  a.to = lstage(d.id, c.id);
  record(c.id, ok);
  s.answer = a;
  render();
  // A clean right answer moves on by itself; anything worth reading waits for you.

  }

/* ---------------- simulated test ----------------
   Built out of the question types the app already grades: multiple choice, typing, and
   on a vocabulary deck the part of speech. Scope can be one deck or a whole folder, so
   it works as a real end-of-unit run-through rather than a single deck drill. */
var testTimer = null;
function testUnits(scope){
  var decks = scope.folder ? decksUnder(scope.folder) : (deck() ? [deck()] : []);
  var out = [];
  decks.forEach(function(d){
    unitsOf(d).forEach(function(u){ out.push({u:u, d:d}); });
  });
  return out;
}
function buildTest(scope, opts){
  var pool = shuffled(testUnits(scope)), qs = [];
  pool.forEach(function(it){
    if(qs.length >= opts.count) return;
    var kinds = [];
    if(opts.choice) kinds.push("choice");
    if(opts.type) kinds.push("type");
    if(opts.pos && kindOf(it.d) === "vocab" && (it.u.pos || "").trim() && posAskable(it.d)) kinds.push("pos");
    if(!kinds.length) return;
    var kind = kinds[Math.floor(Math.random() * kinds.length)];
    var all = unitsOf(it.d);
    if(kind === "choice" && !canChoose(all)) kind = opts.type ? "type" : null;
    if(!kind) return;
    qs.push({
      id: it.u.id, deck: it.d, unit: it.u, kind: kind,
      ask: lask(it.u, kind === "pos" ? "pos" : kind === "type" ? "type" : "choice"),
      right: lans(it.u, kind === "pos" ? "pos" : kind === "type" ? "type" : "choice"),
      choices: kind === "choice" ? buildChoices(it.u, all) : kind === "pos" ? posChoices(it.u, all) : null,
      given: null, ok: null
    });
  });
  return qs;
}
function startTest(scope, opts){
  var qs = buildTest(scope, opts);
  if(!qs.length) return toast("Nothing to build a test from");
  S.session = {mode:"test", qs:qs, i:0, scope:scope, opts:opts, left: opts.minutes * 60, over:false};
  clearInterval(testTimer);
  if(opts.minutes){
    testTimer = setInterval(function(){
      var s = S.session;
      if(!s || s.mode !== "test" || s.over){ clearInterval(testTimer); return; }
      s.left--;
      var c = $("tclock");
      if(c){ c.textContent = clockText(s.left); c.className = "tclock" + (s.left <= 30 ? " low" : ""); }
      if(s.left <= 0){ clearInterval(testTimer); finishTest(true); }
    }, 1000);
  }
  go("test");
}
function clockText(sec){
  sec = Math.max(0, sec|0);
  return Math.floor(sec/60) + ":" + ("0" + (sec % 60)).slice(-2);
}
function renderTestSetup(){
  var d = deck();
  var opts = S.testOpts || (S.testOpts = {count:15, minutes:10, choice:true, type:true, pos:true});
  var scope = S.testScope || (S.testScope = {folder: null});
  var fold = d && d.folder ? folderById(d.folder) : null;
  var available = testUnits(scope).length;

  stage.appendChild(el("div",{class:"stage-head"},[
    el("div",{},[ el("h2",{text:"Simulated test"}),
      el("div",{class:"sub",text:"A timed run-through that mixes the question types, scored at the end."}) ]),
    el("button",{class:"btn ghost",onclick:function(){ go("home"); }},[icon(I.back,15),"Deck"])
  ]));

  function srow(label, kids){ return el("div",{class:"srow"},[ el("span",{class:"sl",text:label}), el("span",{class:"sv"}, kids) ]); }
  function seg(values, cur, set, fmt){
    var box = el("div",{class:"seg"});
    values.forEach(function(v){
      box.appendChild(el("button",{"aria-pressed": v === cur ? "true" : "false", text: fmt ? fmt(v) : String(v),
        onclick:function(){ set(v); render(); }}));
    });
    return box;
  }
  function check(label, on, set){
    var cb = el("input",{type:"checkbox"});
    cb.checked = !!on;
    cb.addEventListener("change", function(){ set(cb.checked); render(); });
    return el("label",{class:"chk"},[cb, label]);
  }

  var box = el("div",{class:"setup"});
  if(fold) box.appendChild(srow("Covering", [ seg([null, fold.id], scope.folder,
      function(v){ S.testScope = {folder: v}; }, function(v){ return v ? "All of " + (fold.name || "the folder") : (d.name || "This deck"); }) ]));
  box.appendChild(srow("Questions", [ seg([10, 15, 20, 30, 50], opts.count, function(v){ opts.count = v; }),
    el("span",{class:"saveflag",text: available + " available"}) ]));
  box.appendChild(srow("Time limit", [ seg([0, 5, 10, 20, 30], opts.minutes, function(v){ opts.minutes = v; },
    function(v){ return v ? v + " min" : "None"; }) ]));
  box.appendChild(srow("Question types", [
    check("Multiple choice", opts.choice, function(v){ opts.choice = v; }),
    check("Type the answer", opts.type, function(v){ opts.type = v; }),
    check("Part of speech", opts.pos, function(v){ opts.pos = v; })
  ]));
  stage.appendChild(box);

  var none = !opts.choice && !opts.type && !opts.pos;
  stage.appendChild(el("div",{class:"rowctl",style:"justify-content:flex-start"},[
    el("button",{class:"btn primary",disabled: (none || !available) ? "disabled" : null,
      onclick:function(){ startTest(S.testScope, opts); }},[icon(I.test,15),"Start the test"]),
    none ? el("span",{class:"saveflag",text:"Pick at least one question type."}) : null,
    !available ? el("span",{class:"saveflag",text:"Nothing to test on yet."}) : null
  ]));
}
function renderTest(){
  var s = S.session; if(!s || s.mode !== "test") return go("home");
  if(s.over) return renderTestDone(s);
  var q = s.qs[s.i];
  stage.appendChild(modeHead("Simulated test"));
  stage.appendChild(el("div",{class:"testbar"},[
    el("span",{class:"qnum",text:"Question " + (s.i+1) + " of " + s.qs.length}),
    el("span",{class:"rowctl"},[
      s.opts.minutes ? el("span",{class:"tclock" + (s.left <= 30 ? " low" : ""),id:"tclock",text:clockText(s.left)}) : null,
      el("button",{class:"btn ghost sm",onclick:function(){ if(confirm("Hand the test in now? Anything unanswered is marked wrong.")) finishTest(false); }},["Hand in"])
    ])
  ]));
  var tr = el("div",{class:"track"}); tr.appendChild(el("i",{style:"width:" + (s.i/s.qs.length*100) + "%"})); stage.appendChild(tr);
  stage.appendChild(el("div",{class:"prompt"},[
    el("div",{class:"role",text: q.kind === "pos" ? "What part of speech?" : q.unit.fixed ? "Which form?" : q.kind === "type" && typesTerm(q.unit) ? "Definition" : ASK_LABEL()}),
    el("div",{class:"q",text:q.ask || "—"}),
    s.scope.folder ? el("div",{style:"font-size:12px;color:var(--ink-faint);margin-top:10px",text:q.deck.name || ""}) : null
  ]));

  if(q.kind === "type"){
    var inp = el("input",{class:"answer",type:"text",value:q.given || "",placeholder:"Type your answer…","aria-label":"Your answer",autocomplete:"off",autocapitalize:"off",spellcheck:"false"});
    inp.addEventListener("input", function(ev){ q.given = ev.target.value; });
    inp.addEventListener("keydown", function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); nextTestQ(1); } });
    stage.appendChild(inp);
    setTimeout(function(){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }, 0);
  } else {
    var wrap = el("div",{class:"choices"});
    q.choices.forEach(function(opt, idx){
      wrap.appendChild(el("button",{class:"choice" + (q.given === opt ? " right" : ""),
        onclick:function(){ q.given = opt; render(); setTimeout(function(){ nextTestQ(1); }, 160); }},[
        el("span",{class:"key",text:String(idx+1)}), el("span",{text:opt})
      ]));
    });
    stage.appendChild(wrap);
  }

  stage.appendChild(el("div",{class:"rowctl",style:"margin-top:16px;justify-content:space-between"},[
    el("button",{class:"btn ghost",disabled: s.i ? null : "disabled",onclick:function(){ nextTestQ(-1); }},[icon(I.back,15),"Back"]),
    el("span",{class:"saveflag",text: s.qs.filter(function(x){ return x.given !== null && x.given !== ""; }).length + " of " + s.qs.length + " answered"}),
    el("button",{class:"btn primary",onclick:function(){ nextTestQ(1); }},[ s.i + 1 >= s.qs.length ? "Finish" : "Next", icon(I.chev,14)])
  ]));
}
function nextTestQ(step){
  var s = S.session; if(!s || s.mode !== "test") return;
  if(step > 0 && s.i + 1 >= s.qs.length) return finishTest(false);
  s.i = Math.max(0, Math.min(s.qs.length - 1, s.i + step));

function finishTest(ranOut){

function renderTestDone(s){

    el("div",{class:"rowctl"},[

    ])

        ])
      ])

  body.appendChild(ul);

  var byDay = {};

  for(var i = 0; i < 42; i++){

    stage.appendChild(listEl);

function renderTable(){

/* ---------------- multiple choice ---------------- */
function buildChoices(c, all){
  var right = ans(c);
  var others = [];
  all.forEach(function(o){
    if(o.id === c.id) return;
    var a = ans(o);
    if(a && norm(a) !== norm(right) && others.indexOf(a) === -1) others.push(a);
  });
  var picks = shuffled(others).slice(0, 3);
  return shuffled(picks.concat([right]));
}
function renderQuiz(){
  var s = S.session; if(!s) return go("home");
  if(s.i >= s.cards.length) return renderScore("Multiple choice", s);
  var c = s.cards[s.i];

  if(!s.choices || s.choicesFor !== c.id){ s.choices = buildChoices(c, allCards); s.choicesFor = c.id; }
  stage.appendChild(modeHead("Multiple choice"));
  stage.appendChild(el("div",{class:"deskrow"},[
    el("span",{class:"counter",text:(s.i+1) + " / " + s.cards.length}),

  ]));

  ]));

  var right = ans(c);
  var wrap = el("div",{class:"choices"});
  s.choices.forEach(function(opt, idx){

    if(s.picked !== null){

      el("span",{class:"key",text:String(idx+1)}),

    ]));

  if(s.picked !== null){

    stage.appendChild(el("div",{class:"verdict " + (wasRight ? "ok" : "no")},[
      el("span",{},[ wasRight ? "Correct." : "Not quite — the answer is ", wasRight ? null : el("b",{text:right}) ]),

/* ---------------- matching ---------------- */
var matchTimer = null;
function startMatch(order){
  var picked = order.slice(0, Math.min(6, order.length));
  var tiles = [];
  picked.forEach(function(c){
    tiles.push({id:c.id, kind:"term", text:c.term || "—"});
    tiles.push({id:c.id, kind:"def", text:c.def || "—"});
  });
  S.session = {mode:"match", pairs:picked.length, tiles:shuffled(tiles), sel:null, done:{}, miss:null, start:Date.now(), elapsed:0, over:false, errors:0};
  clearInterval(matchTimer);
  matchTimer = setInterval(function(){
    var s = S.session;
    if(!s || s.mode !== "match" || s.over){ clearInterval(matchTimer); return; }
    s.elapsed = (Date.now() - s.start)/1000;
    var t = $("mtimer"); if(t) t.textContent = s.elapsed.toFixed(1) + "s";
  }, 100);
}
function renderMatch(){
  var s = S.session; if(!s || s.mode !== "match") return go("home");
  var d = deck(), best = (S.bests[d.id] || {})[s.pairs];
  stage.appendChild(modeHead("Matching"));
  if(s.over){
    clearInterval(matchTimer);
    var isBest = !best || s.elapsed < best;
    if(isBest){ (S.bests[d.id] = S.bests[d.id] || {})[s.pairs] = s.elapsed; saveLocal(); }
    stage.appendChild(el("div",{class:"result"},[
      el("div",{class:"eyebrow",text: isBest ? "New best time" : "Cleared"}),
      el("div",{class:"score",text:s.elapsed.toFixed(1) + "s"}),
      el("p",{style:"margin:2px 0 20px;color:var(--ink-soft);font-size:14px",text: s.pairs + " pairs · " + s.errors + (s.errors === 1 ? " wrong pairing" : " wrong pairings") + (best && !isBest ? " · best " + best.toFixed(1) + "s" : "")}),
      el("div",{class:"rowctl"},[
        el("button",{class:"btn primary",onclick:function(){ startMode("match"); }},["Play again"]),
        el("button",{class:"btn ghost",onclick:function(){ S.session=null; go("home"); }},["Back to deck"])
      ])
    ]));
    return;
  }
  var left = s.pairs - Object.keys(s.done).length;
  stage.appendChild(el("div",{class:"deskrow"},[
    el("span",{class:"counter",id:"mtimer",text:s.elapsed.toFixed(1) + "s"}),
    el("span",{class:"counter",text:left + " " + (left === 1 ? "pair" : "pairs") + " left" + (best ? " · best " + best.toFixed(1) + "s" : "")})
  ]));
  var grid = el("div",{class:"matchgrid"});
  s.tiles.forEach(function(t, idx){
    var cls = "tile " + t.kind;
    if(s.done[t.id]) cls += " done";
    else if(s.sel === idx) cls += " sel";
    else if(s.miss === idx) cls += " miss";
    grid.appendChild(el("button",{class:cls, text:t.text, onclick:function(){ tapTile(idx); }}));
  });
  stage.appendChild(grid);
}
function tapTile(idx){
  var s = S.session, t = s.tiles[idx];
  if(s.done[t.id] || s.miss !== null) return;
  if(s.sel === null){ s.sel = idx; return render(); }
  if(s.sel === idx){ s.sel = null; return render(); }
  var a = s.tiles[s.sel];
  if(a.id === t.id && a.kind !== t.kind){
    s.done[t.id] = true; s.sel = null;
    record(t.id, true);
    if(Object.keys(s.done).length === s.pairs){ s.over = true; s.elapsed = (Date.now() - s.start)/1000; }
    return render();
  }
  s.errors++;
  record(t.id, false);
  s.miss = idx; render();
  setTimeout(function(){ if(S.session === s){ s.miss = null; s.sel = null; render(); } }, 420);
}

function sbLoad(){

/* ---- progress that follows the student between devices ----
   Merged field by field, taking the larger of each count and the higher Learn rung, so
   studying on a phone and then a laptop adds up instead of one overwriting the other. */
function mergeCard(a, b){
  a = a || {}; b = b || {};
  return {
    seen: Math.max(a.seen||0, b.seen||0), right: Math.max(a.right||0, b.right||0),
    wrong: Math.max(a.wrong||0, b.wrong||0), star: !!(a.star || b.star),
    last: (b.last || a.last) || null
  };
}
function pullProgress(){
  if(!sb || !S.user) return Promise.resolve();
  return sb.from("progress").select("deck_id,payload").then(function(r){
    if(r.error || !r.data) return;
    r.data.forEach(function(row){
      var pay = row.payload || {}, id = row.deck_id;
      var mine = S.progress[id] || (S.progress[id] = {});
      Object.keys(pay.progress || {}).forEach(function(cid){ mine[cid] = mergeCard(mine[cid], pay.progress[cid]); });
      var l = S.learn[id] || (S.learn[id] = {});
      Object.keys(pay.learn || {}).forEach(function(cid){ l[cid] = Math.max(l[cid] || 0, pay.learn[cid] || 0); });
      if(pay.bests){
        var bb = S.bests[id] || (S.bests[id] = {});
        Object.keys(pay.bests).forEach(function(k){ bb[k] = bb[k] ? Math.min(bb[k], pay.bests[k]) : pay.bests[k]; });
      }
      pendingDecks[id] = true;            // push the merged version straight back
    });
    saveLocal(); queueSync(); render();
  }).catch(function(){});
}
function queueSync(deckId){

function pushProgress(){
  if(!sb || !S.user) return;

  if(!ids.length) return;
  pendingDecks = {};
  var rows = ids.map(function(id){
    return {user_id: S.user.id, deck_id: id, updated_at: new Date().toISOString(),
      payload: {progress: S.progress[id] || {}, learn: S.learn[id] || {}, bests: S.bests[id] || {}}};
  });
  sb.from("progress").upsert(rows, {onConflict:"user_id,deck_id"}).then(function(r){
    if(r.error) ids.forEach(function(id){ pendingDecks[id] = true; });   // try again next time
  }).catch(function(){ ids.forEach(function(id){ pendingDecks[id] = true; }); });
}

      renderRail(); toast("Editing unlocked"); go("home");
    }, function(){
      fail("This browser won't hash the password over an insecure connection. Open the site over https.");
    });
  }

  var editorPanel = el("div",{class:"panel"},[
    el("h3",{text:"Course editor"}),
    el("p",{text:"Unlocks the card editor on this device. Changes stay here until you publish a new decks.json to the repo, so a student who got past this box still couldn't change anyone else's cards."}),
    el("div",{class:"field"},[ el("label",{text:"Username"}), userIn ]),
    el("div",{class:"field"},[ el("label",{text:"Password"}), passIn ]),
    el("div",{class:"rowctl",style:"justify-content:flex-start"},[
      el("button",{class:"btn",onclick:unlock},["Unlock editing"]),
      S.canEdit ? el("button",{class:"btn ghost",onclick:function(){ S.canEdit = false; refreshFoot(); renderRail(); toast("Editing locked"); render(); }},["Lock editing"]) : null
    ])
  ]);

  errBox = el("p",{class:"err",hidden:"hidden"});

  wrap.appendChild(editorPanel);
  wrap.appendChild(errBox);
  stage.appendChild(wrap);
}

/* ============================ connect to GitHub ============================ */
// Asks GitHub whether the saved token is still good, so a dead one is found here
// rather than halfway through publishing.
function checkToken(){
  var out = $("tokcheck"), btn = $("checktok");
  if(!out || !S.token) return;
  out.hidden = false; out.className = "saveflag"; out.textContent = "Asking GitHub…";
  if(btn) btn.setAttribute("disabled","disabled");
  ghFetch(GH_API + "?ref=" + GH_BRANCH).then(function(res){
    if(btn) btn.removeAttribute("disabled");
    if(res.ok){ out.className = "saveflag"; out.textContent = "Still good — you can publish."; return; }
    out.className = "err";
    out.textContent = ghError(res);
    if(res.status === 401){ setToken(null); setTimeout(function(){ render(); }, 1200); }
  }).catch(function(){
    if(btn) btn.removeAttribute("disabled");
    out.className = "err"; out.textContent = "Couldn't reach GitHub. Check your connection and try again.";
  });
}
function renderConnect(){
  var errBox, tokIn;
  function fail(msg){ errBox.textContent = msg; errBox.hidden = false; }

  stage.appendChild(el("div",{class:"stage-head"},[
    el("div",{},[
      el("h2",{text:"Publishing"}),
      el("div",{class:"sub",text:"One-time setup. After this, Publish sends your cards to everyone by itself."})
    ]),
    el("button",{class:"btn ghost",onclick:function(){ go(S.decks.length ? "edit" : "home"); }},[icon(I.back,15),"Back"])
  ]));

  var wrap = el("div",{class:"signin"});

  if(S.token){
    wrap.appendChild(el("div",{class:"panel"},[
      el("h3",{text:"Connected"}),
      el("p",{text:"This browser can publish to " + GH_OWNER + "/" + GH_REPO + ". The token is stored here and nowhere else — it isn't in the site's code and never goes to anyone but GitHub."}),
      tokenAge() ? el("p",{class:"saveflag",style:"margin:-6px 0 12px",text:"Saved in this browser on " + tokenAge() + "."}) : null,
      el("div",{class:"rowctl",style:"justify-content:flex-start"},[
        el("button",{class:"btn",id:"checktok",onclick:checkToken},["Check it still works"]),
        el("button",{class:"btn",onclick:function(){ setToken(null); toast("Token removed from this browser"); render(); }},["Disconnect"]),
        el("button",{class:"btn ghost",onclick:downloadJSON},[icon(I.upload,15),"Download decks.json instead"])
      ]),
      el("p",{class:"err",id:"tokcheck",hidden:"hidden",style:"margin:14px 0 0"})
    ]));
    stage.appendChild(wrap);
    return;
  }

  // A real form with a username and a password field, so the browser's password manager
  // (or 1Password, iCloud Keychain, …) offers to save the token and fills it next time.
  // autocomplete="off" here was the reason it never offered.
  var userIn = el("input",{class:"text",type:"text",name:"username",autocomplete:"username",
    value: GH_OWNER, "aria-label":"GitHub account",spellcheck:"false"});
  tokIn = el("input",{class:"text",type:"password",name:"password",placeholder:"github_pat_…",
    autocomplete:"current-password",spellcheck:"false","aria-label":"Token"});

  function connect(){
    var t = tokIn.value.trim();
    if(!t) return fail("Paste the token first.");
    errBox.hidden = true;
    var was = S.token; S.token = t;
    ghFetch(GH_API + "?ref=" + GH_BRANCH).then(function(res){
      if(res.status === 404){
        // 404 also means "repo exists but token can't see it" — either way, same fix.
        throw new Error("GitHub can't see " + GH_OWNER + "/" + GH_REPO + " with this token. Check the repo exists and that the token lists it under Repository access.");
      }
      if(res.status === 401) throw new Error("GitHub rejected that token. Copy it again — it's only shown once.");
      if(!res.ok) throw new Error(ghError(res));
      return res.json();
    }).then(function(){
      setToken(t);
      toast("Connected to GitHub");
      // Let the password manager see a completed sign-in before the view changes.
      if(window.PasswordCredential){
        try{ navigator.credentials.store(new window.PasswordCredential({id: userIn.value || GH_OWNER, password: t, name: "Quizletish publishing"})); }catch(e){}
      }
      setTimeout(function(){ go(S.decks.length ? "edit" : "home"); }, 0);
    }).catch(function(err){
      S.token = was;
      fail(String(err && err.message || err));
    });
  }

  var form = el("form",{id:"ghform",autocomplete:"on"});
  form.addEventListener("submit", function(ev){ ev.preventDefault(); connect(); });
  form.appendChild(el("div",{class:"panel"},[
    el("h3",{text:"Let this browser publish for you"}),
    el("p",{text:"Publishing means writing decks.json to the repo. Give this browser a token that can do only that, and the Publish button does the rest — no terminal, no commit."}),
    el("ol",{class:"steps"},[
      el("li",{html:'Open <code>github.com/settings/personal-access-tokens/new</code> — this is the <b>fine-grained</b> token page, not the classic one.'}),
      el("li",{html:'Resource owner <code>' + GH_OWNER + '</code>. Under <b>Repository access</b> choose <b>Only select repositories</b> and pick <code>' + GH_REPO + '</code>.'}),
      el("li",{html:'Under <b>Repository permissions</b> set <b>Contents</b> to <b>Read and write</b>. Leave every other permission alone.'}),
      el("li",{html:'Under <b>Expiration</b> pick <b>No expiration</b>, or the longest it will let you. The box defaults to <b>30 days</b>, which is why a token you set up last month has stopped working.'}),
      el("li",{html:'Generate it and copy the token — GitHub shows it once.'})
    ]),
    el("div",{class:"field"},[ el("label",{for:"ghuser",text:"GitHub account"}), userIn ]),
    el("div",{class:"field"},[ el("label",{for:"ghtok",text:"Paste the token"}), tokIn ]),
    el("div",{class:"rowctl",style:"justify-content:flex-start"},[
      el("button",{class:"btn primary",type:"submit"},["Connect"]),
      el("button",{class:"btn ghost",type:"button",onclick:downloadJSON},[icon(I.upload,15),"Download decks.json instead"])
    ]),
    el("p",{class:"saveflag",style:"margin:14px 0 0",text:"Say yes when your browser offers to save it — then next time it fills itself in, and it follows you to your other devices."})
  ]));

  userIn.id = "ghuser"; tokIn.id = "ghtok";
  wrap.appendChild(form);

  wrap.appendChild(el("div",{class:"panel"},[
    el("h3",{text:"What the token can and can't do"}),
    el("p",{html:"Scoped that way it can change <b>one file in one repo</b> and nothing else — not your other repos, not your account, not your other GitHub data. It lives in this browser\'s storage and, if you let the browser save it, in your password manager — so treat this like a signed-in session: don\'t set it up on a shared or classroom machine, and hit Disconnect if you ever do. If it leaks, revoke it at <code>github.com/settings/tokens</code> and make a new one — nothing else needs changing."})
  ]));

  errBox = el("p",{class:"err",hidden:"hidden"});
  wrap.appendChild(errBox);
  stage.appendChild(wrap);
  setTimeout(function(){ tokIn.focus(); }, 0);
}

/* ============================ keyboard ============================ */
document.addEventListener("keydown", function(ev){
  var tag = (ev.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea" || tag === "select") return;
  if(ev.metaKey || ev.ctrlKey || ev.altKey) return;
  var s = S.session, k = ev.key;
  if(S.view === "flash" && s){
    if(k === " "){ ev.preventDefault(); s.flipped = !s.flipped; render(); }
    else if(k === "ArrowRight"){ ev.preventDefault(); advanceFlash(1); }
    else if(k === "ArrowLeft"){ ev.preventDefault(); advanceFlash(-1); }
    else if(k === "s" || k === "S"){ ev.preventDefault(); var c = s.cards[s.i]; if(c){ toggleStar(c.id); render(); } }
  } else if(S.view === "quiz" && s && s.i < s.cards.length){
    if(s.picked === null && /^[1-4]$/.test(k)){
      var idx = parseInt(k,10) - 1;
      if(idx < s.choices.length){ ev.preventDefault(); pickChoice(idx, s.choices[idx] === ans(s.cards[s.i]), s.cards[s.i]); }
    } else if((k === "Enter" || k === " ") && s.picked !== null){ ev.preventDefault(); nextQuiz(); }
  } else if(S.view === "write" && s && s.state && (k === "Enter" || k === " ")){
    ev.preventDefault(); nextWrite();
  } else if(S.view === "test" && s && s.mode === "test" && !s.over){
    var tq = s.qs[s.i];
    if(tq.kind !== "type" && /^[1-4]$/.test(k)){
      var ti = parseInt(k,10) - 1;
      if(tq.choices && ti < tq.choices.length){ ev.preventDefault(); tq.given = tq.choices[ti]; render(); setTimeout(function(){ nextTestQ(1); }, 160); }
    } else if(k === "Enter"){ ev.preventDefault(); nextTestQ(1); }
    else if(k === "ArrowLeft"){ ev.preventDefault(); nextTestQ(-1); }
    else if(k === "ArrowRight"){ ev.preventDefault(); nextTestQ(1); }
  } else if(S.view === "pos" && s && s.i < s.cards.length){
    if(s.picked === null && /^[1-4]$/.test(k)){
      var pi = parseInt(k,10) - 1;
      if(s.choices && pi < s.choices.length){ ev.preventDefault(); pickPos(pi); }
    } else if((k === "Enter" || k === " ") && s.picked !== null){ ev.preventDefault(); nextPos(); }
    if(k === "Escape"){ S.session = null; go("home"); }
  } else if(S.view === "table" && s && s.mode === "table"){
    if(s.checked && (k === "Enter" || k === " ")){ ev.preventDefault(); nextTable(); }
    if(k === "Escape"){ S.session = null; go("home"); }
  } else if(S.view === "learn" && s && s.mode === "learn"){
    if(s.i >= s.queue.length){
      if(k === "Enter"){ ev.preventDefault(); learnContinueRound(); }
    } else if(!s.answer && s.kind !== "type" && /^[1-4]$/.test(k)){
      var li = parseInt(k,10) - 1;
      if(s.choices && li < s.choices.length){ ev.preventDefault(); learnPick(li); }
    } else if(s.answer && (k === "Enter" || k === " ")){ ev.preventDefault(); learnNext(); }
    if(k === "Escape"){ S.session = null; go("home"); }
  } else if(S.view !== "home" && k === "Escape"){
    S.session = null; go("home");
  }
});

/* ============================ boot ============================ */
try{ S.who = localStorage.getItem(WHO_KEY) || null; }catch(e){ S.who = null; }
try{ S.token = localStorage.getItem(TOKEN_KEY) || null; }catch(e){ S.token = null; }
if(S.token) keepStorage();

/* Which sign-in methods the project has switched on, so no dead buttons are shown.
   Everything below is best-effort: the app works unchanged if it all fails. */
fetch(SB_URL + "/auth/v1/settings", {headers:{apikey: SB_KEY}})
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(cfg){
    if(!cfg) return;
    S.providers = {google: !!(cfg.external && cfg.external.google), email: !!(cfg.external && cfg.external.email)};
    var hasSession = /access_token=|[?&]code=/.test(location.hash + location.search);
    var stored = false;
    try{ stored = Object.keys(localStorage).some(function(k){ return k.indexOf("sb-") === 0 && k.indexOf("-auth-token") > -1; }); }catch(e){}
    if(!hasSession && !stored) return render();
    return sbLoad().then(function(c){
      return c.auth.getSession().then(function(r){
        if(r.data && r.data.session) setUser(r.data.session.user); else render();
        c.auth.onAuthStateChange(function(ev, sess){
          if(ev === "SIGNED_IN" && sess && (!S.user || S.user.id !== sess.user.id)) setUser(sess.user);
          if(ev === "SIGNED_OUT") setUser(null);
        });
        if(location.hash.indexOf("access_token") > -1) history.replaceState(null, "", location.pathname);
      });
    });
  })
  .catch(function(){});
S.open = ls(FOLD_KEY, {});
try{ S.railShut = localStorage.getItem(RAIL_KEY) === "1"; }catch(e){ S.railShut = false; }
setRail(S.railShut);
$("reopen").addEventListener("click", function(){ setRail(false); });
loadLocal();
$("whobtn").addEventListener("click", function(){ go("who"); });
refreshFoot();
renderRail();
render();

function copy(x){ return JSON.parse(JSON.stringify(x)); }
function currentStore(){ return {folders:S.folders, decks:S.decks}; }
function useStore(st){ st = copy(st || {folders:[], decks:[]}); S.folders = st.folders; S.decks = st.decks; STORE_VER++; }
// Accepts decks.json with or without folders, and drops a deck's folder if it points nowhere.
function normalizeStore(raw){
  var folders = (raw && Array.isArray(raw.folders) ? raw.folders : []).map(function(f){
    return {id: String(f.id || uid("f")), name: f.name || "Untitled folder", parent: f.parent ? String(f.parent) : "", archive: !!f.archive};
  });
  var ids = {}, byId = {};
  folders.forEach(function(f){ ids[f.id] = true; byId[f.id] = f; });
  // A parent that doesn't exist puts the folder at the top level; a loop is cut where it closes.
  folders.forEach(function(f){ if(!ids[f.parent] || f.parent === f.id) f.parent = ""; });
  folders.forEach(function(f){
    var p = f.parent, steps = 0;
    while(p && steps++ <= folders.length){
      if(p === f.id){ f.parent = ""; break; }
      p = byId[p] ? byId[p].parent : "";
    }
  });
  var list = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.decks) ? raw.decks : []);
  var decks = list.map(function(v, n){
    return {
      id: v.id || uid("d"),
      name: v.name || "Untitled deck",
      subject: v.subject || "",
      folder: ids[v.folder] ? v.folder : "",
      quiz: parseDate(v.quiz) ? String(v.quiz) : "",
      kind: (v.kind === "vocab" || v.kind === "conj") ? v.kind : undefined,
      tense: v.tense ? String(v.tense) : "",
      persons: (Array.isArray(v.persons) && v.persons.length
        ? v.persons.filter(function(x){ return x && x.id; }).map(function(x, k){
            return {id: String(x.id), label: x.label ? String(x.label) : "Form " + (k+1)};
          })
        : null) || undefined,
      cards: (Array.isArray(v.cards) ? v.cards : []).map(function(c){
        var out = {id: c.id || uid(), term: c.term || "", def: c.def || ""};
        if(c.pos && POS.indexOf(String(c.pos)) > -1) out.pos = String(c.pos);
        if(c.forms && typeof c.forms === "object"){
          out.forms = {};
          Object.keys(c.forms).forEach(function(k){ out.forms[k] = String(c.forms[k] == null ? "" : c.forms[k]); });
        }
        return out;
      }),
      createdAt: v.createdAt || n
    };
  }).sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); });
  return {folders:folders, decks:decks};
}

fetch("decks.json", {cache:"no-store"})
  .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(function(raw){
    S.published = normalizeStore(raw);
    var draft = ls(DRAFT_KEY, null);
    if(draft){
      useStore(normalizeStore(draft));
      S.draft = true;
    } else {
      useStore(S.published);
    }
    S.ready = true;
    if(!S.deckId && S.decks.length) S.deckId = S.decks[0].id;
    refreshFoot(); renderRail();
    render();
  })
  .catch(function(err){
    S.ready = true; S.loadError = err;
    setSync(false, "Couldn't load decks");
    render();
  });

/* -------- pick up newly published decks without a reload --------
   Students leave this open; a publish should reach them on its own. Nothing is
   swapped out from under an editor with unsaved work or a student mid-session. */
function applyIncoming(){
  if(!S.incoming) return false;
  S.published = S.incoming; S.incoming = null;
  useStore(S.published);
  if(!deck() && S.decks.length) S.deckId = S.decks[0].id;
  renderRail();
  return true;
}
function pollPublished(){
  if(document.hidden || !S.ready || S.loadError) return;
  fetch("decks.json", {cache:"no-store"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(raw){
      if(!raw) return;
      var next = normalizeStore(raw);
      if(JSON.stringify(next) === JSON.stringify(S.published)) return;
      S.incoming = next;
      if(S.draft){                      // the editor's own unpublished work wins
        S.published = next; S.incoming = null;
        return toast("The published decks changed somewhere else");
      }
      if(S.session || S.view === "edit") return toast("New cards — they'll appear when you're done");
      applyIncoming();
      if(S.view === "home" || S.view === "folder") render();
      toast("Decks updated");
    })
    .catch(function(){});
}
setInterval(pollPublished, 60000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) pollPublished(); });
})();
</script>
