<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quizletish</title>
<meta name="description" content="Term drills for a law course — flashcards, multiple choice, typed recall, and timed matching.">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<!-- The browser's own chrome, in the brand's two backgrounds. -->
<meta name="theme-color" content="#EFE9DE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151310" media="(prefers-color-scheme: dark)">
<!-- iPhones ignore the manifest's icon and will otherwise put a screenshot of
     the page on the home screen. They also will not take an SVG. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="icon.svg">
<!-- The mark again at 32px, down to two rules: three of them close up into a smudge
     by the time a browser has drawn the tab at 16 across. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23EFE9DE'/%3E%3Crect x='5.7' y='5.3' width='9.8' height='6' rx='1.2' fill='%23A8321F' stroke='%2314110D' stroke-width='1.9'/%3E%3Crect x='4.3' y='9.3' width='23.2' height='16.5' rx='1.6' fill='%23FBF8F1' stroke='%2314110D' stroke-width='1.9'/%3E%3Cpath d='M8.7 16h14.5M8.7 21h9' stroke='%2314110D' stroke-width='1.9' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,600&display=swap">
<style>
/* Quizletish — a card-catalogue drawer, not a dashboard.
   Warm manila stock, black ink, one stamped red. Rules instead of shadows;
   where a shadow appears it is a hard offset, the way a stacked card sits. */
:root{
  --paper:#EFE9DE;
  --surface:#FBF8F1;
  --surface-2:#E6DFD1;
  --ink:#14110D;
  --ink-soft:#5B5346;
  --ink-faint:#8E8574;
  --rule:#C6BCA8;
  --rule-soft:#DCD3C2;
  --accent:#14110D;          /* the accent IS the ink — fills, not tints */
  --accent-ink:#FBF8F1;
  --accent-wash:#E2DACA;
  --brass:#8A6714;
  --brass-wash:#F0E4C6;
  --good:#3D5C36;
  --good-wash:#DFE7D7;
  --bad:#A8321F;
  --bad-wash:#F5DFD9;
  --ui:"Libre Franklin","Helvetica Neue",Helvetica,Arial,sans-serif;
  --read:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --rail:262px;
  --lift:3px 3px 0 var(--rule);
  --r:7px;          /* one dial for every corner in the app */
  --r-lg:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#151310;
    --surface:#1E1A15;
    --surface-2:#272219;
    --ink:#EDE6D8;
    --ink-soft:#A79C89;
    --ink-faint:#7A7161;
    --rule:#3A3429;
    --rule-soft:#2B261E;
    --accent:#EDE6D8;
    --accent-ink:#151310;
    --accent-wash:#332D23;
    --brass:#D2A94A;
    --brass-wash:#2E2718;
    --good:#86A874;
    --good-wash:#1F2819;
    --bad:#DC7159;
    --bad-wash:#301D18;
    --lift:3px 3px 0 var(--rule);
  }
}
/* ---- more paper ----
   Each one is the same desk in different stock and ink; nothing moves, only the colour.
   A theme redefines the whole palette, so none of them half-inherit another. */
:root[data-theme="blueprint"]{
  color-scheme:light;
  --paper:#E7EDF3; --surface:#F7FAFC; --surface-2:#DBE4ED; --ink:#0F2438; --ink-soft:#4A6076;
  --ink-faint:#7E91A4; --rule:#B7C6D5; --rule-soft:#D2DCE7; --accent:#0F2438; --accent-ink:#F7FAFC;
  --accent-wash:#D2DCE7; --brass:#8A6714; --brass-wash:#F0E4C6; --good:#2F6B52; --good-wash:#DBEAE2;
  --bad:#A8321F; --bad-wash:#F5DFD9;
}
:root[data-theme="pine"]{
  color-scheme:light;
  --paper:#E8EDE3; --surface:#F8FAF5; --surface-2:#DDE4D5; --ink:#15231A; --ink-soft:#4B5C4F;
  --ink-faint:#7D8C80; --rule:#BCC8B6; --rule-soft:#D5DDCE; --accent:#15231A; --accent-ink:#F8FAF5;
  --accent-wash:#D5DDCE; --brass:#856512; --brass-wash:#EFE3C4; --good:#2E6B3E; --good-wash:#DBEBDC;
  --bad:#A8321F; --bad-wash:#F5DFD9;
}
:root[data-theme="rose"]{
  color-scheme:light;
  --paper:#F2E9E6; --surface:#FBF7F5; --surface-2:#E8DAD5; --ink:#2A1A18; --ink-soft:#6B5450;
  --ink-faint:#9B8580; --rule:#D4BDB6; --rule-soft:#E4D3CD; --accent:#2A1A18; --accent-ink:#FBF7F5;
  --accent-wash:#E4D3CD; --brass:#9A6B1E; --brass-wash:#F3E6CB; --good:#3F6B4A; --good-wash:#DFEADF;
  --bad:#A33049; --bad-wash:#F6DEE3;
}
:root[data-theme="dusk"]{
  color-scheme:dark;
  --paper:#191411; --surface:#241D18; --surface-2:#2E261E; --ink:#F0E3D2; --ink-soft:#B2A08A;
  --ink-faint:#7D6F5F; --rule:#413627; --rule-soft:#31281E; --accent:#F0E3D2; --accent-ink:#191411;
  --accent-wash:#382E22; --brass:#E0AC54; --brass-wash:#33280F; --good:#8CB37A; --good-wash:#1F2A18;
  --bad:#E07A5F; --bad-wash:#2F1C16;
}
:root[data-theme="midnight"]{
  color-scheme:dark;
  --paper:#0F1217; --surface:#181C22; --surface-2:#20262E; --ink:#E4EAF2; --ink-soft:#96A3B4;
  --ink-faint:#6A7788; --rule:#2B323B; --rule-soft:#222830; --accent:#E4EAF2; --accent-ink:#0F1217;
  --accent-wash:#272F38; --brass:#D2A94A; --brass-wash:#2A2415; --good:#72B48C; --good-wash:#16261D;
  --bad:#E0736A; --bad-wash:#2C1A19;
}
:root[data-theme="dark"]{
  --paper:#151310;
  --surface:#1E1A15;
  --surface-2:#272219;
  --ink:#EDE6D8;
  --ink-soft:#A79C89;
  --ink-faint:#7A7161;
  --rule:#3A3429;
  --rule-soft:#2B261E;
  --accent:#EDE6D8;
  --accent-ink:#151310;
  --accent-wash:#332D23;
  --brass:#D2A94A;
  --brass-wash:#2E2718;
  --good:#86A874;
  --good-wash:#1F2819;
  --bad:#DC7159;
  --bad-wash:#301D18;
  --lift:3px 3px 0 var(--rule);
}

/* ---- motion ----
   One vocabulary for the whole page, so nothing moves in a way the rest of it
   doesn't: arrivals decelerate, taps answer instantly, and the only thing slow
   enough to watch is a card turning over. */
:root{
  --ease:cubic-bezier(.2,.7,.2,1);      /* arriving: fast, then settles */
  --ease-io:cubic-bezier(.4,0,.2,1);    /* going somewhere and back */
  --t-tap:.1s;
  --t-quick:.16s;
  --t-move:.24s;
  --t-turn:.42s;
}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes rise-sm{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
@keyframes from-right{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes from-left{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
/* Tinting in from the plain card, so a right or wrong answer washes over the
   option rather than appearing already coloured. */
@keyframes wash{from{background:var(--surface);color:var(--ink)}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.5}}

/* The stage is torn down and rebuilt constantly — for a flipped card as much as
   for a new view. Only a real change of view earns the page-turn; see FRESH. */
#stage.enter{animation:rise var(--t-move) var(--ease)}
/* Grids built only when the view changes may come in one item at a time. Anything
   a tap inside the view rebuilds must not, or it flickers on every answer. */
.stagger > *{animation:rise-sm .26s var(--ease) backwards}
.stagger > :nth-child(1){animation-delay:0ms}
.stagger > :nth-child(2){animation-delay:24ms}
.stagger > :nth-child(3){animation-delay:48ms}
.stagger > :nth-child(4){animation-delay:72ms}
.stagger > :nth-child(5){animation-delay:96ms}
.stagger > :nth-child(6){animation-delay:120ms}
.stagger > :nth-child(7){animation-delay:144ms}
.stagger > :nth-child(8){animation-delay:168ms}
.stagger > :nth-child(9){animation-delay:192ms}
.stagger > :nth-child(10){animation-delay:216ms}
.stagger > :nth-child(n+11){animation-delay:240ms}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:var(--r)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
kbd{font-family:var(--mono);font-size:11px;background:var(--surface-2);border:1px solid var(--rule);border-bottom-width:2px;border-radius:var(--r);padding:1px 5px;color:var(--ink-soft)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* catalogue labels: mono small caps, the way a drawer is labelled */
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}

/* ---- chrome ---- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh;min-height:100dvh;transition:grid-template-columns var(--t-move) var(--ease)}
.rail{border-right:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;min-width:0;transition:transform var(--t-move) var(--ease),border-color var(--t-move) ease}
.brand{padding:20px 18px 15px;border-bottom:2px solid var(--ink);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;width:100%;text-align:left;border-radius:0}
/* Its own line under the name, which is what flex-basis:100% buys in a wrapping row. */
.brand .byline{flex-basis:100%;font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--ink-faint);margin-top:3px}
/* Drawn from the theme's own variables, so the mark follows whichever of the eight
   is on rather than being a flat image that only suits the default one. */
.brand .mark{align-self:center;line-height:0;flex:none}
.brand .mark svg{display:block}
.hero .mark{display:block;line-height:0;margin-bottom:14px}
.brand:hover h1{color:var(--bad)}
.brand h1{transition:color .12s}
.brand h1{font-family:var(--read);font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1}
.brand h1 em{font-style:italic;color:var(--bad)}
.brand .tag{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.04em}
/* DECKS, then (for an editor) New folder and New deck, then collapse-all and hide.
   All of that in a 262px column only just fits, and it used to not: the last icon
   was cut in half by the edge of the sidebar. Tighter spacing buys the room, and
   wrapping is the safety net so a longer word can never clip a control again. */
.rail-head{display:flex;align-items:center;justify-content:space-between;padding:15px 14px 7px;flex-wrap:wrap;gap:6px}
.decks{list-style:none;margin:0;padding:0 10px 10px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:1px}
.deck-btn{width:100%;text-align:left;padding:9px 10px;border-radius:var(--r);display:flex;align-items:baseline;gap:8px;color:var(--ink-soft);border-left:3px solid transparent;transition:background var(--t-tap),color var(--t-tap),border-left-color var(--t-quick) var(--ease)}
.deck-btn:hover{background:var(--surface-2);color:var(--ink)}
.deck-btn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.deck-btn .ct{font-family:var(--mono);font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.deck-btn[aria-current="true"]{background:var(--ink);color:var(--accent-ink);border-left-color:var(--bad)}
.deck-btn[aria-current="true"] .ct{color:var(--accent-ink);opacity:.65}
.rail-foot{border-top:1px solid var(--rule);padding:12px 18px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-faint);width:100%;text-align:left}
.rail-foot:hover{background:var(--surface-2);color:var(--ink-soft)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--good);flex:none}
.dot.off{background:var(--ink-faint)}
.dot.edit{background:var(--bad)}

.stage{padding:30px 34px 60px;max-width:1060px;width:100%}
.stage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.stage-head h2{font-family:var(--read);font-size:31px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.sub{color:var(--ink-soft);font-size:13px;margin-top:5px}

/* ---- buttons: bordered, square, no glow ---- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--rule);background:var(--surface);font-weight:500;font-size:14px;transition:border-color var(--t-tap),background var(--t-tap),color var(--t-tap),transform var(--t-tap) var(--ease)}
.btn:hover{border-color:var(--ink);background:var(--surface-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--accent-ink)}
.btn.primary:hover{background:var(--ink-soft);border-color:var(--ink-soft)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-soft)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--rule);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--rule);background:var(--surface)}
.btn.danger:hover{border-color:var(--bad);background:var(--bad-wash)}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* Everything you can press gives a little under the press — the only feedback
   a touchscreen has, since it has no hover. */
.btn:active:not(:disabled){transform:scale(.97)}

/* ---- mode tiles ---- */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;margin:0 0 26px;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r-lg);overflow:hidden}
.mode{text-align:left;padding:17px 18px;background:var(--surface);display:flex;flex-direction:column;gap:6px;transition:background var(--t-tap),transform var(--t-tap) var(--ease);border:0;outline-offset:-3px;box-shadow:0 0 0 .5px var(--rule)}
.mode:hover:not(:disabled){background:var(--surface-2)}
.mode:disabled{opacity:.45}
.mode:active:not(:disabled){transform:scale(.99)}
.mode .mt{font-weight:600;font-size:15px;display:flex;align-items:center;gap:9px;letter-spacing:-.01em}
.mode .md{font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.mode svg{flex:none;color:var(--bad)}

/* ---- deck summary: a ruled slip, not a stat dashboard ---- */
.summary{display:flex;gap:0;align-items:stretch;border:1px solid var(--rule);background:var(--surface);margin-bottom:22px;flex-wrap:wrap;border-radius:var(--r-lg);overflow:hidden}
.stat{display:flex;flex-direction:column;gap:2px;padding:13px 20px;flex:1;min-width:104px}
.stat + .stat{border-left:1px solid var(--rule-soft)}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat .l{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.stat .v.brass{color:var(--brass)}
.stat .v.bad{color:var(--bad)}
.summary .note{padding:13px 20px;font-size:11.5px;color:var(--ink-faint);max-width:27ch;line-height:1.45;display:flex;align-items:center}

/* ---- options bar ---- */
.opts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{padding:6px 12px;font-size:13px;color:var(--ink-soft);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--accent-ink);font-weight:500}

/* ---- the card: ruled index stock ---- */
.deskrow{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
.counter{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.track{height:4px;background:var(--rule-soft);overflow:hidden;border-radius:99px;margin-bottom:22px}
.track>i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width var(--t-move) var(--ease)}
.cardwrap{perspective:1600px;margin-bottom:18px}
/* The next card arrives from the side you sent the last one out towards, which
   is what a swipe has already promised by the time it lands. */
.cardwrap.in-next{animation:from-right var(--t-move) var(--ease)}
.cardwrap.in-prev{animation:from-left var(--t-move) var(--ease)}
.card{position:relative;min-height:340px;transform-style:preserve-3d;transition:transform var(--t-turn) var(--ease);cursor:pointer}
.card.flipped{transform:rotateX(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-lg);box-shadow:var(--lift);padding:56px 46px 46px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:auto;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,var(--rule-soft) 33px,var(--rule-soft) 34px);
  background-position:0 40px}
.face::before{content:"";position:absolute;left:0;right:0;top:38px;height:1px;background:var(--bad);opacity:.5}
.face.back{transform:rotateX(180deg)}
/* A card you have got wrong and not got right since is one you are having another
   go at, so it says so on the card itself rather than only in the Missed filter.
   Both faces, because it is the card that is being retried, not the question. */
.card.redo .face{border-color:var(--bad)}
/* The same mark in Learn. A card you get wrong drops back to the first rung, so
   next time round it is usually a pick-one and there is no answer box to outline
   — the term's own panel is the part that is always there. */
.prompt.redo{border-color:var(--bad)}
.answer.redo,.answer.redo:focus{border-color:var(--bad)}
.face .role{position:absolute;top:12px;left:22px;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.face .star{position:absolute;top:9px;right:16px;padding:6px;border-radius:var(--r);color:var(--ink-faint);line-height:0}
.face .star[aria-pressed="true"]{color:var(--brass)}
/* The example, under the answer. The brackets that mark the blank are for the question,
   not for reading, so they come off here. */
.exline{margin-top:12px;max-width:42ch;font-family:var(--read);font-size:14px;font-style:italic;line-height:1.5;color:var(--ink-soft)}
.cloze .q{white-space:pre-line}
.face .star{transition:background var(--t-tap),color var(--t-quick)}
.face .star:hover{background:var(--surface-2)}
.facetext{font-family:var(--read);font-size:29px;line-height:1.36;max-width:33ch;letter-spacing:-.015em;white-space:pre-line}
.face.back .facetext{font-size:21px;max-width:46ch;line-height:1.55}
.hintline{position:absolute;bottom:15px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--ink-faint)}
/* "Reduce motion" asks for less movement, not for a dead page — the thing it is
   actually about is travel across the screen, which is what makes some people ill.
   So everything that moves comes out (the slides, the stagger, the shake, the flip,
   anything that scales) and what is left is the same change as a plain cross-fade,
   which still says something happened. Switched on, this is the whole page's
   behaviour, so it is worth it being pleasant rather than merely inoffensive. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.2s!important;animation-delay:0s!important;
    animation-iteration-count:1!important;
    transition-property:opacity,background-color,border-color,color,box-shadow!important;
    transition-duration:.18s!important;
  }
  /* Same timing, same meaning, no travel. */
  #stage.enter,.stagger > *,.cardwrap.in-next,.cardwrap.in-prev,
  .verdict,.result,.result .score,.toast{animation-name:fade!important}
  .tile.miss,.empty.load h3{animation:none!important}
  .btn:active:not(:disabled),.mode:active:not(:disabled),.choice:active:not(:disabled),
  .dcard:active,.tile:active:not(:disabled):not(.done),.tile.done{transform:none}
  /* The flip becomes a swap. Both faces are stacked and hidden from each other by
     facing backwards; with the rotation gone they would both face front, so which
     one shows has to be said outright. */
  .card{transform:none!important}
  .face{backface-visibility:visible;-webkit-backface-visibility:visible;transition:none!important}
  .face.back{transform:none}
  /* Swapped outright, not faded: someone who has asked for less movement is not
     asking for a half-second dissolve on every card either. Saying which face shows
     is not optional here — with the rotation gone, both of them face front, and
     without this the card shows its two sides on top of each other. */
  .card:not(.flipped) .face.back,.card.flipped .face:not(.back){opacity:0;pointer-events:none}
}

.judge.turn > *{animation:fade var(--t-quick) ease}
.rowctl{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.judge{display:flex;gap:10px;justify-content:center;margin-top:4px}
.judge .btn{min-width:150px;justify-content:center}
.judge .know{border-color:var(--good);color:var(--good)}
.judge .know:hover{background:var(--good-wash);border-color:var(--good)}
.judge .again{border-color:var(--brass);color:var(--brass)}
.judge .again:hover{background:var(--brass-wash);border-color:var(--brass)}

/* ---- quiz ---- */
.prompt{background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-lg);box-shadow:var(--lift);padding:34px 32px;margin-bottom:18px;text-align:center}
.prompt .role{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:14px}
.prompt .q{font-family:var(--read);font-size:26px;line-height:1.35;max-width:40ch;margin:0 auto;letter-spacing:-.015em;white-space:pre-line}
.choices{display:grid;gap:0;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.choice{display:flex;gap:13px;align-items:flex-start;text-align:left;padding:13px 15px;border:0;border-bottom:1px solid var(--rule);background:var(--surface);font-family:var(--read);font-size:17px;line-height:1.45;transition:background var(--t-tap),transform var(--t-tap) var(--ease)}
.choice:last-child{border-bottom:0}
.choice:hover:not(:disabled){background:var(--surface-2)}
.choice .key{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink-faint);border:1px solid var(--rule);border-radius:var(--r);width:20px;height:20px;display:grid;place-items:center;flex:none;margin-top:4px}
.choice.right{background:var(--good-wash);color:var(--good);animation:wash .34s var(--ease)}
.choice.right .key{border-color:var(--good);color:var(--good)}
.choice.wrong{background:var(--bad-wash);color:var(--bad);animation:wash .34s var(--ease)}
.choice.wrong .key{border-color:var(--bad);color:var(--bad)}
.choice:active:not(:disabled){transform:scale(.995)}
.choice:disabled{cursor:default}
.verdict{margin-top:16px;padding:12px 15px;border-radius:var(--r);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid currentColor;animation:rise var(--t-move) var(--ease)}
.verdict.ok{background:var(--good-wash);color:var(--good)}
.verdict.no{background:var(--bad-wash);color:var(--bad)}
.verdict.near{background:var(--brass-wash);color:var(--brass)}
.verdict b{font-family:var(--read);font-weight:600}
.verdict .btn:not(.primary){color:var(--ink)}

/* ---- write mode ---- */
.answer{width:100%;padding:14px 16px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);font-family:var(--read);font-size:20px}
.answer:focus{border-color:var(--ink);outline:none;box-shadow:var(--lift)}

/* ---- match ---- */
.matchgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tile{min-height:104px;padding:14px;border:1px solid var(--rule);border-radius:var(--r-lg);background:var(--surface);display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;line-height:1.4;transition:background var(--t-tap),border-color var(--t-tap),opacity var(--t-move),transform var(--t-move) var(--ease)}
.tile.term{font-family:var(--ui);font-weight:600;border-left:3px solid var(--ink)}
.tile.def{font-family:var(--read);font-size:15px;white-space:pre-line}
.tile:hover:not(:disabled):not(.done){border-color:var(--ink);background:var(--surface-2)}
.tile.sel{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
/* A cleared pair shrinks back as it fades, so the two you got go away together
   instead of just dimming. The tiles are kept across taps for this — see
   paintTiles(). */
.tile.done{opacity:.18;transform:scale(.94);pointer-events:none;border-style:dashed}
.tile:active:not(:disabled):not(.done){transform:scale(.96)}
.tile.miss{border-color:var(--bad);background:var(--bad-wash);color:var(--bad);animation:shake .4s var(--ease-io)}
@keyframes shake{0%,100%{transform:translateX(0)}16%{transform:translateX(-7px)}38%{transform:translateX(6px)}60%{transform:translateX(-3px)}82%{transform:translateX(2px)}}

/* ---- results ---- */
.result{background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-lg);box-shadow:var(--lift);padding:34px 30px;text-align:center;margin-bottom:18px;animation:pop .3s var(--ease)}
.result .score{font-family:var(--mono);font-size:56px;font-weight:500;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1.05;animation:pop .4s var(--ease) .07s backwards}
.missed{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;text-align:left;border:1px solid var(--rule);overflow:hidden;border-radius:var(--r)}
.missed li{display:grid;grid-template-columns:minmax(120px,1fr) 1.4fr;gap:16px;padding:11px 14px;background:var(--surface);border-bottom:1px solid var(--rule-soft);font-size:14px}
.missed li:last-child{border-bottom:none}
.missed .t{font-weight:600}
.missed .d{font-family:var(--read);font-size:15px;color:var(--ink-soft)}

/* ---- editor ---- */
.editbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.saveflag{font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.03em}
.rows{display:flex;flex-direction:column;border:1px solid var(--rule);overflow:hidden;background:var(--rule-soft);border-radius:var(--r-lg)}
.rowhead{display:grid;grid-template-columns:32px 1fr 1.5fr 32px;gap:10px;padding:8px 12px;background:var(--surface-2);font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);border-bottom:1px solid var(--rule)}
.row{display:grid;grid-template-columns:32px 1fr 1.5fr 32px;gap:10px;padding:8px 12px;background:var(--surface);align-items:start;border-bottom:1px solid var(--rule-soft)}
.row:last-child{border-bottom:0}
.row .n{font-family:var(--mono);font-size:11px;color:var(--ink-faint);padding-top:10px;font-variant-numeric:tabular-nums}
.row textarea{width:100%;border:1px solid transparent;border-radius:var(--r);background:transparent;padding:7px 8px;resize:vertical;min-height:38px;font-size:14px}
.row textarea.def{font-family:var(--read);font-size:16px}
/* a card with a second meaning */
.def-cell{display:flex;flex-direction:column;gap:4px;min-width:0}
.def-cell .alt{display:flex;gap:7px;align-items:flex-start;min-width:0}
.def-cell .alt .mk{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding-top:14px;flex:0 0 8px}
.def-cell .alt textarea{flex:1;min-width:0}
.def-cell .alt select.pos{flex:0 0 112px;min-width:0}
.altadd{align-self:flex-start;font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);padding:3px 5px;border-radius:var(--r)}
.altadd:hover{color:var(--ink);background:var(--surface-2)}
.altdel{color:var(--ink-faint);padding:9px 2px;line-height:0;flex:0 0 auto}
.altdel:hover{color:var(--bad)}
.row textarea:hover{border-color:var(--rule)}
.row textarea:focus{border-color:var(--ink);outline:none;background:var(--surface-2)}
.rows.ord .rowhead,.rows.ord .row{grid-template-columns:32px 1fr 1.5fr 56px 32px}
.rowmv{display:flex;align-items:center;gap:1px;padding-top:4px}
.rowmv .mv{color:var(--ink-faint);padding:5px;border-radius:var(--r);line-height:0}
.rowmv .mv:hover:not(:disabled){color:var(--ink);background:var(--surface-2)}
.rowmv .mv:disabled{opacity:.28}
.row .del{color:var(--ink-faint);padding:8px;border-radius:var(--r);line-height:0}
.row .del:hover{color:var(--bad);background:var(--bad-wash)}
.row .rep{color:var(--ink-faint);padding:8px;border-radius:var(--r);line-height:0;opacity:.45;transition:opacity .12s}
.row:hover .rep,.row .rep:focus-visible{opacity:1}
.row .rep:hover{color:var(--brass);background:var(--brass-wash)}
.face .rep{position:absolute;left:16px;bottom:12px;color:var(--ink-faint);padding:6px;border-radius:var(--r);line-height:0;opacity:.55}
.face .rep:hover{opacity:1;color:var(--brass)}
.reprow .what{font-family:var(--read);font-size:15px}
.reprow .card{font-size:13px;color:var(--ink-soft);margin-top:3px;background:none;border:0;padding:0}

.panel{border:1px solid var(--rule);border-radius:var(--r-lg);background:var(--surface);padding:20px;margin-bottom:16px}
.panel h3{font-family:var(--read);font-size:19px;margin-bottom:5px;font-weight:600}
.panel p{margin:0 0 13px;font-size:13.5px;color:var(--ink-soft);line-height:1.55}
.paste{width:100%;min-height:132px;border:1px solid var(--rule);border-radius:var(--r);padding:11px 12px;background:var(--surface-2);font-family:var(--mono);font-size:12.5px;line-height:1.65;resize:vertical}
.paste:focus{border-color:var(--ink);outline:none}
select{border:1px solid var(--rule);border-radius:var(--r);padding:7px 10px;background:var(--surface);font-size:13.5px}
input.text{border:1px solid var(--rule);border-radius:var(--r);padding:8px 11px;background:var(--surface);font-size:14px}
input.text:focus{border-color:var(--ink);outline:none}

.empty{border:1px dashed var(--rule);border-radius:var(--r-lg);padding:50px 30px;text-align:center;color:var(--ink-soft);background:var(--surface)}
.empty.load h3{animation:breathe 1.5s ease-in-out infinite}
.empty h3{font-family:var(--read);font-size:22px;margin-bottom:7px;color:var(--ink)}
.empty p{margin:0 auto 18px;max-width:46ch;font-size:14px}

.notice{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:var(--r);background:var(--surface);color:var(--ink-soft);font-size:13px;margin-bottom:18px;border:1px solid var(--rule);border-left:3px solid var(--brass)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--accent-ink);padding:10px 18px;border-radius:var(--r);font-size:13.5px;box-shadow:3px 3px 0 var(--rule);z-index:50;animation:toast-in var(--t-move) var(--ease)}
/* The centring transform belongs to the layout and is dropped on a phone, so the
   toast is moved with translate, which composes with it instead of replacing it. */
@keyframes toast-in{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
.toast.out{opacity:0;translate:0 10px;transition:opacity var(--t-quick) ease,translate var(--t-quick) ease}

/* ---- sign-in / publishing ---- */
.signin{max-width:460px;margin:0 auto}
.signin .panel{padding:24px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.field input{width:100%}
.err{font-size:13px;color:var(--bad);margin:0 0 10px;border-left:3px solid var(--bad);padding-left:10px}
.hr{display:flex;align-items:center;gap:14px;margin:24px 0;color:var(--ink-faint);font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.hr::before,.hr::after{content:"";flex:1;height:1px;background:var(--rule)}
.pubbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 15px;border:1px solid var(--brass);border-left:3px solid var(--brass);background:var(--brass-wash);border-radius:var(--r);margin-bottom:16px;font-size:13px;color:var(--brass)}
.pubbar b{font-weight:600}
.pubbar .btn:not(.primary){color:var(--ink)}
.pubbar.busy{border-color:var(--rule);border-left-color:var(--ink-faint);background:var(--surface-2);color:var(--ink-soft)}
.pubbar.fail{border-color:var(--bad);border-left-color:var(--bad);background:var(--bad-wash);color:var(--bad)}
.pubbar code{font-family:var(--mono);font-size:12px}
.steps{margin:0 0 15px;padding-left:20px;font-size:13.5px;color:var(--ink-soft);line-height:1.7}
.steps li{margin-bottom:5px}
.steps code{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--rule-soft);border-radius:var(--r);padding:1px 5px}

/* ---- folders: drawer dividers in the rail ---- */
#newdeckslot{display:flex;gap:2px}
.fgroup{list-style:none;margin-bottom:3px}
.folder{display:flex;align-items:stretch;border-radius:var(--r)}
.folder:hover{background:var(--surface-2)}
.folder.on{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--bad)}
.fold-tog{width:24px;display:grid;place-items:center;color:var(--ink-faint);flex:none}
.fold-tog:hover{color:var(--ink)}
.fold-tog svg{transition:transform var(--t-quick) var(--ease)}
.fold-tog[aria-expanded="true"] svg{transform:rotate(90deg)}
.fold-nm{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:9px 10px 9px 0;text-align:left;font-weight:600;color:var(--ink)}
.fold-nm svg{color:var(--ink-soft);flex:none}
.fold-nm .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold-nm .ct{font-family:var(--mono);font-size:11px;color:var(--ink-faint);font-weight:400}
/* Height is animated from its measured value rather than with a 0fr/1fr grid, which
   does not interpolate everywhere, or a guessed max-height, which eases wrongly. */
.fwrap{overflow:hidden;height:0;transition:height var(--t-move) var(--ease);margin:0}
.fdecks{list-style:none;margin:0 0 0 16px;padding:0 0 0 5px;border-left:1px solid var(--rule);display:flex;flex-direction:column;gap:1px}
.fdecks .deck-btn{padding:7px 9px;font-size:14px}
.fdecks .fdecks{margin-left:12px}
.fdecks .fold-nm{font-weight:500;font-size:14px;padding-top:7px;padding-bottom:7px}
.frow-f{display:flex;gap:11px;align-items:flex-start;min-width:0}
.frow-f svg{color:var(--ink-soft);margin-top:4px;flex:none}
.fempty{padding:6px 9px;font-size:12.5px;color:var(--ink-faint);font-style:italic}
.loose{padding:12px 10px 4px}
.crumb{color:var(--ink-soft);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.crumb:hover{color:var(--ink);text-decoration-color:var(--ink)}
.flist{border:1px solid var(--rule);background:var(--surface);margin-bottom:18px;border-radius:var(--r-lg);overflow:hidden}
.frow{width:100%;display:grid;grid-template-columns:1fr 150px 70px;gap:20px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--rule-soft);text-align:left}
.frow:last-child{border-bottom:0}
.frow:hover{background:var(--surface-2)}
.frow .t{font-family:var(--read);font-size:19px;font-weight:600;letter-spacing:-.01em;display:block;line-height:1.25}
.frow .s{font-size:12.5px;color:var(--ink-soft);display:block;margin-top:2px}
.frow .ct{font-family:var(--mono);font-size:12px;color:var(--ink-soft);text-align:right}
.fpick{display:inline-flex;align-items:center;gap:7px;color:var(--ink-soft);font-size:13px}
.deskdesc{font-family:var(--read);font-size:17px;line-height:1.45;color:var(--ink-soft);margin-top:6px;max-width:62ch}
.descin{display:block;width:100%;max-width:560px;margin-top:8px;font-family:var(--read);font-size:16px}
.fpick select{font-size:13px;padding:5px 8px}
.editmeta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px}
.foldfoot{display:flex;justify-content:flex-end}

/* ---- learn: the three piles, drawn like a ledger ---- */
.learn{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:20px 22px;border:1px solid var(--ink);background:var(--surface);box-shadow:var(--lift);margin-bottom:18px;border-radius:var(--r-lg)}
.learn h3{font-family:var(--read);font-size:23px;font-weight:600;display:flex;align-items:center;gap:9px;margin-bottom:4px;letter-spacing:-.015em}
.learn h3 svg{color:var(--bad)}
.learn p{margin:0 0 14px;font-size:13.5px;color:var(--ink-soft);max-width:62ch;line-height:1.55}
.learn > .btn{padding:11px 24px;font-size:15px}
.lbar{display:flex;height:9px;border:1px solid var(--ink);background:var(--surface);border-radius:99px;overflow:hidden}
.lbar i{display:block;height:100%;transition:width .36s var(--ease)}
.lbar .lm-m,.sw.m{background:var(--ink)}
.lbar .lm-l,.sw.l{background:repeating-linear-gradient(135deg,var(--brass) 0 2px,transparent 2px 5px)}
.sw.f{background:var(--surface)}
.llegend{display:flex;gap:18px;flex-wrap:wrap;margin-top:7px;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.sw{display:inline-block;width:10px;height:10px;border:1px solid var(--ink);margin-right:6px;vertical-align:-1px}
.lmeter{margin-bottom:18px}
.result .lmeter{max-width:440px;margin:4px auto 0}
.result .llegend{justify-content:center}
.minibar{display:flex;height:7px;border:1px solid var(--rule);background:var(--surface);border-radius:99px;overflow:hidden}
.minibar i{display:block;height:100%}
.kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--rule);padding:2px 7px}
.linkbtn{font-size:13px;color:var(--ink-soft);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px;padding:6px 2px}
.linkbtn:hover{color:var(--ink);text-decoration-color:var(--ink)}
.missed.lround li{grid-template-columns:minmax(120px,1fr) 1.4fr 92px}
.st{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;text-align:right;white-space:nowrap}
.st.m{color:var(--good)}
.st.l{color:var(--brass)}
.st.f{color:var(--bad)}

/* ---- vocab + conjugation decks ---- */
.rows.vocab .rowhead,.rows.vocab .row{grid-template-columns:32px 1fr 130px 1.5fr 32px}
.row select.pos{border:1px solid transparent;border-radius:var(--r);background:transparent;padding:7px 6px;font-size:13px;width:100%;color:var(--ink-soft)}
.row select.pos:hover{border-color:var(--rule)}
.row select.pos:focus{border-color:var(--ink);outline:none;background:var(--surface-2)}
.postag{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--rule);padding:2px 7px;white-space:nowrap}
.prompt .postag{display:inline-block;margin-bottom:12px}
.kindbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.conjhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.conjhead .tensein{width:190px}
.persons{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.persons input{width:124px;font-size:13px;padding:5px 8px}
.pdel{color:var(--ink-faint);padding:5px;border-radius:var(--r);line-height:0}
.pdel:hover{color:var(--bad);background:var(--bad-wash)}
.conjcard{border:1px solid var(--rule);background:var(--surface);margin-bottom:-1px;border-radius:var(--r);overflow:hidden}
.conjcard .ch{display:grid;grid-template-columns:32px 1fr 1fr 32px;gap:10px;padding:9px 12px;align-items:center;border-bottom:1px solid var(--rule-soft);background:var(--surface-2)}
.conjcard .ch .n{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.conjcard .ch input{width:100%}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(192px,1fr));gap:0}
.cell{display:flex;align-items:center;gap:9px;padding:8px 12px;border-right:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft)}
.cell label{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);width:84px;flex:none;overflow:hidden;text-overflow:ellipsis}
.cell input{flex:1;min-width:0;font-family:var(--read);font-size:15px}
.ctable{border:1px solid var(--ink);background:var(--surface);box-shadow:var(--lift);margin-bottom:16px;border-radius:var(--r-lg);overflow:hidden}
.ctable .cth{padding:18px 20px 14px;border-bottom:1px solid var(--rule)}
.ctable .cth h3{font-family:var(--read);font-size:27px;font-weight:600;letter-spacing:-.02em}
.ctable .cth .m{font-size:13.5px;color:var(--ink-soft);margin-top:3px}
.crow{display:grid;grid-template-columns:150px 1fr;gap:0;border-bottom:1px solid var(--rule-soft);align-items:stretch}
.crow:last-child{border-bottom:0}
.crow .pl{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);padding:13px 14px;background:var(--surface-2);border-right:1px solid var(--rule-soft);display:flex;align-items:center}
.crow .pv{padding:7px 10px;display:flex;align-items:center;gap:10px;min-width:0}
.crow input{width:100%;max-width:300px;font-family:var(--read);font-size:17px;padding:7px 10px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface)}
.crow input:focus{border-color:var(--ink);outline:none}
.crow.ok{background:var(--good-wash)}
.crow.no{background:var(--bad-wash)}
.crow .mark{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.crow.ok .mark{color:var(--good)}
.crow.no .mark{color:var(--bad)}
.crow .right{font-family:var(--read);font-size:16px;color:var(--bad)}
.crow .given{font-family:var(--read);font-size:17px;padding:7px 0}
/* The ordering board is the conjugation table with the row labels turned into
   positions, so the two read as the same piece of furniture. */
.ordboard .crow{grid-template-columns:54px 1fr}
.ordboard .pl{justify-content:center;font-size:12px}
.ordboard .slot{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:var(--r);font-family:var(--read);font-size:16px;line-height:1.35}
.ordboard button.slot:hover{background:var(--surface-2)}
/* Its own class, not .empty — that one is the big "nothing here" panel, and a slot
   that borrowed it borrowed fifty pixels of padding with it. The dashed outline is
   worth keeping on purpose: it reads as a place something goes. */
.ordboard .slot.blank{color:var(--ink-faint);border:1px dashed var(--rule);border-radius:var(--r)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.pool .chip{padding:10px 14px;border:1px solid var(--ink);border-radius:var(--r-lg);background:var(--surface);
  box-shadow:var(--lift);font-family:var(--read);font-size:15.5px;line-height:1.3;text-align:left;max-width:100%}
.pool .chip:hover{background:var(--surface-2)}
.pool .chip:active{transform:translateY(1px)}

/* ---- the way in to the editor's own page ----
   Fixed to the corner rather than put in a header, because there isn't one: every
   view draws its own heading row. The heading row is given a gutter to match, or
   the button lands on top of that view's own buttons on a middling screen. */
.deskbtn{position:fixed;top:14px;right:16px;z-index:46;display:inline-flex;align-items:center;gap:7px;
  padding:9px 14px;border:1px solid var(--ink);border-radius:999px;background:var(--surface);
  font-weight:500;font-size:13.5px;box-shadow:var(--lift);
  transition:background var(--t-tap),transform var(--t-tap) var(--ease)}
.deskbtn:hover{background:var(--surface-2)}
.deskbtn:active{transform:scale(.97)}
/* Every bar that runs along the top of a view and puts something in its right-hand
   corner, not just .stage-head — the home page has its own, and the sign-in corner in
   it was landing underneath the button at around 980px wide. */
body.editing .stage-head,body.editing .startbar,body.editing .testbar{padding-right:152px}
@media (max-width:700px){
  /* Just the mark on a phone; the gutter shrinks with it. */
  .deskbtn .dlabel{display:none}
  .deskbtn{padding:10px;gap:0}
  body.editing .stage-head,body.editing .startbar,body.editing .testbar{padding-right:54px}
}

/* ---- the editor's page ---- */
.deskwarn{display:flex;flex-direction:column;gap:0;border:1px solid var(--rule);
  border-radius:var(--r-lg);background:var(--surface);overflow:hidden;margin-bottom:22px}
.deskwarn button{display:flex;align-items:center;gap:13px;padding:13px 16px;text-align:left;
  border-bottom:1px solid var(--rule-soft);width:100%;transition:background var(--t-tap)}
.deskwarn button:last-child{border-bottom:0}
.deskwarn button:hover{background:var(--surface-2)}
.deskwarn .n{font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums;
  min-width:2.2ch;text-align:right;flex:none}
.deskwarn .w{flex:1;min-width:0;font-size:14px;line-height:1.4}
.deskwarn .w b{font-weight:600}
.deskwarn .go{color:var(--ink-faint);flex:none}
.deskwarn .bad .n{color:var(--bad)}
.deskwarn .warn .n{color:var(--brass)}
.deskwarn .ok .n{color:var(--good)}
.actgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:10px}
.actgrid button{border:1px solid var(--rule);border-radius:var(--r-lg);background:var(--surface);
  padding:14px 15px;text-align:left;display:flex;flex-direction:column;gap:4px;
  transition:border-color var(--t-quick),background var(--t-quick),transform var(--t-tap) var(--ease)}
.actgrid button:hover{border-color:var(--ink);background:var(--surface-2)}
.actgrid button:active{transform:scale(.985)}
.actgrid .t{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px}
.actgrid .t svg{color:var(--bad)}
.actgrid .d{font-size:12.5px;color:var(--ink-soft);line-height:1.45}

/* ---- announcements ----
   A card over the page, once, with the page itself dimmed behind it. Deliberately
   not a banner: the point of these is the things that get missed. */
.notewrap{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(0,0,0,.5);animation:fade var(--t-move) ease}
.notewrap.out{opacity:0;transition:opacity var(--t-quick) ease}
.notecard{background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-lg);
  box-shadow:var(--lift);padding:26px 28px;max-width:470px;width:100%;max-height:80vh;overflow:auto;
  animation:pop var(--t-move) var(--ease)}
.notecard h3{font-family:var(--read);font-size:23px;font-weight:600;letter-spacing:-.015em;margin:6px 0 0}
.notebody{font-family:var(--read);font-size:16px;line-height:1.6;color:var(--ink-soft);
  margin-top:11px;white-space:pre-line}
@media (max-width:560px){ .notewrap{padding:16px} .notecard{padding:22px 20px} }

/* the editor's side of them */
.noterow{border:1px solid var(--rule);border-radius:var(--r-lg);background:var(--surface);
  padding:15px 16px;margin-bottom:12px;display:flex;flex-direction:column;gap:9px}
.noterow.off{opacity:.55}
.noterow .when{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.noterow .when label{font-family:var(--mono);font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-faint);display:flex;align-items:center;gap:6px}
.noterow textarea{width:100%;min-height:76px;border:1px solid var(--rule);border-radius:var(--r);
  padding:9px 11px;background:var(--surface-2);font-family:var(--read);font-size:15px;
  line-height:1.55;resize:vertical}
.noterow textarea:focus,.noterow input:focus{border-color:var(--ink);outline:none}
.notefoot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* ---- sidebar controls ---- */
#railctl{display:flex;align-items:center;gap:4px;margin-left:auto}
/* An editor gets two more buttons up here, and a label plus four controls will not
   fit across 262px — crushing them on to one row is what sliced the last icon in
   half at the edge of the sidebar. They take the next line instead, whole, lined
   up with the deck list beneath them. A student has none of this and sees one row. */
#newdeckslot{flex-basis:100%}
#newdeckslot:empty{display:none}
#newdeckslot .btn.sm{padding:5px 8px;gap:5px}
.icbtn{width:26px;height:26px;display:grid;place-items:center;border-radius:var(--r);color:var(--ink-faint);flex:none;transition:background var(--t-tap),color var(--t-tap)}
.icbtn:hover{background:var(--surface-2);color:var(--ink)}
/* the rail leaves the grid entirely, so the stage must become the only column —
   with "0 1fr" it lands in the zero-width one and the page collapses */
/* The rail stays a grid item and its column shrinks to nothing, so the two can be
   animated. Taking it out of the grid instead would drop the stage into column one. */
.app.shut{grid-template-columns:0 1fr}
/* With the rail gone there is nothing left for the page to sit against, so it stops
   hugging the left edge and centres in what it now has. The only thing that still has
   to be kept clear is the reopen tab, which is fixed to the left edge: past 1240 the
   centring already leaves more room than the tab needs, and under it the old padding
   does the job. */
.app.shut .stage{margin-inline:auto;padding-left:34px}
@media (min-width:861px) and (max-width:1240px){ .app.shut .stage{padding-left:92px;padding-right:92px} }
/* Stops at 861 because below that the rail is a drawer over the page, not a
   column beside it, and the tab goes with it. */
.app.shut .rail{transform:translateX(-100%);border-right-color:transparent}
/* Always present so it can slide; pushed out of the way and made unclickable instead
   of being display:none, which cannot be transitioned. */
.reopen{position:fixed;left:0;top:14px;z-index:40;display:inline-flex;align-items:center;gap:7px;padding:9px 13px 9px 11px;
  border:1px solid var(--rule);border-left:0;border-radius:0 var(--r-lg) var(--r-lg) 0;background:var(--surface);box-shadow:var(--lift);font-size:13px;font-weight:500;
  transform:translateX(-101%);opacity:0;pointer-events:none;transition:transform var(--t-move) var(--ease),opacity var(--t-quick) ease}
.reopen:hover{background:var(--surface-2)}
.app.shut + .reopen{transform:none;opacity:1;pointer-events:auto}
/* Only ever drawn behind the drawer, which is a phone-sized idea. */
.scrim{display:none}

/* ---- what's coming up ---- */
.soon{border-top:1px solid var(--rule);padding:11px 14px 12px}
.soon .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.soon .hd .eyebrow{white-space:nowrap}
.soon ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
/* Named rather than "every button in here", which was also stretching the
   little calendar icon beside the heading across the whole sidebar. */
.soon li button{width:100%;display:flex;align-items:baseline;gap:8px;padding:5px 7px;border-radius:var(--r);text-align:left;color:var(--ink-soft)}
.soon li button:hover{background:var(--surface-2);color:var(--ink)}
.soon .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.soon .when{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;white-space:nowrap}
.when.today{color:var(--bad);font-weight:600}
.when.soon{color:var(--brass)}
.when.past{color:var(--ink-faint)}
.soon .none{font-size:12px;color:var(--ink-faint);padding:2px 7px 0;font-style:italic}

/* ---- calendar ---- */
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.calmonth{font-family:var(--read);font-size:22px;min-width:12ch}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden;background:var(--rule-soft);gap:1px}
.caldow{background:var(--surface-2);padding:8px 10px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);text-align:center}
.calday{background:var(--surface);min-height:96px;padding:7px 8px;display:flex;flex-direction:column;gap:4px}
.calday.off{background:var(--surface-2);opacity:.5}
.calday.now{box-shadow:inset 0 0 0 2px var(--bad)}
.calday .dn{font-family:var(--mono);font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.calday.now .dn{color:var(--bad);font-weight:600}
.calpill{display:block;width:100%;text-align:left;font-size:11.5px;line-height:1.3;padding:4px 6px;border-radius:var(--r);background:var(--accent-wash);color:var(--ink);border-left:3px solid var(--bad);overflow:hidden;text-overflow:ellipsis}
.calpill:hover{background:var(--surface-2)}
.calpill.done{opacity:.45;border-left-color:var(--ink-faint)}
.callist{margin-top:20px}
.quizfield{display:inline-flex;align-items:center;gap:7px;color:var(--ink-soft);font-size:13px}
.quizfield input{font-size:13px;padding:5px 8px;width:150px}
.duetag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--rule);border-radius:99px;padding:3px 10px}
.duetag.today{border-color:var(--bad);color:var(--bad)}
.duetag.soon{border-color:var(--brass);color:var(--brass)}
.duetag.past{color:var(--ink-faint)}

/* ---- print sheet ---- */
.sheet{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);padding:28px 30px}
.sheet h3{font-family:var(--read);font-size:24px;margin-bottom:3px}
.sheet .meta{font-size:13px;color:var(--ink-soft);margin-bottom:18px}
.sheet section{margin-bottom:22px;break-inside:auto}
.sheet section > h4{font-family:var(--read);font-size:17px;font-weight:600;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:grid;grid-template-columns:minmax(130px,1fr) 2fr;gap:18px;padding:5px 0;border-bottom:1px solid var(--rule-soft);font-size:14px;break-inside:avoid}
.plist .t{font-weight:600}
.plist .d{font-family:var(--read);font-size:15px;color:var(--ink-soft);white-space:pre-line}
.plist .pos{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--ink-faint)}
@media print{
  .rail,.reopen,.deskbtn,.stage-head .rowctl,.opts,.toast,.pubbar,.editbar{display:none!important}
  .app{display:block}
  .stage{padding:0;max-width:none}
  .sheet{border:0;padding:0;border-radius:0;background:#fff;color:#000}
  .stage-head{border-bottom:2px solid #000;margin-bottom:14px}
  .plist li{border-bottom:1px solid #ccc}
  body{background:#fff}
  a[href]:after{content:""}
}

/* ---- simulated test ---- */
.setup{display:grid;gap:0;border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden;margin-bottom:18px;background:var(--surface)}
.setup .srow{display:grid;grid-template-columns:168px 1fr;gap:18px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--rule-soft)}
.setup .srow:last-child{border-bottom:0}
.setup .sl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.setup .sv{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-soft);border:1px solid var(--rule);border-radius:99px;padding:6px 13px}
.chk:hover{border-color:var(--ink);color:var(--ink)}
.chk input{margin:0}
.testbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.tclock{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;border:1px solid var(--rule);border-radius:99px;padding:5px 14px}
.tclock.low{border-color:var(--bad);color:var(--bad)}
.qnum{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.review{list-style:none;margin:18px 0 0;padding:0;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;text-align:left}
.review li{padding:11px 14px;border-bottom:1px solid var(--rule-soft);background:var(--surface);display:grid;grid-template-columns:22px 1fr;gap:12px;font-size:14px}
.review li:last-child{border-bottom:0}
.review .mk{font-family:var(--mono);font-size:12px}
.review li.ok .mk{color:var(--good)}
.review li.no .mk{color:var(--bad)}
.review .q{font-weight:600;margin-bottom:3px}
.review .a{font-family:var(--read);font-size:15px;color:var(--ink-soft)}
.review .a b{color:var(--bad);font-weight:600}

/* ---- accounts ---- */
.acct{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-wash);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--ink);flex:none;border:1px solid var(--rule);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.sm{width:20px;height:20px;font-size:9px}
.avatar.md{width:26px;height:26px;font-size:11px}
.sender{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);margin-top:6px}
.gbtn{display:inline-flex;align-items:center;gap:9px;padding:10px 18px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);font-weight:500;font-size:14.5px}
.gbtn:hover{border-color:var(--ink);background:var(--surface-2)}
.gbtn svg{flex:none}
.cloud{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--ink-faint)}
.sublist{border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.subrow{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--rule-soft)}
.subrow:last-child{border-bottom:0}
.subrow .t{font-family:var(--read);font-size:18px;font-weight:600}
.subrow .m{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.subrow .note{font-family:var(--read);font-size:14px;color:var(--ink-soft);margin-top:5px;padding-left:10px;border-left:2px solid var(--rule)}
.stat-pill{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--rule);border-radius:99px;padding:2px 9px;color:var(--ink-soft)}
.stat-pill.approved{border-color:var(--good);color:var(--good)}
.stat-pill.declined{border-color:var(--bad);color:var(--bad)}

/* ---- theme picker ---- */
.themes{display:flex;gap:9px;flex-wrap:wrap}
.swatch{display:flex;flex-direction:column;align-items:stretch;gap:5px;width:78px;padding:0;background:none}
.swatch .chip{height:40px;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;display:flex}
.swatch .chip i{display:block;flex:1}
.swatch .chip .b{flex:0 0 34%}
.swatch span{font-size:11.5px;color:var(--ink-soft);text-align:center}
.swatch:hover .chip{border-color:var(--ink)}
.swatch[aria-pressed="true"] .chip{box-shadow:0 0 0 2px var(--ink);border-color:var(--ink)}
.swatch[aria-pressed="true"] span{color:var(--ink);font-weight:600}
/* the one you make yourself */
.swatch.mk .chip{border-style:dashed;align-items:center;justify-content:center;background:var(--surface)}
.swatch.mk .chip b{font-size:19px;font-weight:400;color:var(--ink-faint);line-height:1}
.tbuild{margin-top:17px;padding-top:15px;border-top:1px solid var(--rule-soft)}
.tbuild .picks{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:13px}
.tbuild .pick{display:flex;flex-direction:column;gap:6px;width:124px}
.tbuild .pick label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.tbuild .pair{display:flex;gap:6px;align-items:center}
.tbuild input[type=color]{width:36px;height:32px;padding:0;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);cursor:pointer}
.tbuild input[type=text]{width:82px;font-family:var(--mono);font-size:12.5px;padding:6px 7px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface)}
.tbuild .hint{font-size:11.5px;color:var(--ink-faint)}
.tbuild .note{font-size:12.5px;color:var(--ink-soft);margin:0}
.tbuild .note.warn{color:var(--bad);font-weight:600}
.tbuild .code{display:flex;gap:7px;align-items:center;margin-top:14px;flex-wrap:wrap}
.tbuild .code input{flex:1;min-width:186px;font-family:var(--mono);font-size:12.5px;padding:7px 9px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface)}

/* ---- people ---- */
.people{border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);margin-bottom:18px}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule-soft)}
.prow:last-child{border-bottom:0}
.prow .nm{font-weight:600;font-size:14.5px}
.prow .em{font-size:12.5px;color:var(--ink-soft)}
.prow select{font-size:13px;padding:5px 9px}
.prow .you{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);margin-left:7px}
.invited{opacity:.75}
.invited .nm{font-weight:500;font-style:italic}

/* ---- review ---- */
.revbtn{width:100%;display:flex;align-items:center;gap:8px;padding:8px 9px;margin-top:7px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);font-size:13px;font-weight:500;text-align:left}
.revbtn:hover{border-color:var(--ink);background:var(--surface-2)}
.revbtn .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.fromdeck{font-size:12px;color:var(--ink-faint);margin-top:10px}

/* ---- home ---- */
.startbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px}
.signincorner{display:inline-flex;align-items:center;gap:9px;padding:7px 14px 7px 8px;border:1px solid var(--rule);border-radius:99px;background:var(--surface);font-size:13.5px;font-weight:500}
.signincorner:hover{border-color:var(--ink);background:var(--surface-2)}
.hero{max-width:60ch}
.hero h1{font-family:var(--read);font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1.05;margin-bottom:12px}
.hero h1 em{font-style:italic;color:var(--bad)}
.hero p{font-size:16.5px;line-height:1.6;color:var(--ink-soft);margin:0 0 14px}
.hero .lede{font-size:18.5px;color:var(--ink)}
.herobtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0;border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden;margin-top:34px;background:var(--surface)}
.feat{padding:16px 18px;box-shadow:0 0 0 .5px var(--rule)}
.feat h4{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:5px}
.feat h4 svg{color:var(--bad)}
.feat p{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin:0}
.dashrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:26px}
.bigcard{border:1px solid var(--ink);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--lift);padding:18px 20px}
.bigcard h3{font-family:var(--read);font-size:20px;margin-bottom:3px;display:flex;align-items:center;gap:9px}
.bigcard h3 svg{color:var(--bad)}
.bigcard p{font-size:13px;color:var(--ink-soft);margin:0 0 14px;line-height:1.5}
.duelist{list-style:none;margin:0;padding:0}
.duelist li{border-bottom:1px solid var(--rule-soft)}
.duelist li:last-child{border-bottom:0}
.duelist button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 2px;text-align:left}
.duelist button:hover .t{text-decoration:underline}
.duelist .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;font-size:14px}
.deckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:12px}
.dcard{border:1px solid var(--rule);border-radius:var(--r-lg);background:var(--surface);padding:14px 15px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:border-color var(--t-quick),background var(--t-quick),transform var(--t-tap) var(--ease)}
.dcard:active{transform:scale(.985)}
.dcard:hover{border-color:var(--ink);background:var(--surface-2)}
.dcard .nm{font-weight:600;font-size:15px;line-height:1.25}
.dcard .meta{font-size:12px;color:var(--ink-faint)}
.dcard .foot{display:flex;align-items:center;gap:8px;margin-top:auto}
@media (max-width:860px){ .hero h1{font-size:33px} .startbar{flex-direction:column;gap:14px} }

/* Shown only where there is no mouse, in place of the keyboard hints. */
.tiphint{display:none}
@media (hover:none) and (pointer:coarse){ .kbhint{display:none} .tiphint{display:inline} }

@media (max-width:860px){
  /* The deck list stops being a column and becomes a drawer over the page, so
     the app opens on the deck you came to read rather than on a list of them. */
  .app,.app.shut{grid-template-columns:1fr}
  .app.shut .stage{padding-left:18px}
  .rail{position:fixed;top:0;left:0;bottom:0;height:auto;width:min(84vw,310px);z-index:60;
    border-right:1px solid var(--rule);box-shadow:10px 0 28px rgba(0,0,0,.22);overscroll-behavior:contain;
    transition:transform .26s var(--ease),border-color var(--t-move) ease,visibility 0s}
  /* Hidden rather than merely slid away, so the Tab key and a screen reader
     don't wander off the side of the screen into a drawer nobody opened. */
  .app.shut .rail{transform:translateX(-100%);border-right-color:var(--rule);
    visibility:hidden;transition:transform var(--t-move) var(--ease-io),visibility 0s linear var(--t-move)}
  .decks{max-height:none}
  /* Dimming behind the drawer. Always there so it can fade; untouchable when shut. */
  .scrim{display:block;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);transition:opacity var(--t-move) ease}
  .app.shut ~ .scrim{opacity:0;pointer-events:none}
  /* "Decks" goes where a thumb already is, and is there in every view. */
  .reopen{top:auto;bottom:calc(16px + env(safe-area-inset-bottom));left:14px;z-index:45;
    border:1px solid var(--ink);border-radius:999px;padding:11px 18px;font-size:14px;
    transform:none;opacity:1;pointer-events:auto}
  .app:not(.shut) + .reopen{transform:translateY(170%);opacity:0;pointer-events:none;visibility:hidden;transition:transform var(--t-move) var(--ease-io),opacity var(--t-quick) ease,visibility 0s linear var(--t-move)}
  .stage{padding:22px 18px 94px}
  .judge .btn{flex:1;min-width:0}
  /* Clear of the Decks button, and above the drawer rather than under it. */
  .toast{left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));transform:none;text-align:center;z-index:70}
  .stage-head h2{font-size:25px}
  .facetext{font-size:23px}
  .face{padding:52px 24px 42px}
  .row,.rowhead{grid-template-columns:24px 1fr 40px}
  .row .def-cell{grid-column:2/4}
  /* Delete, or the report flag: beside the term, not stranded on a line of its
     own below the definition, which is where plain grid flow was putting it. */
  .row > *:last-child{grid-column:3;grid-row:1}
  .row .n,.row textarea.term{grid-row:1}
  .rowhead .h-def{display:none}
  .missed li{grid-template-columns:1fr}
  .stat{min-width:50%;flex:none}
  .summary .note{display:none}
  .frow{grid-template-columns:1fr 60px}
  .frow .minibar{display:none}
  .learn{grid-template-columns:1fr}
  .missed.lround li{grid-template-columns:1fr}
  .st{text-align:left}
  .rows.vocab .rowhead,.rows.vocab .row,
  .rows.ord .rowhead,.rows.ord .row{grid-template-columns:24px 1fr 40px}
  .rows.ord .rowmv{grid-column:2;justify-self:end;padding-top:0}
  .rows.vocab .row select.pos{grid-column:2/4;width:auto}
  .conjcard .ch{grid-template-columns:24px 1fr 40px}
  .conjcard .ch input:nth-of-type(2){grid-column:2/4}
  .crow{grid-template-columns:104px 1fr}
  .crow .pl{padding:11px 10px}
  .setup .srow{grid-template-columns:1fr;gap:8px}
  .calgrid{grid-template-columns:repeat(7,1fr);font-size:11px}
  .calday{min-height:62px;padding:4px 3px}
  .calpill{font-size:10px;padding:2px 4px;border-left-width:2px}
  .caldow{padding:6px 2px;font-size:9px}
}

@media (max-width:560px){
  /* The month, two arrows and Today will not sit on one line of a small phone. */
  .calhead{flex-wrap:wrap;gap:8px}
  .calmonth{font-size:19px;min-width:0;white-space:nowrap}
  /* A seventh of a phone's width holds about five letters, so the month shows a
     bar you can tap and the list underneath carries the names. */
  .calday{min-height:58px;padding:5px 4px;gap:3px}
  .calday .dn{font-size:12px}
  .calpill{font-size:0;line-height:0;padding:0;min-height:17px;flex:1;border-radius:3px;
    background:var(--bad);border-left:0;opacity:.85}
  .calpill.done{background:var(--ink-faint);opacity:.4}
  .caldow{padding:6px 1px;font-size:9px}
}

/* ---- anything without a real mouse ----
   Scoped to pointer:coarse rather than to a width, so a laptop with a
   touchscreen keeps its small, dense controls and a phone held sideways
   still gets the big ones. */
@media (hover:none) and (pointer:coarse){
  /* Under 16px iOS Safari zooms the page in when a field takes focus, and
     never zooms back out again. Everything typed into gets dragged up to it. */
  input,select,textarea,input.text,.row textarea,.row textarea.def,.cell input,
  .persons input,.quizfield input,.fpick select,.prow select,.tbuild .code input{font-size:16px}
  button,a{touch-action:manipulation}
  .seg button{padding:10px 14px;font-size:14px}
  .btn{padding:10px 15px}
  .btn.sm{padding:9px 12px;font-size:13.5px}
  .icbtn{width:38px;height:38px}
  .fold-tog{width:40px}
  .crumb{display:inline-block;padding:5px 0}
  .linkbtn{padding:9px 3px}
  .choice{padding:15px}
  .face .star{padding:11px;top:4px;right:8px}
  .calpill{min-height:19px}
}

/* ---- two meanings ----
   A word can mean two things ("gall": nerve, and bitterness), and on a vocabulary
   deck the second meaning can be a different part of speech ("bank": the land by a
   river, or to rely on something). It stays one card — asked once, mastered once —
   and both meanings are shown together wherever one would have been. Where the
   part of speech is the question, either answer counts, and both are offered. */
function defs(c){
  var out = [];
  if(((c && c.def) || "").trim()) out.push(c.def);
  if(((c && c.def2) || "").trim()) out.push(c.def2);
  return out;
}
/* ---- the word in a sentence ----
   A definition drill never practises the thing a quiz usually asks for: the word doing
   its job. One more side on the card covers it, and it pays for itself twice — shown
   under the answer when the answer is shown, and blanked out to make a question of its
   own.

  if(m) return m[1].trim() ? {text: s.replace(m[0], "______"), want: m[1].trim()} : null;
  var t = String((c && c.term) || "").trim();
  if(!t) return null;
  var re = new RegExp("\\b" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i");
  if(re.test(s)) return {text: s.replace(re, "______"), want: t};

  // a plain search rather than being told it isn't there.
  var i = s.toLowerCase().indexOf(t.toLowerCase());

function norm(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9\s]/g," ").replace(/\b(a|an|the)\b/g," ").replace(/\s+/g," ").trim();
}
function lev(a,b){
  if(a === b) return 0;
  if(!a.length) return b.length; if(!b.length) return a.length;
  var prev = [], cur = [], i, j;
  for(j=0;j<=b.length;j++) prev[j] = j;
  for(i=1;i<=a.length;i++){
    cur[0] = i;
    for(j=1;j<=b.length;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    for(j=0;j<=b.length;j++) prev[j] = cur[j];
  }
  return prev[b.length];
}
// -> "exact" | "near" | "no"
function grade(given, target){
  var g = norm(given); if(!g) return "no";
  var alts = String(target||"").split("/").map(norm).filter(Boolean);
  if(!alts.length) alts = [norm(target)];
  var best = "no";
  alts.forEach(function(t){
    if(!t) return;
    if(g === t){ best = "exact"; return; }
    if(best === "exact") return;
    var tol = Math.max(1, Math.floor(t.length / 8));
    if(lev(g, t) <= tol) best = "near";
  });
  return best;
}

/* ---------------- two editors at the same time ----------------
   This used to quietly lose work. Publishing fetched whatever sha the repo was on
   and wrote the entire local store over it, so if someone else had published while
   you were editing, their decks went and nothing on screen said anything had.

   A publish now looks at three versions — the decks your draft started from (the
   base), your draft, and what is in the repo at this second — and works out what
   each side did, rather than who happened to go last. Anything only one side
   touched is kept. Where you both changed the same field, yours wins and you are
   told which ones to look at. Nothing is deleted merely for being absent: a deck
   you deleted stays deleted only if nobody else edited it in the meantime, which
   is the asymmetry that matters — a wrongly kept deck is a nuisance, a wrongly
   deleted one is somebody's evening.

function sameJSON(a, b){
  return JSON.stringify(a === undefined ? null : a) === JSON.stringify(b === undefined ? null : b);

function mergeFields(base, mine, theirs, keys, out, log, label){
  var clash = false;
