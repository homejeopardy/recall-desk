<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quizletish</title>
<meta name="description" content="Term drills for a law course — flashcards, multiple choice, typed recall, and timed matching.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='21' fill='%23FBF8F1' stroke='%2314110D' stroke-width='2.5'/%3E%3Cpath d='M3 13h26' stroke='%23A8321F' stroke-width='2.5'/%3E%3Cpath d='M9 19h14M9 23h9' stroke='%2314110D' stroke-width='2'/%3E%3C/svg%3E">
<style>[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,600&display=swap">
<style>
/* Quizletish — a card-catalogue drawer, not a dashboard.
   Warm manila stock, black ink, one stamped red. Rules instead of shadows;
   where a shadow appears it is a hard offset, the way a stacked card sits. */
:root{
  --paper:#EFE9DE;
  --surface:#FBF8F1;
  --surface-2:#E6DFD1;
  --ink:#14110D;
  --ink-soft:#5B5346;
  --ink-faint:#8E8574;
  --rule:#C6BCA8;
  --rule-soft:#DCD3C2;
  --accent:#14110D;          /* the accent IS the ink — fills, not tints */
  --accent-ink:#FBF8F1;
  --accent-wash:#E2DACA;
  --brass:#8A6714;
  --brass-wash:#F0E4C6;
  --good:#3D5C36;
  --good-wash:#DFE7D7;
  --bad:#A8321F;
  --bad-wash:#F5DFD9;
  --ui:"Libre Franklin","Helvetica Neue",Helvetica,Arial,sans-serif;
  --read:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --rail:262px;
  --lift:3px 3px 0 var(--rule);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#151310;
    --surface:#1E1A15;
    --surface-2:#272219;
    --ink:#EDE6D8;
    --ink-soft:#A79C89;
    --ink-faint:#7A7161;
    --rule:#3A3429;
    --rule-soft:#2B261E;
    --accent:#EDE6D8;
    --accent-ink:#151310;
    --accent-wash:#332D23;
    --brass:#D2A94A;
    --brass-wash:#2E2718;
    --good:#86A874;
    --good-wash:#1F2819;
    --bad:#DC7159;
    --bad-wash:#301D18;
    --lift:3px 3px 0 var(--rule);
  }
}
:root[data-theme="dark"]{
  --paper:#151310;
  --surface:#1E1A15;
  --surface-2:#272219;
  --ink:#EDE6D8;
  --ink-soft:#A79C89;
  --ink-faint:#7A7161;
  --rule:#3A3429;
  --rule-soft:#2B261E;
  --accent:#EDE6D8;
  --accent-ink:#151310;
  --accent-wash:#332D23;
  --brass:#D2A94A;
  --brass-wash:#2E2718;
  --good:#86A874;
  --good-wash:#1F2819;
  --bad:#DC7159;
  --bad-wash:#301D18;
  --lift:3px 3px 0 var(--rule);
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:0}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
kbd{font-family:var(--mono);font-size:11px;background:var(--surface-2);border:1px solid var(--rule);border-bottom-width:2px;border-radius:2px;padding:1px 5px;color:var(--ink-soft)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* catalogue labels: mono small caps, the way a drawer is labelled */
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}

/* ---- chrome ---- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{border-right:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 15px;border-bottom:2px solid var(--ink);display:flex;align-items:baseline;gap:8px}
.brand h1{font-family:var(--read);font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1}
.brand h1 em{font-style:italic;color:var(--bad)}
.brand .tag{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.04em}
.rail-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px 7px}
.decks{list-style:none;margin:0;padding:0 10px 10px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:1px}
.deck-btn{width:100%;text-align:left;padding:9px 10px;border-radius:2px;display:flex;align-items:baseline;gap:8px;color:var(--ink-soft);border-left:3px solid transparent}
.deck-btn:hover{background:var(--surface-2);color:var(--ink)}
.deck-btn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.deck-btn .ct{font-family:var(--mono);font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.deck-btn[aria-current="true"]{background:var(--ink);color:var(--accent-ink);border-left-color:var(--bad)}
.deck-btn[aria-current="true"] .ct{color:var(--accent-ink);opacity:.65}
.rail-foot{border-top:1px solid var(--rule);padding:12px 18px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-faint);width:100%;text-align:left}
.rail-foot:hover{background:var(--surface-2);color:var(--ink-soft)}
.dot{width:6px;height:6px;border-radius:0;background:var(--good);flex:none}
.dot.off{background:var(--ink-faint)}
.dot.edit{background:var(--bad)}

.stage{padding:30px 34px 60px;max-width:1060px;width:100%}
.stage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.stage-head h2{font-family:var(--read);font-size:31px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.sub{color:var(--ink-soft);font-size:13px;margin-top:5px}

/* ---- buttons: bordered, square, no glow ---- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:2px;border:1px solid var(--rule);background:var(--surface);font-weight:500;font-size:14px;transition:border-color .1s,background .1s,color .1s}
.btn:hover{border-color:var(--ink);background:var(--surface-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--accent-ink)}
.btn.primary:hover{background:var(--ink-soft);border-color:var(--ink-soft)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-soft)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--rule);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--rule);background:var(--surface)}
.btn.danger:hover{border-color:var(--bad);background:var(--bad-wash)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---- mode tiles ---- */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;margin:0 0 26px;border:1px solid var(--rule);background:var(--surface)}
.mode{text-align:left;padding:17px 18px;background:var(--surface);display:flex;flex-direction:column;gap:6px;transition:background .1s;border:0;outline-offset:-3px;box-shadow:0 0 0 .5px var(--rule)}
.mode:hover:not(:disabled){background:var(--surface-2)}
.mode:disabled{opacity:.45}
.mode .mt{font-weight:600;font-size:15px;display:flex;align-items:center;gap:9px;letter-spacing:-.01em}
.mode .md{font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.mode svg{flex:none;color:var(--bad)}

/* ---- deck summary: a ruled slip, not a stat dashboard ---- */
.summary{display:flex;gap:0;align-items:stretch;border:1px solid var(--rule);background:var(--surface);margin-bottom:22px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px;padding:13px 20px;flex:1;min-width:104px}
.stat + .stat{border-left:1px solid var(--rule-soft)}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat .l{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.stat .v.brass{color:var(--brass)}
.stat .v.bad{color:var(--bad)}
.summary .note{padding:13px 20px;font-size:11.5px;color:var(--ink-faint);max-width:27ch;line-height:1.45;display:flex;align-items:center}

/* ---- options bar ---- */
.opts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden;background:var(--surface)}
.seg button{padding:6px 12px;font-size:13px;color:var(--ink-soft);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--accent-ink);font-weight:500}

/* ---- the card: ruled index stock ---- */
.deskrow{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
.counter{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.track{height:2px;background:var(--rule-soft);overflow:hidden;margin-bottom:22px}
.track>i{display:block;height:100%;background:var(--ink);transition:width .25s ease}
.cardwrap{perspective:1600px;margin-bottom:18px}
.card{position:relative;min-height:340px;transform-style:preserve-3d;transition:transform .4s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.card.flipped{transform:rotateX(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--ink);border-radius:2px;box-shadow:var(--lift);padding:56px 46px 46px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:auto;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,var(--rule-soft) 33px,var(--rule-soft) 34px);
  background-position:0 40px}
.face::before{content:"";position:absolute;left:0;right:0;top:38px;height:1px;background:var(--bad);opacity:.5}
.face.back{transform:rotateX(180deg)}
.face .role{position:absolute;top:12px;left:22px;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.face .star{position:absolute;top:9px;right:16px;padding:6px;border-radius:2px;color:var(--ink-faint);line-height:0}
.face .star[aria-pressed="true"]{color:var(--brass)}
.face .star:hover{background:var(--surface-2)}
.facetext{font-family:var(--read);font-size:29px;line-height:1.36;max-width:33ch;letter-spacing:-.015em}
.face.back .facetext{font-size:21px;max-width:46ch;line-height:1.55}
.hintline{position:absolute;bottom:15px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--ink-faint)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}

.rowctl{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.judge{display:flex;gap:10px;justify-content:center;margin-top:4px}
.judge .btn{min-width:150px;justify-content:center}
.judge .know{border-color:var(--good);color:var(--good)}
.judge .know:hover{background:var(--good-wash);border-color:var(--good)}
.judge .again{border-color:var(--brass);color:var(--brass)}
.judge .again:hover{background:var(--brass-wash);border-color:var(--brass)}

/* ---- quiz ---- */
.prompt{background:var(--surface);border:1px solid var(--ink);border-radius:2px;box-shadow:var(--lift);padding:34px 32px;margin-bottom:18px;text-align:center}
.prompt .role{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:14px}
.prompt .q{font-family:var(--read);font-size:26px;line-height:1.35;max-width:40ch;margin:0 auto;letter-spacing:-.015em}
.choices{display:grid;gap:0;border:1px solid var(--rule)}
.choice{display:flex;gap:13px;align-items:flex-start;text-align:left;padding:13px 15px;border:0;border-bottom:1px solid var(--rule);background:var(--surface);font-family:var(--read);font-size:17px;line-height:1.45;transition:background .1s}
.choice:last-child{border-bottom:0}
.choice:hover:not(:disabled){background:var(--surface-2)}
.choice .key{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink-faint);border:1px solid var(--rule);border-radius:2px;width:20px;height:20px;display:grid;place-items:center;flex:none;margin-top:4px}
.choice.right{background:var(--good-wash);color:var(--good)}
.choice.right .key{border-color:var(--good);color:var(--good)}
.choice.wrong{background:var(--bad-wash);color:var(--bad)}
.choice.wrong .key{border-color:var(--bad);color:var(--bad)}
.choice:disabled{cursor:default}
.verdict{margin-top:16px;padding:12px 15px;border-radius:2px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid currentColor}
.verdict.ok{background:var(--good-wash);color:var(--good)}
.verdict.no{background:var(--bad-wash);color:var(--bad)}
.verdict.near{background:var(--brass-wash);color:var(--brass)}
.verdict b{font-family:var(--read);font-weight:600}
.verdict .btn:not(.primary){color:var(--ink)}

/* ---- write mode ---- */
.answer{width:100%;padding:14px 16px;border:1px solid var(--rule);border-radius:2px;background:var(--surface);font-family:var(--read);font-size:20px}
.answer:focus{border-color:var(--ink);outline:none;box-shadow:var(--lift)}

/* ---- match ---- */
.matchgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tile{min-height:104px;padding:14px;border:1px solid var(--rule);border-radius:2px;background:var(--surface);display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;line-height:1.4;transition:background .1s,border-color .1s,opacity .25s}
.tile.term{font-family:var(--ui);font-weight:600;border-left:3px solid var(--ink)}
.tile.def{font-family:var(--read);font-size:15px}
.tile:hover:not(:disabled):not(.done){border-color:var(--ink);background:var(--surface-2)}
.tile.sel{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.tile.done{opacity:.18;pointer-events:none;border-style:dashed}
.tile.miss{border-color:var(--bad);background:var(--bad-wash);color:var(--bad);animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.tile.miss{animation:none}}

/* ---- results ---- */
.result{background:var(--surface);border:1px solid var(--ink);border-radius:2px;box-shadow:var(--lift);padding:34px 30px;text-align:center;margin-bottom:18px}
.result .score{font-family:var(--mono);font-size:56px;font-weight:500;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1.05}
.missed{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;text-align:left;border:1px solid var(--rule);overflow:hidden}
.missed li{display:grid;grid-template-columns:minmax(120px,1fr) 1.4fr;gap:16px;padding:11px 14px;background:var(--surface);border-bottom:1px solid var(--rule-soft);font-size:14px}
.missed li:last-child{border-bottom:none}
.missed .t{font-weight:600}
.missed .d{font-family:var(--read);font-size:15px;color:var(--ink-soft)}

/* ---- editor ---- */
.editbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.saveflag{font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.03em}
.rows{display:flex;flex-direction:column;border:1px solid var(--rule);overflow:hidden;background:var(--rule-soft)}
.rowhead{display:grid;grid-template-columns:32px 1fr 1.5fr 32px;gap:10px;padding:8px 12px;background:var(--surface-2);font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);border-bottom:1px solid var(--rule)}
.row{display:grid;grid-template-columns:32px 1fr 1.5fr 32px;gap:10px;padding:8px 12px;background:var(--surface);align-items:start;border-bottom:1px solid var(--rule-soft)}
.row:last-child{border-bottom:0}
.row .n{font-family:var(--mono);font-size:11px;color:var(--ink-faint);padding-top:10px;font-variant-numeric:tabular-nums}
.row textarea{width:100%;border:1px solid transparent;border-radius:2px;background:transparent;padding:7px 8px;resize:vertical;min-height:38px;font-size:14px}
.row textarea.def{font-family:var(--read);font-size:16px}
.row textarea:hover{border-color:var(--rule)}
.row textarea:focus{border-color:var(--ink);outline:none;background:var(--surface-2)}
.row .del{color:var(--ink-faint);padding:8px;border-radius:2px;line-height:0}
.row .del:hover{color:var(--bad);background:var(--bad-wash)}

.panel{border:1px solid var(--rule);border-radius:2px;background:var(--surface);padding:20px;margin-bottom:16px}
.panel h3{font-family:var(--read);font-size:19px;margin-bottom:5px;font-weight:600}
.panel p{margin:0 0 13px;font-size:13.5px;color:var(--ink-soft);line-height:1.55}
.paste{width:100%;min-height:132px;border:1px solid var(--rule);border-radius:2px;padding:11px 12px;background:var(--surface-2);font-family:var(--mono);font-size:12.5px;line-height:1.65;resize:vertical}
.paste:focus{border-color:var(--ink);outline:none}
select{border:1px solid var(--rule);border-radius:2px;padding:7px 10px;background:var(--surface);font-size:13.5px}
input.text{border:1px solid var(--rule);border-radius:2px;padding:8px 11px;background:var(--surface);font-size:14px}
input.text:focus{border-color:var(--ink);outline:none}

.empty{border:1px dashed var(--rule);border-radius:2px;padding:50px 30px;text-align:center;color:var(--ink-soft);background:var(--surface)}
.empty h3{font-family:var(--read);font-size:22px;margin-bottom:7px;color:var(--ink)}
.empty p{margin:0 auto 18px;max-width:46ch;font-size:14px}

.notice{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:2px;background:var(--surface);color:var(--ink-soft);font-size:13px;margin-bottom:18px;border:1px solid var(--rule);border-left:3px solid var(--brass)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--accent-ink);padding:10px 18px;border-radius:2px;font-size:13.5px;box-shadow:3px 3px 0 var(--rule);z-index:50}

/* ---- sign-in / publishing ---- */
.signin{max-width:460px;margin:0 auto}
.signin .panel{padding:24px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.field input{width:100%}
.err{font-size:13px;color:var(--bad);margin:0 0 10px;border-left:3px solid var(--bad);padding-left:10px}
.hr{display:flex;align-items:center;gap:14px;margin:24px 0;color:var(--ink-faint);font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.hr::before,.hr::after{content:"";flex:1;height:1px;background:var(--rule)}
.pubbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 15px;border:1px solid var(--brass);border-left:3px solid var(--brass);background:var(--brass-wash);border-radius:2px;margin-bottom:16px;font-size:13px;color:var(--brass)}
.pubbar b{font-weight:600}
.pubbar .btn:not(.primary){color:var(--ink)}
.pubbar.busy{border-color:var(--rule);border-left-color:var(--ink-faint);background:var(--surface-2);color:var(--ink-soft)}
.pubbar.fail{border-color:var(--bad);border-left-color:var(--bad);background:var(--bad-wash);color:var(--bad)}
.pubbar code{font-family:var(--mono);font-size:12px}
.steps{margin:0 0 15px;padding-left:20px;font-size:13.5px;color:var(--ink-soft);line-height:1.7}
.steps li{margin-bottom:5px}
.steps code{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--rule-soft);border-radius:2px;padding:1px 5px}

/* ---- folders: drawer dividers in the rail ---- */
#newdeckslot{display:flex;gap:2px}
.fgroup{list-style:none}
.folder{display:flex;align-items:stretch;border-radius:2px}
.folder:hover{background:var(--surface-2)}
.folder.on{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--bad)}
.fold-tog{width:24px;display:grid;place-items:center;color:var(--ink-faint);flex:none}
.fold-tog:hover{color:var(--ink)}
.fold-tog svg{transition:transform .15s}

.frow .s{font-size:12.5px;color:var(--ink-soft);display:block;margin-top:2px}
.frow .ct{font-family:var(--mono);font-size:12px;color:var(--ink-soft);text-align:right}
.fpick{display:inline-flex;align-items:center;gap:7px;color:var(--ink-soft);font-size:13px}
.deskdesc{font-family:var(--read);font-size:17px;line-height:1.45;color:var(--ink-soft);margin-top:6px;max-width:62ch}

/* ---- learn: the three piles, drawn like a ledger ---- */

.st.f{color:var(--bad)}

.railtoggle{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:none;border-bottom:2px solid var(--ink)}
  .rail[hidden]{display:none}
  .decks{max-height:260px}
  .railtoggle{display:inline-flex}
  .stage{padding:22px 18px 50px}
  .stage-head h2{font-size:25px}

  .row,.rowhead{grid-template-columns:24px 1fr 32px}
  .row .def-cell{grid-column:2/4}
  .rowhead .h-def{display:none}
  .missed li{grid-template-columns:1fr}
  .stat{min-width:50%;flex:none}
  .summary .note{display:none}
  .frow{grid-template-columns:1fr 60px}
  .frow .minibar{display:none}
  .learn{grid-template-columns:1fr}
  .missed.lround li{grid-template-columns:1fr}
  .st{text-align:left}
}

<body>

<div class="app">
  <aside class="rail" id="rail">
    <div class="brand"><h1>Quizlet<em>ish</em></h1><span class="tag">v1</span></div>
    <div class="rail-head"><span class="eyebrow">Decks</span><span id="newdeckslot"></span></div>
    <ul class="decks" id="decks"></ul>
    <button class="rail-foot" id="whobtn"><span class="dot off" id="syncdot"></span><span id="syncmsg">Loading…</span></button>
  </aside>
  <main class="stage" id="stage"></main>
</div>

<script>
(function(){
"use strict";

/* ============================ tiny helpers ============================ */
var $ = function(id){return document.getElementById(id);};
var stage = $("stage");
function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k === "class") n.className = attrs[k];
    else if(k === "html") n.innerHTML = attrs[k];
    else if(k === "text") n.textContent = attrs[k];
    else if(k.slice(0,2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  }
  if(kids) kids.forEach(function(c){ if(c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return n;
}
function icon(d, size){
  var s = document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("width", size||16); s.setAttribute("height", size||16);
  s.setAttribute("fill","none"); s.setAttribute("stroke","currentColor"); s.setAttribute("stroke-width","1.7");
  s.setAttribute("stroke-linecap","round"); s.setAttribute("stroke-linejoin","round");
  var p = document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d", d); s.appendChild(p); return s;
}
var I = {
  cards:"M4 7h11v11H4zM8 4h12v11",
  quiz:"M9 9a3 3 0 1 1 4 2.8c-.7.3-1 .9-1 1.6v.6M12 17.5h.01M4 4h16v16H4z",
  write:"M4 20h16M6 16l9.5-9.5a2.1 2.1 0 0 0-3-3L3 13v3h3z",
  match:"M4 5h6v6H4zM14 5h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z",
  edit:"M4 20h16M6 16l9.5-9.5a2.1 2.1 0 0 0-3-3L3 13v3h3z",
  back:"M15 18l-6-6 6-6",
  plus:"M12 5v14M5 12h14",
  trash:"M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13",
  star:"M12 3.6l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.8l5.9-.9z",
  copy:"M9 9h11v11H9zM5 15H4V4h11v1",
  shuffle:"M17 4l3 3-3 3M17 14l3 3-3 3M4 7h4l8 10h4M4 17h4l2-2.5M14.5 9L16 7h4",
  upload:"M12 16V4M8 8l4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3",
  user:"M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M4.5 20a7.5 7.5 0 0 1 15 0",
  learn:"M3 20h5v-5h5v-5h5V5h3",
  folder:"M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z",
  chev:"M9 6l6 6-6 6"
};
function starIcon(on){
  var s = icon(I.star, 15);
  s.querySelector("path").setAttribute("fill", on ? "currentColor" : "none");
  return s;
}
function toast(msg){
  var t = document.querySelector(".toast"); if(t) t.remove();
  t = el("div",{class:"toast",text:msg}); document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.remove(); }, 1900);
}
function shuffled(a){
  var r = a.slice();
  for(var i = r.length - 1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = r[i]; r[i]=r[j]; r[j]=t; }
  return r;
}
function uid(p){ return (p||"c") + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2,6); }

/* ============================ state ============================ */
var S = {
  canEdit:false, ready:false, who:null, published:null, draft:false, token:null, busy:false, incoming:null,
  decks:[], deckId:null, view:"home",
  folders:[], folderId:null, open:{}, learn:{},
  dir:"t2d",        // t2d = term -> definition, d2t = definition -> term
  filter:"all",     // all | starred | missed
  shuffle:true,
  session:null,
  progress:{}, bests:{},
  lastKeystroke:0, saveTimer:null, dirtyDecks:{}
};

/* -------- per-viewer progress: browser-local, never sent anywhere -------- */
var WHO_KEY = "recalldesk.who.v1", DRAFT_KEY = "recalldesk.draft.v1", TOKEN_KEY = "recalldesk.gh.v1", FOLD_KEY = "recalldesk.folders-open.v1";
// Scores are filed under whichever name is signed in, so a shared classroom machine
// keeps them apart. Still browser-local: nothing about a score leaves the device.
function slug(n){ return String(n||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "guest"; }
function PKEY(){ return "recalldesk.progress.v1." + slug(S.who); }
function BKEY(){ return "recalldesk.bests.v1." + slug(S.who); }
function LKEY(){ return "recalldesk.learn.v1." + slug(S.who); }
function ls(k, fallback){
  try{ return JSON.parse(localStorage.getItem(k) || "null") || fallback; }catch(e){ return fallback; }
}
function loadLocal(){
  S.progress = ls(PKEY(), {});
  S.bests = ls(BKEY(), {});
  S.learn = ls(LKEY(), {});
}
function saveLocal(){
  try{
    localStorage.setItem(PKEY(), JSON.stringify(S.progress));
    localStorage.setItem(BKEY(), JSON.stringify(S.bests));
    localStorage.setItem(LKEY(), JSON.stringify(S.learn));
  }catch(e){}
}
function saveFolds(){ try{ localStorage.setItem(FOLD_KEY, JSON.stringify(S.open)); }catch(e){} }
function prog(deckId, cardId){
  var d = S.progress[deckId] || (S.progress[deckId] = {});
  return d[cardId] || (d[cardId] = {seen:0, right:0, wrong:0, star:false, last:null});
}
function record(cardId, ok){
  var p = prog(S.deckId, cardId);
  p.seen++; if(ok){ p.right++; p.last = "right"; } else { p.wrong++; p.last = "wrong"; }
  saveLocal();
}
function toggleStar(cardId){
  var p = prog(S.deckId, cardId); p.star = !p.star; saveLocal(); return p.star;
}
// Learn rung per card: 0 new, 1 learning (next asked typed), 2 mastered.
function lstage(deckId, cardId){ var m = S.learn[deckId]; return (m && m[cardId]) || 0; }
function setStage(deckId, cardId, st){
  var m = S.learn[deckId] || (S.learn[deckId] = {});
  if(st > 0) m[cardId] = st; else delete m[cardId];
  saveLocal();
}

/* ============================ deck helpers ============================ */
function deck(){ for(var i=0;i<S.decks.length;i++) if(S.decks[i].id === S.deckId) return S.decks[i]; return null; }
function folderById(id){ for(var i=0;i<S.folders.length;i++) if(S.folders[i].id === id) return S.folders[i]; return null; }
function decksIn(folderId){ return S.decks.filter(function(d){ return (d.folder || "") === folderId; }); }
function cardsOf(d){ return (d && Array.isArray(d.cards)) ? d.cards.filter(function(c){ return (c.term||"").trim() || (c.def||"").trim(); }) : []; }
function pool(){
  var d = deck(); if(!d) return [];
  var all = cardsOf(d);
  if(S.filter === "starred") return all.filter(function(c){ return prog(d.id, c.id).star; });
  if(S.filter === "missed")  return all.filter(function(c){ var p = prog(d.id, c.id); return p.wrong > 0 && p.last !== "right"; });
  return all;
}
function ask(c){ return S.dir === "t2d" ? c.term : c.def; }
function ans(c){ return S.dir === "t2d" ? c.def : c.term; }
var ASK_LABEL = function(){ return S.dir === "t2d" ? "Term" : "Definition"; };
var ANS_LABEL = function(){ return S.dir === "t2d" ? "Definition" : "Term"; };

/* ============================ answer matching ============================ */
function norm(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9\s]/g," ").replace(/\b(a|an|the)\b/g," ").replace(/\s+/g," ").trim();
}
function lev(a,b){
  if(a === b) return 0;
  if(!a.length) return b.length; if(!b.length) return a.length;
  var prev = [], cur = [], i, j;
  for(j=0;j<=b.length;j++) prev[j] = j;
  for(i=1;i<=a.length;i++){
    cur[0] = i;
    for(j=1;j<=b.length;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    for(j=0;j<=b.length;j++) prev[j] = cur[j];
  }
  return prev[b.length];
}
// -> "exact" | "near" | "no"
function grade(given, target){
  var g = norm(given); if(!g) return "no";
  var alts = String(target||"").split("/").map(norm).filter(Boolean);
  if(!alts.length) alts = [norm(target)];
  var best = "no";
  alts.forEach(function(t){
    if(!t) return;
    if(g === t){ best = "exact"; return; }
    if(best === "exact") return;
    var tol = Math.max(1, Math.floor(t.length / 8));
    if(lev(g, t) <= tol) best = "near";
  });
  return best;
}

/* ============================ deck store ============================ */
/* The published decks live in decks.json, committed to the repo. Editing works on a
   local draft; "Publish" writes a new decks.json for Nathan to commit. Nothing here
   can change what anyone else sees without a commit — that is the real gate. */
function setSync(state, msg){
  var dot = $("syncdot");
  dot.className = "dot" + (state === "edit" ? " edit" : state ? "" : " off");
  $("syncmsg").textContent = msg;
}
function whoLine(){
  if(S.canEdit) return "Editing as ADMIN" + (S.token ? " · can publish" : " · publishing not set up");
  return S.who ? "Studying as " + S.who : "Not signed in — scores won't be kept";
}
function refreshFoot(){ setSync(S.canEdit ? "edit" : !!S.who, whoLine()); }

function deckPayload(){
  return {
    version: 1,
    updated: new Date().toISOString().slice(0,10),
    folders: S.folders.map(function(f){ return {id: f.id, name: f.name || "Untitled folder"}; }),
    decks: S.decks.map(function(d){
      return {
        id: d.id, name: d.name || "Untitled deck", subject: d.subject || "",
        folder: d.folder || undefined,      // dropped from the JSON when a deck isn't filed
        createdAt: d.createdAt || 0,
        cards: cardsOf(d).map(function(c){ return {id: c.id, term: c.term || "", def: c.def || ""}; })
      };
    })
  };
}
function saveDraft(){
  S.draft = true;
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(deckPayload())); }catch(e){}
  if($("pubbar") && !S.busy) pubState("", unpublishedMsg(), S.token ? "Publish to everyone" : "Set up publishing");
  delete S.pendingDeck;
  S.dirtyDecks = {};
  var f = $("saveflag"); if(f) f.textContent = "Draft saved on this device";
}
function pushDeck(d){
  if(!S.canEdit) return Promise.resolve();
  saveDraft();
  return Promise.resolve();
}
function queueSave(d){
  if(!S.canEdit) return;
  S.dirtyDecks[d.id] = true;
  var f = $("saveflag"); if(f) f.textContent = "Saving…";
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(saveDraft, 500);
}
function discardDraft(){
  if(!confirm("Throw away every change made since the last publish, and go back to the decks in the repo?")) return;
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
  useStore(S.published);
  S.draft = false;
  if(!deck() && S.decks.length) S.deckId = S.decks[0].id;
  renderRail(); render(); toast("Back to the published decks");
}
/* ---------------- publishing straight to the repo ----------------
   The editor commits decks.json through the GitHub API with a fine-grained token
   that lives only in this browser. Unlocking the editor is therefore no longer
   enough to publish — you also need the token, which is never in the code. */
var GH_OWNER = "homejeopardy", GH_REPO = "recall-desk", GH_BRANCH = "main", GH_FILE = "decks.json";
var GH_API = "https://api.github.com/repos/" + GH_OWNER + "/" + GH_REPO + "/contents/" + GH_FILE;

function b64utf8(str){
  var bytes = new TextEncoder().encode(str), out = "";
  for(var i = 0; i < bytes.length; i += 0x8000){
    out += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(out);
}
function ghFetch(url, opts){
  opts = opts || {};
  opts.headers = {
    "Authorization": "Bearer " + S.token,
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28"
  };
  opts.cache = "no-store";
  return fetch(url, opts);
}
function ghError(res){
  if(res.status === 401) return "GitHub rejected the token. It may have expired — connect a new one.";
  if(res.status === 403) return "That token isn't allowed to write to this repo. It needs Contents: Read and write on recall-desk.";
  if(res.status === 404) return "GitHub can't see " + GH_OWNER + "/" + GH_REPO + ". Either the repo doesn't exist yet or the token wasn't given access to it.";
  if(res.status === 409 || res.status === 422) return "The file changed on GitHub while you were editing. Reload the page, then redo this change.";
  return "GitHub returned " + res.status + ". Try again in a moment.";
}
function setToken(t){
  S.token = t || null;
  try{ t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); }catch(e){}
  refreshFoot();
}
function pubState(cls, msg, btnLabel){
  var bar = $("pubbar"); if(!bar) return;
  bar.hidden = false;
  bar.className = "pubbar" + (cls ? " " + cls : "");
  var m = $("pubmsg"); if(m){ m.textContent = ""; m.appendChild(msg); }
  var b = $("pubbtn");
  if(b){
    b.disabled = S.busy ? "disabled" : null;
    if(S.busy) b.setAttribute("disabled","disabled"); else b.removeAttribute("disabled");
    if(btnLabel){ b.textContent = ""; b.appendChild(icon(I.upload,14)); b.appendChild(document.createTextNode(btnLabel)); }
  }
}
// Shown on every editing surface, hidden until there's something to publish.
function pubBar(){
  return el("div",{class:"pubbar",id:"pubbar",hidden: S.draft ? null : "hidden"},[
    icon(I.upload,15),
    el("span",{id:"pubmsg"},[unpublishedMsg()]),
    el("div",{style:"flex:1"}),
    el("button",{class:"btn sm",onclick:discardDraft},["Discard"]),
    el("button",{class:"btn primary sm",id:"pubbtn",onclick:publish},[icon(I.upload,14), S.token ? "Publish to everyone" : "Set up publishing"])
  ]);
}
function unpublishedMsg(){
  return el("span",{},[el("b",{text:"Unpublished changes."})," Students still see the last published decks."]);
}

function publish(){
  if(!S.token){ return go("connect"); }
  if(S.busy) return;
  var payload = deckPayload();
  var json = JSON.stringify(payload, null, 2) + "\n";
  S.busy = true;
  pubState("busy", el("span",{text:"Publishing to GitHub…"}));

  ghFetch(GH_API + "?ref=" + GH_BRANCH).then(function(res){
    if(res.status === 404) return null;              // first publish, file not there yet
    if(!res.ok) throw new Error(ghError(res));
    return res.json();
  }).then(function(existing){
    var body = {
      message: "Update decks (" + payload.decks.length + " deck" + (payload.decks.length === 1 ? "" : "s") + ", " +
               payload.decks.reduce(function(n,d){ return n + d.cards.length; }, 0) + " cards)",
      content: b64utf8(json),
      branch: GH_BRANCH
    };
    if(existing && existing.sha) body.sha = existing.sha;
    return ghFetch(GH_API, {method:"PUT", body: JSON.stringify(body)});
  }).then(function(res){
    if(!res.ok) throw new Error(ghError(res));
    return res.json();
  }).then(function(){
    S.busy = false;
    S.published = copy(currentStore());
    S.draft = false;
    try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
    var bar = $("pubbar"); if(bar) bar.hidden = true;
    var f = $("saveflag"); if(f) f.textContent = "Matches what's published";
    toast("Published — students see it in about a minute");
  }).catch(function(err){
    S.busy = false;
    pubState("fail", el("span",{},[el("b",{text:"Didn't publish. "}), String(err && err.message || err)]), "Try again");
  });
}

function downloadJSON(){
  var json = JSON.stringify(deckPayload(), null, 2) + "\n";
  var blob = new Blob([json], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = el("a", {href:url, download:"decks.json"});
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);

/* ---------------- learn ----------------
   Quizlet-style adaptive rounds. Every card climbs two rungs:
     0 new       asked as multiple choice
     1 learning  asked as a typed answer
     2 mastered  retired from Learn
   A miss at either rung drops the card to 0 and requeues it once in the same round,
   so the right answer comes back while it's still fresh. Rungs are saved per answer,
   so walking away mid-round loses nothing but the round's order. */
var ROUND_SIZE = 7, learnTimer = null;

function learnCounts(d, cards){
  var k = {fresh:0, learning:0, mastered:0};
  cards.forEach(function(c){ var st = lstage(d.id, c.id); if(st >= 2) k.mastered++; else if(st === 1) k.learning++; else k.fresh++; });
  return k;
}
function learnMeter(d, cards){
  var k = learnCounts(d, cards), n = cards.length || 1;
  return el("div",{class:"lmeter"},[
    el("div",{class:"lbar","aria-hidden":"true"},[
      el("i",{class:"lm-m",style:"width:" + (k.mastered/n*100) + "%"}),
      el("i",{class:"lm-l",style:"width:" + (k.learning/n*100) + "%"})
    ]),
    el("div",{class:"llegend"},[
      el("span",{},[el("b",{class:"sw m"}), k.mastered + " mastered"]),
      el("span",{},[el("b",{class:"sw l"}), k.learning + " learning"]),
      el("span",{},[el("b",{class:"sw f"}), k.fresh + " new"])
    ])
  ]);
}
// Multiple choice needs at least one wrong option that reads differently from the answer.
function canChoose(cards){
  var seen = {}, n = 0;
  cards.forEach(function(c){ var a = norm(ans(c)); if(a && !seen[a]){ seen[a] = true; n++; } });
  return n >= 2;
}
// The typed rung shows the definition and asks for the term, whichever way the deck is
// being drilled. Typing a whole definition back verbatim is a transcription test, and a
// definition carrying a part-of-speech line ("noun …") would fail a correct answer.
function typesTerm(c){ return !!(c.term || "").trim() && !!(c.def || "").trim(); }
function lask(c, kind){ return kind === "type" && typesTerm(c) ? c.def : ask(c); }
function lans(c, kind){ return kind === "type" && typesTerm(c) ? c.term : ans(c); }

function buildLearnRound(cards){
  var d = deck();
  var learning = cards.filter(function(c){ return lstage(d.id, c.id) === 1; });
  var fresh = cards.filter(function(c){ return lstage(d.id, c.id) === 0; });
  if(S.shuffle){ learning = shuffled(learning); fresh = shuffled(fresh); }
  // Carry half-learned cards forward, but keep room to introduce a couple of new ones.
  var take = Math.min(learning.length, ROUND_SIZE - Math.min(2, fresh.length));
  var pick = learning.slice(0, take);
  pick = pick.concat(fresh.slice(0, ROUND_SIZE - pick.length));
  pick = pick.concat(learning.slice(take, take + ROUND_SIZE - pick.length));
  if(S.shuffle) return shuffled(pick);
  return pick.sort(function(a,b){ return cards.indexOf(a) - cards.indexOf(b); });
}
function startLearn(){
  S.session = {mode:"learn", all:pool(), round:0};
  nextLearnRound();
  go("learn");
}
function nextLearnRound(){
  var s = S.session;
  s.round++; s.queue = buildLearnRound(s.all); s.i = 0;
  s.requeued = {}; s.answer = null; s.kind = null; s.kindFor = null; s.choices = null;
}
function learnContinueRound(){
  var s = S.session;
  if(!s || s.mode !== "learn" || s.i < s.queue.length) return;   // guards a double Enter+click
  nextLearnRound(); render(); window.scrollTo(0,0);
}
function learnReset(cards){
  if(!confirm("Reset Learn for these " + cards.length + " cards and start from scratch? Stars and your other scores stay.")) return;
  var d = deck();
  cards.forEach(function(c){ setStage(d.id, c.id, 0); });
  startLearn();
}

function renderLearn(){
  var s = S.session; if(!s || s.mode !== "learn") return go("home");
  var d = deck(), all = cardsOf(d);
  if(!s.queue.length) return renderLearnDone(s);
  if(s.i >= s.queue.length){
    return learnCounts(d, s.all).mastered >= s.all.length ? renderLearnDone(s) : renderLearnRound(s);
  }
  var c = s.queue[s.i];
  if(s.kindFor !== s.i){
    s.kind = (lstage(d.id, c.id) === 0 && canChoose(all)) ? "choice" : "type";
    s.choices = s.kind === "choice" ? buildChoices(c, all) : null;
    s.kindFor = s.i;
  }
  var a = s.answer, typed = s.kind === "type", right = lans(c, s.kind);

  stage.appendChild(modeHead("Learn"));
  stage.appendChild(learnMeter(d, s.all));
  stage.appendChild(el("div",{class:"deskrow"},[
    el("span",{class:"counter",text:"Round " + s.round + " · " + (s.i+1) + " / " + s.queue.length}),
    el("span",{class:"kind",text: !typed ? "Pick one" : typesTerm(c) ? "Type the term" : "Type it"})
  ]));
  var tr = el("div",{class:"track"}); tr.appendChild(el("i",{style:"width:" + (s.i/s.queue.length*100) + "%"})); stage.appendChild(tr);
  stage.appendChild(el("div",{class:"prompt"},[
    el("div",{class:"role",text: typed && typesTerm(c) ? "Definition" : ASK_LABEL()}),
    el("div",{class:"q",text:lask(c, s.kind) || "—"})
  ]));

  var input = null;
  if(s.kind === "choice"){
    var wrap = el("div",{class:"choices"});
    s.choices.forEach(function(opt, idx){
      var cls = "choice";
      if(a){ if(opt === right) cls += " right"; else if(idx === a.picked) cls += " wrong"; }
      wrap.appendChild(el("button",{class:cls, disabled: a ? "disabled" : null, onclick:function(){ learnPick(idx); }},[
        el("span",{class:"key",text:String(idx+1)}), el("span",{text:opt})
      ]));
    });
    stage.appendChild(wrap);
  } else {
    input = el("input",{class:"answer",type:"text",placeholder:"Type the " + (typesTerm(c) ? "term" : ANS_LABEL().toLowerCase()) + "…","aria-label":"Your answer",autocomplete:"off",autocapitalize:"off",spellcheck:"false"});
    if(a){ input.value = a.given; input.disabled = true; }
    else {
      input.addEventListener("keydown", function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); learnType(input.value); } });
      setTimeout(function(){ input.focus(); }, 0);
    }
    stage.appendChild(input);
  }

  if(!a){
    stage.appendChild(el("div",{class:"rowctl",style:"margin-top:12px;justify-content:space-between"},[
      el("span",{style:"font-size:11.5px;color:var(--ink-faint)",
        html: s.kind === "choice" ? 'Press <kbd>1</kbd>–<kbd>' + s.choices.length + '</kbd>' : 'Press <kbd>Enter</kbd> to check'}),
      el("span",{class:"rowctl"},[
        el("button",{class:"linkbtn",onclick:learnDontKnow},["Don't know?"]),
        s.kind === "type" ? el("button",{class:"btn primary",onclick:function(){ learnType(input.value); }},["Check"]) : null
      ])
    ]));
    return;
  }

  var note = a.to >= 2 && a.from < 2 ? " Mastered." : (a.to === 1 && a.from === 0 ? " Next time, type it." : "");
  var cls = a.result === "no" ? "no" : a.result === "near" ? "near" : "ok", msg;
  if(a.result === "no"){
    msg = [ a.skipped ? "The answer is " : "Not quite — the answer is ", el("b",{text:right}), ". ",
            a.requeued ? "It comes back later this round." : "You'll see it again next round." ];
  } else if(a.result === "near"){
    msg = [ "Close enough — the exact wording is ", el("b",{text:right}), "." + note ];
  } else {
    msg = [ (a.overridden ? "Counted as correct." : "Correct.") + note ];
  }
  stage.appendChild(el("div",{class:"verdict " + cls},[
    el("span",{},msg),
    el("span",{class:"rowctl"},[
      a.result === "no" && a.kind === "type" && !a.skipped ? el("button",{class:"btn sm",onclick:learnOverride},["I was right"]) : null,
      el("button",{class:"btn sm",onclick:learnNext},[ s.i + 1 >= s.queue.length ? "Finish round" : "Continue", icon(I.chev,14) ])
    ])
  ]));
}

function learnAnswer(c, ok, a){
  var s = S.session, d = deck();
  a.from = lstage(d.id, c.id);
  a.requeued = false;
  if(ok) setStage(d.id, c.id, Math.min(2, a.from + 1));
  else {
    setStage(d.id, c.id, 0);
    if(!s.requeued[c.id]){ s.requeued[c.id] = true; s.queue.push(c); a.requeued = true; }
  }
  a.to = lstage(d.id, c.id);
  record(c.id, ok);
  s.answer = a;
  render();
  // A clean right answer moves on by itself; anything worth reading waits for you.
  if(ok && a.result === "exact"){
    clearTimeout(learnTimer);
    learnTimer = setTimeout(function(){ if(S.session === s && s.answer === a) learnNext(); }, 950);
  }
}
function learnPick(idx){
  var s = S.session; if(!s || s.answer || s.kind !== "choice") return;
  var c = s.queue[s.i], ok = s.choices[idx] === ans(c);
  learnAnswer(c, ok, {kind:"choice", picked:idx, result: ok ? "exact" : "no"});
}
function learnType(given){
  var s = S.session; if(!s || s.answer || s.kind !== "type") return;
  var c = s.queue[s.i], r = String(given || "").trim() ? grade(given, lans(c, "type")) : "no";
  learnAnswer(c, r !== "no", {kind:"type", given:given, result:r});
}
function learnDontKnow(){
  var s = S.session; if(!s || s.answer) return;
  learnAnswer(s.queue[s.i], false, {kind:s.kind, picked:null, given:"", result:"no", skipped:true});
}
function learnOverride(){
  var s = S.session, a = s && s.answer;
  if(!a || a.result !== "no" || a.kind !== "type" || a.skipped) return;
  var c = s.queue[s.i], d = deck();
  setStage(d.id, c.id, Math.min(2, a.from + 1));
  if(a.requeued && s.queue[s.queue.length - 1] === c){ s.queue.pop(); delete s.requeued[c.id]; a.requeued = false; }
  var p = prog(d.id, c.id); p.wrong = Math.max(0, p.wrong - 1); p.right++; p.last = "right"; saveLocal();
  a.result = "exact"; a.overridden = true; a.to = lstage(d.id, c.id);
  render();
}
function learnNext(){
  clearTimeout(learnTimer);
  var s = S.session; if(!s || s.mode !== "learn" || !s.answer) return;   // guards a double Enter+click
  s.i++; s.answer = null; render();
}

function renderLearnRound(s){
  var d = deck(), seen = [], ids = {};
  s.queue.forEach(function(c){ if(!ids[c.id]){ ids[c.id] = true; seen.push(c); } });
  var k = learnCounts(d, s.all);
  var ul = el("ul",{class:"missed lround"});
  seen.forEach(function(c){
    var st = lstage(d.id, c.id);
    ul.appendChild(el("li",{},[
      el("span",{class:"t",text:ask(c)}), el("span",{class:"d",text:ans(c)}),
      el("span",{class:"st " + (st >= 2 ? "m" : st === 1 ? "l" : "f"), text: st >= 2 ? "Mastered" : st === 1 ? "Type it next" : "Needs work"})
    ]));
  });
  stage.appendChild(modeHead("Learn"));
  stage.appendChild(el("div",{class:"result"},[
    el("div",{class:"eyebrow",text:"Round " + s.round + " done"}),
    el("div",{class:"score",text:k.mastered + "/" + s.all.length}),
    el("p",{style:"margin:2px 0 16px;color:var(--ink-soft);font-size:14px",text:"cards mastered so far"}),
    learnMeter(d, s.all),
    el("div",{class:"rowctl",style:"margin-top:22px"},[
      el("button",{class:"btn primary",onclick:learnContinueRound},["Continue to round " + (s.round + 1)]),

/* ---------------- multiple choice ---------------- */
function buildChoices(c, all){
  var right = ans(c);
  var others = [];
  all.forEach(function(o){
    if(o.id === c.id) return;
    var a = ans(o);
    if(a && norm(a) !== norm(right) && others.indexOf(a) === -1) others.push(a);
  });
  var picks = shuffled(others).slice(0, 3);
  return shuffled(picks.concat([right]));
}
function renderQuiz(){
  var s = S.session; if(!s) return go("home");

  var c = s.cards[s.i];

  if(!s.choices || s.choicesFor !== c.id){ s.choices = buildChoices(c, allCards); s.choicesFor = c.id; }
  stage.appendChild(modeHead("Multiple choice"));
  stage.appendChild(el("div",{class:"deskrow"},[

      el("span",{},[ wasRight ? "Correct." : "Not quite — the answer is ", wasRight ? null : el("b",{text:right}) ]),

/* ---------------- matching ---------------- */
var matchTimer = null;
function startMatch(order){
  var picked = order.slice(0, Math.min(6, order.length));
  var tiles = [];
  picked.forEach(function(c){
    tiles.push({id:c.id, kind:"term", text:c.term || "—"});
    tiles.push({id:c.id, kind:"def", text:c.def || "—"});
  });
  S.session = {mode:"match", pairs:picked.length, tiles:shuffled(tiles), sel:null, done:{}, miss:null, start:Date.now(), elapsed:0, over:false, errors:0};
  clearInterval(matchTimer);
  matchTimer = setInterval(function(){
    var s = S.session;
    if(!s || s.mode !== "match" || s.over){ clearInterval(matchTimer); return; }
    s.elapsed = (Date.now() - s.start)/1000;
    var t = $("mtimer"); if(t) t.textContent = s.elapsed.toFixed(1) + "s";
  }, 100);
}
function renderMatch(){
  var s = S.session; if(!s || s.mode !== "match") return go("home");
  var d = deck(), best = (S.bests[d.id] || {})[s.pairs];
  stage.appendChild(modeHead("Matching"));
  if(s.over){
    clearInterval(matchTimer);
    var isBest = !best || s.elapsed < best;
    if(isBest){ (S.bests[d.id] = S.bests[d.id] || {})[s.pairs] = s.elapsed; saveLocal(); }
    stage.appendChild(el("div",{class:"result"},[
      el("div",{class:"eyebrow",text: isBest ? "New best time" : "Cleared"}),
      el("div",{class:"score",text:s.elapsed.toFixed(1) + "s"}),
      el("p",{style:"margin:2px 0 20px;color:var(--ink-soft);font-size:14px",text: s.pairs + " pairs · " + s.errors + (s.errors === 1 ? " wrong pairing" : " wrong pairings") + (best && !isBest ? " · best " + best.toFixed(1) + "s" : "")}),
      el("div",{class:"rowctl"},[
        el("button",{class:"btn primary",onclick:function(){ startMode("match"); }},["Play again"]),
        el("button",{class:"btn ghost",onclick:function(){ S.session=null; go("home"); }},["Back to deck"])
      ])
    ]));
    return;
  }
  var left = s.pairs - Object.keys(s.done).length;
  stage.appendChild(el("div",{class:"deskrow"},[
    el("span",{class:"counter",id:"mtimer",text:s.elapsed.toFixed(1) + "s"}),
    el("span",{class:"counter",text:left + " " + (left === 1 ? "pair" : "pairs") + " left" + (best ? " · best " + best.toFixed(1) + "s" : "")})
  ]));
  var grid = el("div",{class:"matchgrid"});
  s.tiles.forEach(function(t, idx){
    var cls = "tile " + t.kind;
    if(s.done[t.id]) cls += " done";
    else if(s.sel === idx) cls += " sel";
    else if(s.miss === idx) cls += " miss";
    grid.appendChild(el("button",{class:cls, text:t.text, onclick:function(){ tapTile(idx); }}));
  });
  stage.appendChild(grid);
}
function tapTile(idx){
  var s = S.session, t = s.tiles[idx];
  if(s.done[t.id] || s.miss !== null) return;
  if(s.sel === null){ s.sel = idx; return render(); }
  if(s.sel === idx){ s.sel = null; return render(); }
  var a = s.tiles[s.sel];
  if(a.id === t.id && a.kind !== t.kind){
    s.done[t.id] = true; s.sel = null;
    record(t.id, true);
    if(Object.keys(s.done).length === s.pairs){ s.over = true; s.elapsed = (Date.now() - s.start)/1000; }
    return render();
  }
  s.errors++;
  record(t.id, false);
  s.miss = idx; render();
  setTimeout(function(){ if(S.session === s){ s.miss = null; s.sel = null; render(); } }, 420);
}

  var ro = !S.canEdit, inside = decksIn(f.id);
  var total = inside.reduce(function(n, d){ return n + cardsOf(d).length; }, 0);

  stage.appendChild(el("div",{class:"stage-head"},[
    el("div",{},[
      ro ? el("h2",{text:f.name || "Untitled folder"})
         : el("input",{class:"text",id:"foldername",style:"font-size:24px;font-weight:600;padding:6px 10px;letter-spacing:-.02em;min-width:min(420px,100%)",value:f.name || "",placeholder:"Folder name","aria-label":"Folder name",
             oninput:function(ev){ f.name = ev.target.value; S.lastKeystroke = Date.now(); renderRail(); queueSave(f); }}),
      el("div",{class:"sub",text: inside.length + (inside.length === 1 ? " deck · " : " decks · ") + total + (total === 1 ? " card" : " cards")})
    ]),
    el("div",{class:"rowctl"},[
      ro ? null : el("button",{class:"btn",onclick:function(){ newDeck(f.id); }},[icon(I.plus,15),"New deck here"]),
      el("button",{class:"btn ghost railtoggle",onclick:function(){ var r = $("rail"); r.hidden = !r.hidden; }},["Decks"])
    ])
  ]));

  if(!ro) stage.appendChild(pubBar());

  if(!inside.length){
    stage.appendChild(el("div",{class:"empty"},[
      el("h3",{text:"Nothing in this folder yet"}),
      el("p",{text: ro ? "Decks will show up here once they're filed in it." : "Make a deck here, or open any deck's editor and pick this folder to move it in."})
    ]));
  } else {
    var listEl = el("div",{class:"flist"});
    inside.forEach(function(d){
      var cards = cardsOf(d), k = learnCounts(d, cards), n = cards.length || 1;
      listEl.appendChild(el("button",{class:"frow",onclick:function(){ openDeck(d.id); }},[
        el("span",{},[
          el("span",{class:"t",text:d.name || "Untitled deck"}),
          el("span",{class:"s",text:(d.subject ? d.subject + " · " : "") + cards.length + (cards.length === 1 ? " card" : " cards")})
        ]),
        el("span",{class:"minibar","aria-hidden":"true"},[
          el("i",{class:"lm-m",style:"background:var(--ink);width:" + (k.mastered/n*100) + "%"}),
          el("i",{class:"lm-l",style:"background:repeating-linear-gradient(135deg,var(--brass) 0 2px,transparent 2px 5px);width:" + (k.learning/n*100) + "%"})
        ]),
        el("span",{class:"ct",title:"Mastered in Learn",text:k.mastered + "/" + cards.length})
      ]));
    });
    stage.appendChild(listEl);
  }

  if(!ro){
    stage.appendChild(el("div",{class:"foldfoot"},[
      el("span",{class:"saveflag",id:"saveflag",style:"margin-right:auto",text: S.draft ? "Draft saved on this device" : "Matches what's published"}),
      el("button",{class:"btn danger sm",onclick:function(){ removeFolder(f); }},[icon(I.trash,14),"Delete folder"])
    ]));
  }
}

function removeDeck(d){
  if(!confirm("Delete “" + (d.name || "Untitled deck") + "” and all " + cardsOf(d).length + " of its cards? It goes for everyone once you publish.")) return;
  S.decks = S.decks.filter(function(x){ return x.id !== d.id; });
  saveDraft();
  S.deckId = S.decks.length ? S.decks[0].id : null; S.view = "home";
  renderRail(); render();
}
function copyDeck(d){
  var txt = cardsOf(d).map(function(c){ return (c.term||"") + "\t" + (c.def||""); }).join("\n");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast("Copied " + cardsOf(d).length + " cards (tab-separated)"); },
                                            function(){ toast("Couldn't reach the clipboard"); });
  } else toast("Couldn't reach the clipboard");
}
function pastePanel(d){
  var sepSel, custom, box, preview;
  function seps(){
    var v = sepSel.value;
    if(v === "tab") return ["\t"];
    if(v === "comma") return [","];
    if(v === "dash") return [" - ", " – ", " — "];
    if(v === "colon") return [":"];
    return [custom.value || "\t"];
  }
  function parse(){
    var out = [], ss = seps();
    box.value.split("\n").forEach(function(line){
      if(!line.trim()) return;
      var cut = -1, used = "";
      ss.forEach(function(sp){ var k = line.indexOf(sp); if(k > 0 && (cut === -1 || k < cut)){ cut = k; used = sp; } });
      if(cut === -1) out.push({id:uid(), term:line.trim(), def:""});
      else out.push({id:uid(), term:line.slice(0,cut).trim(), def:line.slice(cut + used.length).trim()});
    });
    return out;
  }
  function refresh(){
    var n = parse();
    var withDef = n.filter(function(c){ return c.def; }).length;
    preview.textContent = n.length ? n.length + " card" + (n.length===1?"":"s") + " · " + withDef + " with a definition" +
      (withDef < n.length ? " · " + (n.length - withDef) + " line" + (n.length-withDef===1?"":"s") + " had no separator" : "") : "Nothing to import yet.";
  }
  box = el("textarea",{class:"paste",id:"pastebox",placeholder:"Fourth Amendment\tProtects against unreasonable searches and seizures\nStrict scrutiny\tCompelling interest, narrowly tailored, least restrictive means",oninput:refresh});
  sepSel = el("select",{"aria-label":"Separator",onchange:function(){ custom.hidden = sepSel.value !== "custom"; refresh(); }},[
    el("option",{value:"tab",text:"Tab (paste from a spreadsheet)"}),
    el("option",{value:"dash",text:"A dash  -  between them"}),
    el("option",{value:"comma",text:"A comma"}),
    el("option",{value:"colon",text:"A colon"}),
    el("option",{value:"custom",text:"Something else…"})
  ]);
  custom = el("input",{class:"text",hidden:"hidden",placeholder:"e.g.  ||",style:"width:120px",oninput:refresh});
  preview = el("span",{class:"saveflag",text:"Nothing to import yet."});

  var panel = el("div",{class:"panel",id:"pastepanel",hidden:"hidden"},[
    el("h3",{text:"Paste a list"}),
    el("p",{text:"One card per line, term first. Straight from a spreadsheet column pair, a Word table, or your outline."}),
    box,
    el("div",{class:"rowctl",style:"justify-content:flex-start;margin-top:12px"},[
      el("span",{style:"font-size:12.5px;color:var(--ink-soft)",text:"Split on"}), sepSel, custom, preview,
      el("div",{style:"flex:1"}),
      el("button",{class:"btn",onclick:function(){ box.value=""; refresh(); }},["Clear"]),
      el("button",{class:"btn primary",onclick:function(){
        var n = parse(); if(!n.length) return toast("Nothing to import");
        d.cards = cardsOf(d).concat(n);
        box.value = ""; refresh();
        saveDraft(); toast("Added " + n.length + " card" + (n.length===1?"":"s"));
        render();
      }},["Add to deck"])
    ])
  ]);
  return panel;
}

/* ============================ sign in ============================ */
var ADMIN_USER = "ADMIN";
var ADMIN_SALT = "recalldesk.v1.";
var ADMIN_HASH = "367a36dee35a4f0ac68c9ec1a3ec9ab7cbc2170907dce1da70bb2ee27cf10b5e";

function sha256hex(s){
  if(!(window.crypto && crypto.subtle)) return Promise.reject(new Error("insecure"));
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0" + b.toString(16)).slice(-2); }).join("");
  });
}
function signInAs(name){
  S.who = name || null;
  try{ name ? localStorage.setItem(WHO_KEY, name) : localStorage.removeItem(WHO_KEY); }catch(e){}
  loadLocal();
  refreshFoot(); renderRail();
}
function renderWho(){
  var errBox, nameIn, userIn, passIn;
  function fail(msg){ errBox.textContent = msg; errBox.hidden = false; }

  stage.appendChild(el("div",{class:"stage-head"},[
    el("div",{},[
      el("h2",{text: S.who ? "Signed in as " + S.who : "Who's studying?"}),
      el("div",{class:"sub",text:"Your scores are filed under this name, in this browser only — nothing is sent anywhere."})
    ]),
    S.decks.length ? el("button",{class:"btn ghost",onclick:function(){ go("home"); }},[icon(I.back,15),"Decks"]) : null
  ]));

  var wrap = el("div",{class:"signin"});

  nameIn = el("input",{class:"text",type:"text",id:"whoname",placeholder:"e.g. Jordan",value:S.who || "",autocomplete:"off"});
  nameIn.addEventListener("keydown", function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); start(); } });
  function start(){
    var n = nameIn.value.trim();
    if(!n) return fail("Pick a name so your scores have somewhere to go.");
    signInAs(n); toast("Studying as " + n); go("home");
  }

  var studentPanel = el("div",{class:"panel"},[
    el("h3",{text:"Study on this device"}),
    el("p",{text:"Type a name and your progress, stars, and best times are kept for you. Two people sharing a laptop just use different names."}),
    el("div",{class:"field"},[ el("label",{for:"whoname",text:"Your name"}), nameIn ]),
    el("div",{class:"rowctl",style:"justify-content:flex-start"},[
      el("button",{class:"btn primary",onclick:start},[icon(I.user,15),"Start studying"]),
      S.who ? el("button",{class:"btn ghost",onclick:function(){ signInAs(null); toast("Signed out"); render(); }},["Sign out"]) : null
    ])
  ]);

  userIn = el("input",{class:"text",type:"text",placeholder:"Username",autocomplete:"username"});
  passIn = el("input",{class:"text",type:"password",placeholder:"Password",autocomplete:"current-password"});
  passIn.addEventListener("keydown", function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); unlock(); } });
  function unlock(){
    if(userIn.value.trim().toUpperCase() !== ADMIN_USER) return fail("That username doesn't match.");
    sha256hex(ADMIN_SALT + passIn.value).then(function(h){
      if(h !== ADMIN_HASH) return fail("That password doesn't match.");
      S.canEdit = true;
      if(!S.who) signInAs("ADMIN"); else refreshFoot();
      renderRail(); toast("Editing unlocked"); go("home");
    }, function(){
      fail("This browser won't hash the password over an insecure connection. Open the site over https.");
    });
  }

  var editorPanel = el("div",{class:"panel"},[
    el("h3",{text:"Course editor"}),
    el("p",{text:"Unlocks the card editor on this device. Changes stay here until you publish a new decks.json to the repo, so a student who got past this box still couldn't change anyone else's cards."}),
    el("div",{class:"field"},[ el("label",{text:"Username"}), userIn ]),
    el("div",{class:"field"},[ el("label",{text:"Password"}), passIn ]),
    el("div",{class:"rowctl",style:"justify-content:flex-start"},[
      el("button",{class:"btn",onclick:unlock},["Unlock editing"]),
      S.canEdit ? el("button",{class:"btn ghost",onclick:function(){ S.canEdit = false; refreshFoot(); renderRail(); toast("Editing locked"); render(); }},["Lock editing"]) : null
    ])
  ]);

  errBox = el("p",{class:"err",hidden:"hidden"});

  wrap.appendChild(studentPanel);
  wrap.appendChild(el("div",{class:"hr",text:"or"}));
  wrap.appendChild(editorPanel);
  wrap.appendChild(errBox);
  stage.appendChild(wrap);
  setTimeout(function(){ (S.canEdit ? nameIn : nameIn).focus(); }, 0);
}

/* ============================ connect to GitHub ============================ */
function renderConnect(){
  var errBox, tokIn;
  function fail(msg){ errBox.textContent = msg; errBox.hidden = false; }

  stage.appendChild(el("div",{class:"stage-head"},[
    el("div",{},[
      el("h2",{text:"Publishing"}),
      el("div",{class:"sub",text:"One-time setup. After this, Publish sends your cards to everyone by itself."})
    ]),
    el("button",{class:"btn ghost",onclick:function(){ go(S.decks.length ? "edit" : "home"); }},[icon(I.back,15),"Back"])
  ]));

  var wrap = el("div",{class:"signin"});

  if(S.token){
    wrap.appendChild(el("div",{class:"panel"},[
      el("h3",{text:"Connected"}),
      el("p",{text:"This browser can publish to " + GH_OWNER + "/" + GH_REPO + ". The token is stored here and nowhere else — it isn't in the site's code and never goes to anyone but GitHub."}),
      el("div",{class:"rowctl",style:"justify-content:flex-start"},[
        el("button",{class:"btn",onclick:function(){ setToken(null); toast("Token removed from this browser"); render(); }},["Disconnect"]),
        el("button",{class:"btn ghost",onclick:downloadJSON},[icon(I.upload,15),"Download decks.json instead"])
      ])
    ]));
    stage.appendChild(wrap);
    return;
  }

  tokIn = el("input",{class:"text",type:"password",placeholder:"github_pat_…",autocomplete:"off",spellcheck:"false"});
  tokIn.addEventListener("keydown", function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); connect(); } });

  function connect(){
    var t = tokIn.value.trim();
    if(!t) return fail("Paste the token first.");
    errBox.hidden = true;
    var was = S.token; S.token = t;
    ghFetch(GH_API + "?ref=" + GH_BRANCH).then(function(res){
      if(res.status === 404){
        // 404 also means "repo exists but token can't see it" — either way, same fix.
        throw new Error("GitHub can't see " + GH_OWNER + "/" + GH_REPO + " with this token. Check the repo exists and that the token lists it under Repository access.");
      }
      if(res.status === 401) throw new Error("GitHub rejected that token. Copy it again — it's only shown once.");
      if(!res.ok) throw new Error(ghError(res));
      return res.json();
    }).then(function(){
      setToken(t);
      toast("Connected to GitHub");
      go(S.decks.length ? "edit" : "home");
    }).catch(function(err){
      S.token = was;
      fail(String(err && err.message || err));
    });
  }

  wrap.appendChild(el("div",{class:"panel"},[
    el("h3",{text:"Let this browser publish for you"}),
    el("p",{text:"Publishing means writing decks.json to the repo. Give this browser a token that can do only that, and the Publish button does the rest — no terminal, no commit."}),
    el("ol",{class:"steps"},[
      el("li",{html:'Open <code>github.com/settings/personal-access-tokens/new</code> — this is the <b>fine-grained</b> token page, not the classic one.'}),
      el("li",{html:'Resource owner <code>' + GH_OWNER + '</code>. Under <b>Repository access</b> choose <b>Only select repositories</b> and pick <code>' + GH_REPO + '</code>.'}),
      el("li",{html:'Under <b>Repository permissions</b> set <b>Contents</b> to <b>Read and write</b>. Leave every other permission alone.'}),
      el("li",{html:'Set an expiry you can live with, generate it, and copy the token — GitHub shows it once.'})
    ]),
    el("div",{class:"field"},[ el("label",{text:"Paste the token"}), tokIn ]),
    el("div",{class:"rowctl",style:"justify-content:flex-start"},[
      el("button",{class:"btn primary",onclick:connect},["Connect"]),
      el("button",{class:"btn ghost",onclick:downloadJSON},[icon(I.upload,15),"Download decks.json instead"])
    ])
  ]));

  wrap.appendChild(el("div",{class:"panel"},[
    el("h3",{text:"What the token can and can't do"}),
    el("p",{html:"Scoped that way it can change <b>one file in one repo</b> and nothing else — not your other repos, not your account, not your other GitHub data. It lives in this browser\'s storage, so treat this like a signed-in session: don\'t set it up on a shared or classroom machine, and hit Disconnect if you ever do. If it leaks, revoke it at <code>github.com/settings/tokens</code> and make a new one — nothing else needs changing."})
  ]));

  errBox = el("p",{class:"err",hidden:"hidden"});
  wrap.appendChild(errBox);
  stage.appendChild(wrap);
  setTimeout(function(){ tokIn.focus(); }, 0);
}

/* ============================ keyboard ============================ */
document.addEventListener("keydown", function(ev){
  var tag = (ev.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea" || tag === "select") return;
  if(ev.metaKey || ev.ctrlKey || ev.altKey) return;
  var s = S.session, k = ev.key;
  if(S.view === "flash" && s){
    if(k === " "){ ev.preventDefault(); s.flipped = !s.flipped; render(); }
    else if(k === "ArrowRight"){ ev.preventDefault(); advanceFlash(1); }
    else if(k === "ArrowLeft"){ ev.preventDefault(); advanceFlash(-1); }
    else if(k === "s" || k === "S"){ ev.preventDefault(); var c = s.cards[s.i]; if(c){ toggleStar(c.id); render(); } }
  } else if(S.view === "quiz" && s && s.i < s.cards.length){
    if(s.picked === null && /^[1-4]$/.test(k)){
      var idx = parseInt(k,10) - 1;
      if(idx < s.choices.length){ ev.preventDefault(); pickChoice(idx, s.choices[idx] === ans(s.cards[s.i]), s.cards[s.i]); }
    } else if((k === "Enter" || k === " ") && s.picked !== null){ ev.preventDefault(); nextQuiz(); }
  } else if(S.view === "write" && s && s.state && (k === "Enter" || k === " ")){
    ev.preventDefault(); nextWrite();
  } else if(S.view === "learn" && s && s.mode === "learn"){
    if(s.i >= s.queue.length){
      if(k === "Enter"){ ev.preventDefault(); learnContinueRound(); }
    } else if(!s.answer && s.kind === "choice" && /^[1-4]$/.test(k)){
      var li = parseInt(k,10) - 1;
      if(s.choices && li < s.choices.length){ ev.preventDefault(); learnPick(li); }
    } else if(s.answer && (k === "Enter" || k === " ")){ ev.preventDefault(); learnNext(); }
    if(k === "Escape"){ S.session = null; go("home"); }
  } else if(S.view !== "home" && k === "Escape"){
    S.session = null; go("home");
  }
});

/* ============================ boot ============================ */
try{ S.who = localStorage.getItem(WHO_KEY) || null; }catch(e){ S.who = null; }
try{ S.token = localStorage.getItem(TOKEN_KEY) || null; }catch(e){ S.token = null; }
S.open = ls(FOLD_KEY, {});
loadLocal();
$("whobtn").addEventListener("click", function(){ go("who"); });
refreshFoot();
renderRail();
render();

function copy(x){ return JSON.parse(JSON.stringify(x)); }
function currentStore(){ return {folders:S.folders, decks:S.decks}; }
function useStore(st){ st = copy(st || {folders:[], decks:[]}); S.folders = st.folders; S.decks = st.decks; }
// Accepts decks.json with or without folders, and drops a deck's folder if it points nowhere.
function normalizeStore(raw){
  var folders = (raw && Array.isArray(raw.folders) ? raw.folders : []).map(function(f){
    return {id: String(f.id || uid("f")), name: f.name || "Untitled folder"};
  });
  var ids = {}; folders.forEach(function(f){ ids[f.id] = true; });
  var list = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.decks) ? raw.decks : []);
  var decks = list.map(function(v, n){
    return {
      id: v.id || uid("d"),
      name: v.name || "Untitled deck",
      subject: v.subject || "",
      folder: ids[v.folder] ? v.folder : "",
      cards: (Array.isArray(v.cards) ? v.cards : []).map(function(c){
        return {id: c.id || uid(), term: c.term || "", def: c.def || ""};
      }),
      createdAt: v.createdAt || n
    };
  }).sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); });
  return {folders:folders, decks:decks};
}

fetch("decks.json", {cache:"no-store"})
  .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(function(raw){
    S.published = normalizeStore(raw);
    var draft = ls(DRAFT_KEY, null);
    if(draft){
      useStore(normalizeStore(draft));
      S.draft = true;
    } else {
      useStore(S.published);
    }
    S.ready = true;
    if(!S.deckId && S.decks.length) S.deckId = S.decks[0].id;
    refreshFoot(); renderRail();
    if(!S.who && S.decks.length) go("who"); else render();
  })
  .catch(function(err){
    S.ready = true; S.loadError = err;
    setSync(false, "Couldn't load decks");
    render();
  });

/* -------- pick up newly published decks without a reload --------
   Students leave this open; a publish should reach them on its own. Nothing is
   swapped out from under an editor with unsaved work or a student mid-session. */
function applyIncoming(){
  if(!S.incoming) return false;
  S.published = S.incoming; S.incoming = null;
  useStore(S.published);
  if(!deck() && S.decks.length) S.deckId = S.decks[0].id;
  renderRail();
  return true;
}
function pollPublished(){
  if(document.hidden || !S.ready || S.loadError) return;
  fetch("decks.json", {cache:"no-store"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(raw){
      if(!raw) return;
      var next = normalizeStore(raw);
      if(JSON.stringify(next) === JSON.stringify(S.published)) return;
      S.incoming = next;
      if(S.draft){                      // the editor's own unpublished work wins
        S.published = next; S.incoming = null;
        return toast("The published decks changed somewhere else");
      }
      if(S.session || S.view === "edit") return toast("New cards — they'll appear when you're done");
      applyIncoming();
      if(S.view === "home" || S.view === "folder") render();
      toast("Decks updated");
    })
    .catch(function(){});
}
setInterval(pollPublished, 60000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) pollPublished(); });
})();
</script>
